es \u2014 and never guess at a missing value"]]}, {"label": "TextMiner: reading the notes, honestly", "symbol": "TextMiner", "file": "autosolver.py", "blurb": "Plain English: from training records ALONE it learns which words and phrases predict the outcome \u2014 no peeking at the recipe. Negated mentions ('denies X') are kept as separate evidence from 'X', because clinical risk is often phrased negatively ('no home support'). That split alone bought +0.03 AUROC.", "code": "class TextMiner:\n    \"\"\"Learns discriminative note phrases FROM TRAINING DATA \u2014\n    no access to the spec. Unigrams + bigrams, minimum document\n    frequency, ranked by |label-rate lift| * sqrt(support);\n    features are presence bits with a negation window: a term\n    within 3 tokens after a negation cue does not count. Built\n    for hybrid tables where the outcome signal hides in a note\n    column; deterministic.\"\"\"\n\n    def __init__(self, top_k: int = 40, min_df: int = 5):\n        self.top_k = top_k\n        self.min_df = min_df\n        self.text_cols: List[str] = []\n        self.terms: List[str] = []\n\n    @staticmethod\n    def _text_columns(rows):\n        if not rows:\n            return []\n        out = []\n        for name in rows[0]:\n            if name.startswith(\"_\"):\n                continue\n            vals = [str(r.get(name, \"\")) for r in rows[:200]]\n            if vals and sum(len(v) for v in vals) / len(vals) > 40:\n                out.append(name)\n        return out\n\n    @staticmethod\n    def _grams(toks):\n        for t in toks:\n            yield t\n        for a, b in zip(toks, toks[1:]):\n            yield a + \" \" + b\n\n    @staticmethod\n    def _present(term, toks):\n        \"\"\"Returns (affirmed, negated) presence. Negated\n        occurrences are a SEPARATE feature, not a suppression:\n        clinical risk is often phrased negatively (\"no home\n        support\", \"no transportation\") and only the training\n        labels can say which sign a negated mention carries.\"\"\"\n        parts = term.split(\" \")\n        n = len(parts)\n        affirmed = negated = False\n        for i in range(len(toks) - n + 1):\n            if toks[i:i + n] == parts:\n                lo = max(0, i - 3)\n                if any(t in _NEG_TOKENS\n                       for t in toks[lo:i]):\n                    negated = True\n                else:\n                    affirmed = True\n        return affirmed, negated\n\n    def fit(self, rows, labels) -> \"TextMiner\":\n        self.text_cols = self._text_columns(rows)\n        if not self.text_cols:\n            return self\n        base = sum(1.0 for y in labels if y) / max(len(labels), 1)\n        df: Dict[str, int] = {}\n        pos: Dict[str, int] = {}\n        docs = []\n        for r, y in zip(rows, labels):\n            toks = []\n            for c in self.text_cols:\n                toks.extend(_tokens(str(r.get(c, \"\"))))\n            grams = set(self._grams(toks))\n            docs.append((toks, y))\n            for g in grams:\n                df[g] = df.get(g, 0) + 1\n                if y:\n                    pos[g] = pos.get(g, 0) + 1\n        scored = []\n        for g, d in df.items():\n            if d < self.min_df or d > 0.9 * len(rows):\n                continue\n            rate = pos.get(g, 0) / d\n            lift = abs(rate - base) * (d ** 0.5)\n            scored.append((lift, g))\n        scored.sort(key=lambda t: (-t[0], t[1]))\n        self.terms = [g for _s, g in scored[:self.top_k]]\n        return self\n\n    def encode(self, rows) -> List[List[float]]:\n        out = []\n        for r in rows:\n            toks = []\n            for c in self.text_cols:\n                toks.extend(_tokens(str(r.get(c, \"\"))))\n            feats: List[float] = []\n            for t in self.terms:\n                aff, neg = self._present(t, toks)\n                feats.append(1.0 if aff else 0.0)\n                feats.append(1.0 if neg else 0.0)\n            out.append(feats)\n        return out", "walk": [["Read every training note and find predictive phrases", "using only the training answers \u2014 never the recipe"], ["Keep denials separate from mentions", "'denies missing doses' and 'missing doses' are different evidence; in medicine the denial often points the other way"]]}, {"label": "autosolver_hybrid: the doctor's own model", "symbol": "autosolver_hybrid", "file": "autosolver.py", "blurb": "Tabular features PLUS mined note features into one logistic regression. The free challenger that beat the text-blind vendor by 0.12 on the capstone cohort.", "code": "def autosolver_hybrid():\n    \"\"\"The doctor's own model: tabular features through the\n    standard encoder PLUS mined note features injected as\n    numeric pseudo-columns. Blind to the spec; everything it\n    knows about the text it learned from training labels.\"\"\"\n    def solve(train_rows, train_labels, test_rows):\n        miner = TextMiner().fit(train_rows, train_labels)\n        aug_train = _augment(train_rows,\n                             miner.encode(train_rows))\n        aug_test = _augment(test_rows,\n                            miner.encode(test_rows))\n        model = LogisticBaseline().fit(aug_train, train_labels)\n        _publish_fit(\"autosolver_hybrid\", model, miner)\n        return model.score(aug_test)\n    return solve", "walk": [["Combine the table's numbers with the notes' phrases", "into one simple risk model"], ["Beat the text-blind vendor with it", "by 0.12 on the capstone cohort \u2014 the value of reading, measured"]]}, {"label": "Model transparency: real coefficients", "symbol": "_publish_fit", "file": "autosolver.py", "blurb": "Every fit publishes its actual learned weights with human names \u2014 categorical one-hots expanded, mined phrases labeled ('note phrase \"kg\" mentioned \u2014 raises risk'). Building this caught patient NAMES wearing risk weights; identifier-like columns are now excluded from features.", "code": "def _publish_fit(tag, model, miner=None):\n    try:\n        names = _feature_names(model.encoder, miner)\n        if len(names) != len(model.w):\n            LAST_FIT[tag] = {\"error\": \"name/weight mismatch\"}\n            return\n        ranked = sorted(zip(names, model.w),\n                        key=lambda t: -abs(t[1]))\n        LAST_FIT[tag] = {\n            \"kind\": \"logistic regression (standard library, \"\n                    \"deterministic, L2-regularized)\",\n            \"n_features\": len(names),\n            \"text_terms\": len(miner.terms) if miner else 0,\n            \"top\": [{\"name\": n, \"weight\": round(w, 3),\n                     \"direction\": \"raises risk\" if w > 0\n                     else \"lowers risk\"}\n                    for n, w in ranked[:12]\n                    if abs(w) > 1e-6]}\n    except Exception as e:                 # never break a run\n        LAST_FIT[tag] = {\"error\": str(e)}", "walk": [["Publish the model's actual learned weights, named", "'note phrase kg mentioned \u2014 raises risk' beside ejection fraction \u2014 the answer to 'but what did it actually learn?'"]]}, {"label": "run_showdown", "symbol": "run_showdown", "file": "autosolver.py", "blurb": "ceiling / baseline / vendor per tier, with a SELECTABLE baseline (hybrid as the floor) and a [bar:] verdict split from the baseline comparison \u2014 the meeting summary as a function.", "code": "def run_showdown(campaign, vendor: Callable,\n                 vendor_name: str = \"vendor\",\n                 train_seed_offset: int = 1000,\n                 baseline: Optional[Callable] = None,\n                 baseline_name: str = \"synthkit baseline\") -> ShowdownResult:\n    from .campaign import _judge\n    from .tableeval import (evaluate_prediction,\n                            resolve_prediction_metric)\n    from .tableplan import plan_table\n    from .tablespec import TableSpec\n    if campaign.goal != \"predict\":\n        raise ValueError(\"showdowns run on predict campaigns\")\n    if baseline is None:\n        baseline = autosolver()\n    tiers: List[ShowdownTier] = []\n    for tier in campaign.tiers:\n        spec = TableSpec.from_json(tier.spec_json)\n        train_spec = TableSpec.from_json(tier.spec_json)\n        train_spec.master_seed += train_seed_offset\n        train_bp = plan_table(train_spec)\n        test_bp = plan_table(spec)\n        outcome = campaign.outcome\n        n_train = len(train_bp.clean_rows)\n        n_test = len(test_bp.clean_rows)\n        train_rows = [\n            {k: v for k, v in row.items() if k != outcome}\n            for row in train_bp.dirty_rows[:n_train]]\n        train_labels = [\n            1 if train_bp.clean_rows[r][outcome] == \"True\" else 0\n            for r in range(n_train)]\n        test_rows = [\n            {k: v for k, v in row.items() if k != outcome}\n            for row in test_bp.dirty_rows[:n_test]]\n        v_scores = list(vendor(train_rows, train_labels,\n                               test_rows))\n        b_scores = baseline(train_rows, train_labels, test_rows)\n        v_rep = evaluate_prediction(test_bp, outcome, v_scores,\n                                    vendor_name)\n        b_rep = evaluate_prediction(test_bp, outcome, b_scores,\n                                    \"synthkit-baseline\")\n        tr = _judge(tier.conditions,\n                    lambda m: resolve_prediction_metric(v_rep, m))\n        tiers.append(ShowdownTier(\n            tier=tier.name,\n            ceiling=round(v_rep.ceiling_auroc, 4),\n            baseline_auroc=round(b_rep.auroc, 4),\n            vendor_auroc=round(v_rep.auroc, 4),\n            vendor_passed=tr.passed,\n        ))\n    return ShowdownResult(title=campaign.title,\n                          vendor_name=vendor_name,\n                          tiers=tiers,\n                          baseline_name=baseline_name)", "walk": [["Give both models the identical exam", "same data, same hidden answers, three difficulties"], ["Report ceiling, our model, and the vendor per tier", "with the pass-mark verdict kept separate from who beat whom \u2014 one line per tier, meeting-ready"]]}]}, {"file": "llmvendor.py", "name": "llmvendor", "blurb": "The chair a real model sat in: 26% trap rate characterized, intervened to 3.7% [1.6-8.4], 1,662 calls, 0 malformed.", "components": [{"label": "LLMExtractor", "symbol": "LLMExtractor", "file": "llmvendor.py", "blurb": "Blind prompts (elements, never distractors), JSON salvage, majority voting, reliability stats, and the extra_system intervention seam.", "code": "class LLMExtractor(ExtractorAdapter):\n    \"\"\"An outside LLM, adapted to the evaluator's contract.\"\"\"\n\n    def __init__(self, backend, spec: DataSpec,\n                 samples: int = 1, name: str = \"llm-vendor\",\n                 temperature: float = 0.0,\n                 max_tokens: int = 1200,\n                 extra_system: str = \"\"):\n        \"\"\"`extra_system` is the INTERVENTION seam: additional\n        system-prompt instructions appended after the element\n        list, for measuring what prompt-hardening buys against a\n        characterized failure mode. The base prompt stays blind;\n        interventions are explicit, named, and diffable.\"\"\"\n        if samples < 1:\n            raise ValueError(\"samples must be >= 1\")\n        self.backend = backend\n        self.samples = samples\n        self.name = name\n        self.temperature = temperature\n        self.max_tokens = max_tokens\n        self.extra_system = extra_system.strip()\n        self.system, self.task = self._prompts(spec)\n        if self.extra_system:\n            self.system += \"\\n\\n\" + self.extra_system\n        self.stats: Dict[str, int] = {\n            \"calls\": 0, \"malformed\": 0, \"empty\": 0,\n            \"voted_out\": 0}\n\n    # ---------------- prompt construction ----------------\n    @staticmethod\n    def _prompts(spec: DataSpec):\n        lines = []\n        for uf in spec.unstructured_fields:\n            for el in uf.target_elements:\n                lines.append(\"- {}: {}\".format(\n                    el.element_id, el.description))\n        system = (\n            \"You extract clinical information from notes. \"\n            \"Respond ONLY with a JSON array, no prose, no \"\n            \"markdown fences. Each item: {\\\"category\\\": <one of \"\n            \"the element ids below>, \\\"text\\\": <the exact \"\n            \"relevant text from the note, verbatim>}. If nothing \"\n            \"matches an element, omit it. Extract only what the \"\n            \"note ACTUALLY states.\\n\\nElements:\\n\" +\n            \"\\n\".join(lines))\n        task = (\"Note:\\n---\\n{}\\n---\\nJSON array only, starting \"\n                \"with '['.\")\n        return system, task\n\n    # ---------------- extraction ----------------\n    def _one_sample(self, doc_text: str) -> List[Extraction]:\n        self.stats[\"calls\"] += 1\n        raw = self.backend.complete(\n            self.task.format(doc_text), system=self.system,\n            max_tokens=self.max_tokens,\n            temperature=self.temperature)\n        arr = _find_json_array(raw or \"\")\n        if arr is None:\n            self.stats[\"malformed\"] += 1\n            return []\n        out: List[Extraction] = []\n        for item in arr:\n            if not isinstance(item, dict):\n                self.stats[\"malformed\"] += 1\n                continue\n            category = str(item.get(\"category\", \"\")).strip()\n            text = str(item.get(\"text\", \"\")).strip()\n            if category and text:\n                out.append(Extraction(category=category,\n                                      text=text))\n        if not out:\n            self.stats[\"empty\"] += 1\n        return out\n\n    def extract(self, doc_id: str,\n                doc_text: str) -> List[Extraction]:\n        if self.samples == 1:\n            return self._one_sample(doc_text)\n        tallies: Dict[tuple, int] = {}\n        keep_form: Dict[tuple, Extraction] = {}\n        for _ in range(self.samples):\n            seen_this_sample = set()\n            for ex in self._one_sample(doc_text):\n                key = (_norm(ex.category), _norm(ex.text))\n                if key in seen_this_sample:\n                    continue          # duplicates within one\n                seen_this_sample.add(key)\n                tallies[key] = tallies.get(key, 0) + 1\n                keep_form.setdefault(key, ex)\n        need = self.samples // 2 + 1\n    # ... (13 more lines in llmvendor.py) ...", "walk": [["Put an AI model in the tested seat, blind", "it's told what to find, never what the traps are"], ["Count its unreliability honestly", "unusable answers are tallied, majority voting is available, and an instruction tweak can be A/B tested"]]}, {"label": "_find_json_array", "symbol": "_find_json_array", "file": "llmvendor.py", "blurb": "Salvages arrays from fences and prose; hopeless output counts as malformed instead of crashing.", "code": "def _find_json_array(raw: str) -> Optional[list]:\n    \"\"\"Salvage a JSON array from model output that may include\n    prose or fences. Tries the whole string, then fenced blocks,\n    then the first bracketed span.\"\"\"\n    candidates = [raw.strip()]\n    if \"```\" in raw:\n        for block in raw.split(\"```\")[1::2]:\n            candidates.append(\n                block.replace(\"json\", \"\", 1).strip())\n    span = _first_balanced_array(raw)\n    if span:\n        candidates.append(span)\n    for cand in candidates:\n        try:\n            parsed = json.loads(cand)\n        except json.JSONDecodeError:\n            continue\n        if isinstance(parsed, list):\n            return parsed\n    return None", "walk": [["Salvage structured answers from messy AI replies", "answers arrive wrapped in prose and formatting; hopeless ones count as failures instead of crashing"]]}, {"label": "The linear salvage scanner", "symbol": "_first_balanced_array", "file": "llmvendor.py", "blurb": "Replaced a backtracking regex that spun FOREVER on a 3B model's unclosed-bracket rambles \u2014 one bug, three live incidents (frozen ticker, idle server, Ctrl-C traceback). String-aware bracket scan: 0.0001s on the killer input, 17 rambles counted calmly in its first real outing.", "code": "def _first_balanced_array(raw: str) -> str:\n    \"\"\"Linear scan for the first balanced [...] span, string-\n    aware. Replaces a backtracking regex that hung for MINUTES\n    on a rambling 3B's unclosed-bracket output (live catch:\n    the 154s frozen ticker and a CLI Ctrl-C traceback both\n    pointed at the same regex). O(n), immune to input shape.\"\"\"\n    start = -1\n    depth = 0\n    in_str = False\n    esc = False\n    for k, ch in enumerate(raw):\n        if in_str:\n            if esc:\n                esc = False\n            elif ch == \"\\\\\":\n                esc = True\n            elif ch == '\"':\n                in_str = False\n            continue\n        if ch == '\"':\n            in_str = True\n        elif ch == \"[\":\n            if depth == 0:\n                start = k\n            depth += 1\n        elif ch == \"]\":\n            if depth > 0:\n                depth -= 1\n                if depth == 0 and start >= 0:\n                    return raw[start:k + 1]\n    return \"\"", "walk": [["Scan long rambling replies in one safe pass", "the previous approach could spin forever on one bad reply \u2014 it froze a live run three different ways before being replaced; the fix handled 17 rambles in microseconds"]]}]}], "plain": "Field our own free, transparent model \u2014 and give any vendor's model the identical seat.", "steps": [["Standardize the messy table automatically", "dates in five formats become one; dollar signs and typos are cleaned; names and record numbers are excluded from evidence \u2014 they once snuck in wearing risk weights"], ["Learn which note phrases predict the outcome", "from training records alone \u2014 and 'denies missing doses' is kept separate from 'missing doses', because in medicine the denial often means the opposite"], ["Train a simple, explainable risk model", "classic logistic regression: every learned weight can be shown and named \u2014 no black box on our side"], ["Seat any vendor's model in the same chair", "same training data, same hidden answers \u2014 one AI vendor was measured falling for 26% of the traps, then improved to under 4% and re-verified"], ["Count when a tested AI fails to follow instructions", "a small model gave unusable answers on 17 of 24 calls \u2014 that unreliability is itself a finding, counted calmly instead of crashing"]]}, {"id": "gates", "stage": "", "note": "validation, semantic lint,\nstatistics \u2014 guarding every stage", "label": "Quality Gates", "color": "#B7791F", "blurb": "Three layers of gate: validation (lawful?), semantic lint (meant?), statistics (known?). Every check here was a human catch first.", "modules": [{"file": "lint.py", "name": "lint", "blurb": "Probe-based: plan real data, inspect realized properties. Tables L1-L6, corpora D1-D5.", "components": [{"label": "lint_table", "symbol": "lint_table", "file": "lint.py", "blurb": "L1 realized prevalence vs declared target (caught a 67%-vs-15-20% intercept pre-render), L2 derived magnitudes (the 10^150-dollar stay), L3 rule coupling, L4 fossils, L5 ignored name pools, L6 dropped mess clauses.", "code": "def lint_table(spec: TableSpec, description: str = \"\",\n               probe_rows: int = 300) -> LintReport:\n    \"\"\"Plan a deterministic probe and inspect what the spec\n    actually produces. Never raises for content reasons; the spec\n    must already validate.\"\"\"\n    from .tableplan import plan_table\n    spec.validate()\n    probe = TableSpec.from_json(spec.to_json())\n    probe.rows = min(spec.rows, probe_rows)\n    bp = plan_table(probe)\n    n = len(bp.clean_rows)\n    report = LintReport(probe_rows=n)\n    add = report.findings.append\n\n    rule_targets = {r.get(\"later\") for r in spec.rules\n                    if r.get(\"kind\") == \"date_after\"}\n    rule_targets |= {r.get(\"target\") for r in spec.rules\n                     if r.get(\"kind\") == \"derived\"}\n\n    # ---- L1: outcome prevalence ----\n    for oc in spec.outcomes:\n        name = oc[\"name\"]\n        if oc.get(\"kind\") == \"linear\":\n            vals = [float(r[name]) for r in bp.clean_rows]\n            mean = sum(vals) / n\n            var = sum((v - mean) ** 2 for v in vals) / n\n            tr_ = oc.get(\"target_range\")\n            if var < 1e-12:\n                add(LintFinding(\n                    \"WARN\", \"L1-degenerate\",\n                    \"outcome `{}` has zero variance \u2014 no signal \"\n                    \"to regress\".format(name)))\n            elif tr_ and not (float(tr_[0]) <= mean\n                              <= float(tr_[1])):\n                add(LintFinding(\n                    \"WARN\", \"L1-range\",\n                    \"outcome `{}` realizes mean {:.2f} against \"\n                    \"the declared target range [{}, {}] \u2014 \"\n                    \"adjust the intercept\".format(\n                        name, mean, tr_[0], tr_[1])))\n            else:\n                add(LintFinding(\n                    \"INFO\", \"L1-range\",\n                    \"outcome `{}` realizes mean {:.2f}, sd \"\n                    \"{:.2f}\".format(name, mean, var ** 0.5)))\n            continue\n        rate = sum(1 for r in bp.clean_rows\n                   if r[name] == \"True\") / n\n        target = oc.get(\"target_prevalence\")\n        if target:\n            lo, hi = float(target[0]), float(target[1])\n            if not (lo <= rate <= hi):\n                add(LintFinding(\n                    \"WARN\", \"L1-prevalence\",\n                    \"outcome `{}` realizes {:.1%} against the \"\n                    \"declared target [{:.0%}, {:.0%}] \u2014 adjust \"\n                    \"the intercept (more negative = rarer)\"\n                    .format(name, rate, lo, hi)))\n            else:\n                add(LintFinding(\n                    \"INFO\", \"L1-prevalence\",\n                    \"outcome `{}` realizes {:.1%}, inside its \"\n                    \"declared target\".format(name, rate)))\n        elif rate < 0.01 or rate > 0.9:\n            add(LintFinding(\n                \"WARN\", \"L1-degenerate\",\n                \"outcome `{}` realizes {:.1%} \u2014 nearly single-\"\n                \"class; prediction campaigns will be vacuous\"\n                .format(name, rate)))\n        else:\n            add(LintFinding(\n                \"INFO\", \"L1-prevalence\",\n                \"outcome `{}` realizes {:.1%} (no declared \"\n                \"target \u2014 add `target_prevalence: [lo, hi]` to \"\n                \"enforce)\".format(name, rate)))\n\n    # ---- L2: derived-value sanity ----\n    for rule in spec.rules:\n        if rule.get(\"kind\") != \"derived\":\n            continue\n        target = rule[\"target\"]\n        vals = []\n        for r in bp.clean_rows:\n            try:\n                vals.append(float(r[target]))\n            except ValueError:\n                pass\n        if not vals:\n            continue\n        top = max(abs(v) for v in vals)\n    # ... (63 more lines in lint.py) ...", "walk": [["Generate a sample and measure it against the promises", "the realized readmission rate versus the promised range \u2014 this catch is where 'the data means what you said' comes from"]]}, {"label": "lint_corpus", "symbol": "lint_corpus", "file": "lint.py", "blurb": "D1 never-planted elements, D2 unloaded traps, D3 id collisions, D4 flat styles, D5 trap-language coverage.", "code": "def lint_corpus(spec, description: str = \"\",\n                probe_docs: int = 30) -> LintReport:\n    \"\"\"Plans a deterministic probe corpus and inspects what the\n    document spec actually plants.\"\"\"\n    from .planner import plan_corpus\n    from .spec import DataSpec\n    assert isinstance(spec, DataSpec)\n    spec.validate()\n    probe = DataSpec.from_json(spec.to_json())\n    probe.corpus.size = min(spec.corpus.size, probe_docs)\n    blueprints = plan_corpus(probe)\n    n = len(blueprints)\n    report = LintReport(probe_rows=n)\n    add = report.findings.append\n\n    planted: dict = {}\n    distracted: dict = {}\n    styles: dict = {}\n    for bp in blueprints:\n        for note in bp.notes:\n            for el in note.elements:\n                planted[el.element_id] = planted.get(\n                    el.element_id, 0) + 1\n            for d in note.distractors:\n                distracted[d.distractor_id] = distracted.get(\n                    d.distractor_id, 0) + 1\n            for axis, val in note.style.items():\n                styles.setdefault(axis, set()).add(val)\n\n    element_ids = set()\n    distractor_ids = set()\n    for uf in spec.unstructured_fields:\n        for el in uf.target_elements:\n            element_ids.add(el.element_id)\n            if planted.get(el.element_id, 0) == 0:\n                add(LintFinding(\n                    \"WARN\", \"D1-never-planted\",\n                    \"element `{}` was never planted across {} \"\n                    \"probe documents \u2014 its recall will divide \"\n                    \"by zero conceptually; check probability \"\n                    \"and difficulty\".format(el.element_id, n)))\n        for dis in uf.distractors:\n            distractor_ids.add(dis.distractor_id)\n            if dis.density > 0 and distracted.get(\n                    dis.distractor_id, 0) == 0:\n                add(LintFinding(\n                    \"WARN\", \"D2-toothless\",\n                    \"distractor `{}` has density {} but landed \"\n                    \"in zero probe documents \u2014 the trap is \"\n                    \"unloaded\".format(dis.distractor_id,\n                                      dis.density)))\n\n    overlap = element_ids & distractor_ids\n    if overlap:\n        add(LintFinding(\n            \"WARN\", \"D3-collision\",\n            \"ids used as BOTH element and distractor: {} \u2014 \"\n            \"scoring cannot tell reward from trap\".format(\n                \", \".join(sorted(overlap)))))\n\n    for axis, vals in sorted(styles.items()):\n        if len(vals) == 1:\n            add(LintFinding(\n                \"INFO\", \"D4-flat-style\",\n                \"style axis `{}` drew a single value across \"\n                \"the probe \u2014 the corpus will read uniformly\"\n                .format(axis)))\n\n    if description:\n        text = description.lower()\n        if (\"trap\" in text or \"distractor\" in text) \\\n                and not distractor_ids:\n            add(LintFinding(\n                \"WARN\", \"D5-coverage\",\n                \"the description asks for traps/distractors \"\n                \"but the spec defines none\"))\n    return report", "walk": [["Do the same promise-check for document collections", "are the facts, traps, and styles landing at their declared rates"]]}]}], "plain": "Guard rails that run alongside every step: is the recipe lawful, does the data keep its promises, and are we sure?", "steps": [["Check the recipe is complete and lawful", "before anything is created"], ["Generate a sample and measure it against the promises", "'readmission was promised at 5-12% and lands at 9.3%' \u2014 the data means what the paragraph said"], ["Refuse to overclaim", "when the numbers can't support a verdict, the instrument says so and prescribes the sample size that would"]]}, {"id": "iface", "stage": "", "note": "CLI - bench - notebooks - Bedrock:\nthe doors into every stage", "label": "Interfaces & Backends", "color": "#0E6E64", "blurb": "One library, four doors: CLI, the calibration bench, self-contained notebooks, and pluggable LLM backends including AWS Bedrock.", "modules": [{"file": "gui.py", "name": "gui \u2014 the bench", "blurb": "Five numbered steps a clinician can walk without an engineer: plain-English banners, required/optional badges, live red/green readiness that GATES the buttons, jargon-free labels ('a table \u2014 one row per patient'), a governance strip, and depth styling (sheened raised buttons, inset editables, shadowed cards) so the eye knows what is pressable. Plus: async jobs with budget+cancel, fingerprint chip, persistence.", "components": [{"label": "build_info \u2014 the chip", "symbol": "build_info", "file": "gui.py", "blurb": "version - built date - fingerprint; matches `synthkit version` so 'am I current' is a glance. Caught a real install defect on first use.", "code": "def build_info() -> dict:\n    \"\"\"version \u00b7 built date \u00b7 fingerprint \u2014 the legible answer to\n    'am I on the latest?'. Compare against `synthkit version` in\n    a terminal: the CLI reads the same disk, so a match means\n    the bench serves what is installed.\"\"\"\n    import datetime\n    from . import __version__\n    pkg = Path(__file__).parent\n    newest = max(path.stat().st_mtime\n                 for path in pkg.glob(\"*.py\"))\n    return {\n        \"version\": __version__,\n        \"built\": datetime.date.fromtimestamp(\n            newest).isoformat(),\n        \"fingerprint\": build_fingerprint(),\n    }", "walk": [["Stamp the page with exactly which build is running", "one glance against the command line answers 'am I current' \u2014 it caught a real stale install on day one"]]}, {"label": "Async jobs with a budget", "symbol": "api_job", "file": "gui.py", "blurb": "A wedged ollama once served a 6-minute run for 106 minutes; jobs now time out readably and can be cancelled.", "code": "def api_job(payload: dict) -> dict:\n    import time\n    job = _JOBS.get(payload.get(\"id\", \"\"))\n    if job is None:\n        return {\"error\": \"unknown job\"}\n    elapsed = round(time.time() - job[\"started\"], 1)\n    status = job[\"status\"]\n    if status == \"running\" and job.get(\"cancelled\"):\n        status = \"cancelled\"\n    elif status == \"running\" and elapsed > JOB_BUDGET_S:\n        status = \"timeout\"\n    out = {\"status\": status, \"elapsed\": elapsed}\n    if status == \"done\":\n        out[\"result\"] = job[\"result\"]\n    elif status == \"error\":\n        out[\"error\"] = job[\"error\"]\n    elif status == \"timeout\":\n        out[\"error\"] = (\"job exceeded its {}s budget \u2014 the \"\n                        \"backend is likely crawling or wedged \"\n                        \"(a wedged ollama once served a 6-minute \"\n                        \"run for 106 minutes). The thread may \"\n                        \"still finish in the background; safe \"\n                        \"to move on.\".format(int(JOB_BUDGET_S)))\n    elif status == \"cancelled\":\n        out[\"error\"] = (\"cancelled \u2014 the current backend call \"\n                        \"may run to completion in the \"\n                        \"background, then stop\")\n    return out", "walk": [["Run long work in the background with a budget", "a stuck AI once served a 6-minute job for 106 minutes; now jobs tick visibly, time out readably, and can be cancelled"]]}, {"label": "Data transparency: preview + downloads", "symbol": "api_export", "file": "gui.py", "blurb": "The moment data exists: metric cards (records / corruptions / outcome-rate vs promise), a white scrollable preview with click-to-read-any-cell (the notes, full screen), and one-click downloads \u2014 messy CSV/JSON, the clean answer key, the corruption ledger.", "code": "def api_export(payload: dict) -> dict:\n    \"\"\"Return a run artifact for download. which: dirty|clean|\n    ledger; fmt: csv|json. Table runs only (documents live as\n    .txt on disk already).\"\"\"\n    import csv as _csv\n    import io\n    run = Path(payload[\"dir\"])\n    which = payload.get(\"which\", \"dirty\")\n    fmt = payload.get(\"fmt\", \"csv\")\n    if which == \"ledger\":\n        raw = (run / \"ledger.json\").read_text(encoding=\"utf-8\")\n        return {\"filename\": \"corruption_ledger.json\",\n                \"content\": raw, \"mime\": \"application/json\"}\n    path = run / (\"dirty.csv\" if which == \"dirty\"\n                  else \"clean.csv\")\n    raw = path.read_text(encoding=\"utf-8\")\n    label = (\"synthetic_data\" if which == \"dirty\"\n             else \"answer_key\")\n    if fmt == \"csv\":\n        return {\"filename\": label + \".csv\", \"content\": raw,\n                \"mime\": \"text/csv\"}\n    rows = list(_csv.DictReader(io.StringIO(raw)))\n    return {\"filename\": label + \".json\",\n            \"content\": json.dumps(rows, indent=1,\n                                  ensure_ascii=False),\n            \"mime\": \"application/json\"}", "walk": [["Hand over the run's files on click", "the messy data, the clean answer key, and the corruption ledger \u2014 CSV or JSON, straight to the browser"]]}, {"label": "The plain-English final report", "symbol": "_showdown_report", "file": "gui.py", "blurb": "After the showdown: what happened in plain terms, the hidden traps WITH example phrases pulled live from the spec, both methodologies, the trained model's actual coefficients as weight bars, color-coded per-tier verdicts, and the WINNER card on top.", "code": "def _showdown_report(camp, tiers, vendor_name, baseline_name):\n    \"\"\"Everything the plain-English final report needs: dataset\n    facts, trap examples pulled from the ACTUAL spec, model\n    methodology, per-tier verdicts, and the winner.\"\"\"\n    from .tablespec import TableSpec\n    spec = None\n    for t in camp.tiers:\n        if \"as-specified\" in t.name or spec is None:\n            spec = TableSpec.from_json(t.spec_json)\n            if \"as-specified\" in t.name:\n                break\n    oc = next((o for o in spec.outcomes\n               if o[\"name\"] == camp.outcome), spec.outcomes[0])\n    traps = []\n    mess_kinds = set()\n    note_cols = 0\n    for c in spec.columns:\n        if c.ctype == \"note\":\n            note_cols += 1\n            n = c.note or {}\n            for dis in n.get(\"distractors\", []):\n                phr = (dis.get(\"phrasings\") or [\"\"])[0]\n                if dis.get(\"excludes\"):\n                    traps.append({\n                        \"kind\": \"negation trap\",\n                        \"example\": phr,\n                        \"why\": \"appears ONLY in patients \"\n                               \"WITHOUT the risk \u2014 a model \"\n                               \"matching keywords without \"\n                               \"understanding negation gets \"\n                               \"this exactly backwards\"})\n                else:\n                    traps.append({\n                        \"kind\": \"history trap\",\n                        \"example\": phr,\n                        \"why\": \"an old, resolved finding \u2014 \"\n                               \"not current risk\"})\n            for el in n.get(\"elements\", [])[:2]:\n                traps.append({\n                    \"kind\": \"hidden signal\",\n                    \"example\": (el.get(\"phrasings\")\n                                or [\"\"])[0],\n                    \"why\": \"genuine risk, phrased informally \"\n                           \"\u2014 worth {} in the true risk \"\n                           \"model, invisible to any model \"\n                           \"that ignores the note\".format(\n                               el.get(\"weight\"))})\n        m = c.mess\n        for attr, label in [\n                (\"missing_rate\", \"missing values\"),\n                (\"typo_rate\", \"typos\"),\n                (\"format_rate\", \"mixed formats\"),\n                (\"outlier_rate\", \"implausible outliers\"),\n                (\"wrong_rate\", \"subtly wrong values\"),\n                (\"case_rate\", \"inconsistent casing\"),\n                (\"space_rate\", \"stray whitespace\")]:\n            if getattr(m, attr, 0):\n                mess_kinds.add(label)\n    if spec.duplicate_rate:\n        mess_kinds.add(\"duplicated rows\")\n    meth = {\n        \"autosolver\": \"standardizes every messy column \"\n            \"(dates to one format, numbers cleaned of $ and \"\n            \"commas, missing values handled), then fits a \"\n            \"logistic regression \u2014 a classic, transparent \"\n            \"statistical model. Pure standard-library code, \"\n            \"fully deterministic, zero external dependencies. \"\n            \"It does NOT read free-text fields.\",\n        \"autosolver_hybrid\": \"does everything autosolver does, \"\n            \"AND mines the free-text notes: from the training \"\n            \"records alone it learns which words and phrases \"\n            \"predict the outcome (keeping negated mentions \u2014 \"\n            \"'denies X' \u2014 as separate evidence from 'X'), \"\n            \"then feeds table features and text features into \"\n            \"one logistic regression. No hand-written rules, \"\n            \"no external libraries, fully deterministic.\",\n    }\n    key = \"as-specified\"\n    kt = next((t for t in tiers if key in t[\"tier\"]),\n              tiers[len(tiers) // 2] if tiers else None)\n    winner = None\n    if kt:\n        vw = kt[\"vendor\"] >= kt[\"baseline\"]\n        winner = {\n            \"name\": vendor_name if vw else baseline_name,\n            \"loser\": baseline_name if vw else vendor_name,\n            \"vendor_won\": vw,\n            \"tier\": kt[\"tier\"],\n            \"margin\": round(abs(kt[\"vendor\"]\n                                - kt[\"baseline\"]), 3)}\n    # ... (23 more lines in gui.py) ...", "walk": [["Assemble the plain-English final report", "dataset facts, trap examples quoted from the actual recipe, both methodologies, the model's real learned weights"], ["Name a winner and show why", "color-coded per-tier cards, winner on top \u2014 the slide that writes itself"]]}]}, {"file": "openai_compat.py", "name": "openai_compat", "blurb": "The open-source door. 'OpenAI-compatible' names the message FORMAT the local-serving world standardized on \u2014 llama.cpp, LM Studio, vLLM, llamafile \u2014 NOT the company: no ChatGPT, no account, traffic stays on the machine. This one backend put a $0 Llama-3B on the demo laptop.", "components": [{"label": "OpenAICompatBackend", "symbol": "OpenAICompatBackend", "file": "openai_compat.py", "blurb": "One class covering every OpenAI-dialect server; injectable transport, both response dialects, llamafile-citing errors. Field-proven: the ThinkPad rendered its first live clinical prose through it (7 verified first try / 1 retried / 0 fallbacks).", "code": "class OpenAICompatBackend:\n    name = \"openai\"\n\n    def __init__(self, base_url: str = \"\",\n                 model: str = \"local\",\n                 api_key: str = \"\",\n                 timeout_s: float = 300.0,\n                 opener=None):\n        self.base_url = (base_url\n                         or os.environ.get(\n                             \"SYNTHKIT_OPENAI_BASE\", \"\")\n                         or DEFAULT_BASE).rstrip(\"/\")\n        self.model = model or \"local\"\n        self.api_key = api_key or os.environ.get(\n            \"SYNTHKIT_OPENAI_KEY\", \"\")\n        self.timeout_s = timeout_s\n        self._opener = opener or urllib.request.urlopen\n\n    def complete(self, prompt: str, *, system: str = \"\",\n                 max_tokens: int = 3000,\n                 temperature: float = 0.0) -> str:\n        messages = []\n        if system:\n            messages.append({\"role\": \"system\",\n                             \"content\": system})\n        messages.append({\"role\": \"user\", \"content\": prompt})\n        body = json.dumps({\n            \"model\": self.model,\n            \"messages\": messages,\n            \"max_tokens\": int(max_tokens),\n            \"temperature\": float(temperature),\n        }).encode(\"utf-8\")\n        headers = {\"Content-Type\": \"application/json\"}\n        if self.api_key:\n            headers[\"Authorization\"] = \"Bearer \" + self.api_key\n        req = urllib.request.Request(\n            self.base_url + \"/chat/completions\",\n            data=body, headers=headers)\n        try:\n            with self._opener(req,\n                              timeout=self.timeout_s) as resp:\n                payload = json.loads(\n                    resp.read().decode(\"utf-8\"))\n        except urllib.error.URLError as e:\n            raise OpenAICompatError(\n                \"cannot reach {} \u2014 is the model server \"\n                \"running? (llamafile: `llamafile.exe -m \"\n                \"model.gguf --server --port 8080`) [{}]\".format(\n                    self.base_url, e))\n        except Exception as e:\n            raise OpenAICompatError(\n                \"openai-compat call failed: {}\".format(e))\n        try:\n            choice = payload[\"choices\"][0]\n            msg = choice.get(\"message\") or {}\n            text = msg.get(\"content\")\n            if text is None:\n                text = choice.get(\"text\")\n            if text is None:\n                raise KeyError(\"no content\")\n            return text\n        except (KeyError, IndexError, TypeError) as e:\n            raise OpenAICompatError(\n                \"unexpected response shape from {}: {}\".format(\n                    self.base_url, e))", "walk": [["Speak the standard local-AI message format", "one connector covers llama.cpp, LM Studio, vLLM and more \u2014 the format is named after OpenAI but nothing is sent to them; it works with the network unplugged"], ["Power the $0 demo", "a 3-billion-parameter model on the demo laptop wrote verified clinical prose through this door"]]}]}, {"file": "cli.py", "name": "cli", "blurb": "Everything scriptable: compile, render, lint, campaigns, trials, showdown, version.", "components": [{"label": "campaign-run --llm", "symbol": "cmd_campaign_run", "file": "cli.py", "blurb": "The vendor chair from the terminal: backend, model, samples, @file interventions, reliability line.", "code": "def cmd_campaign_run(args) -> int:\n    from .campaign import load_campaign, run_campaign, \\\n        write_campaign\n    camp = load_campaign(Path(args.campaign_dir))\n    extractor = None\n    if args.llm:\n        if camp.goal != \"extract\":\n            print(\"--llm runs an LLM vendor on extract \"\n                  \"campaigns only\", file=sys.stderr)\n            return 2\n        from .llmvendor import LLMExtractor\n        from .spec import DataSpec\n        spec = DataSpec.from_json(camp.tiers[0].spec_json)\n        extra = args.llm_extra_system\n        if extra.startswith(\"@\"):\n            extra = Path(extra[1:]).read_text(encoding=\"utf-8\")\n        extractor = LLMExtractor(\n            _backend(args.llm_backend, args.llm_model), spec,\n            samples=args.llm_samples,\n            name=args.name or \"llm-vendor\",\n            extra_system=extra)\n        solver = extractor\n    elif \":\" in args.solver:\n        mod_name, fn_name = args.solver.split(\":\", 1)\n        _cwd_importable()\n        solver = getattr(importlib.import_module(mod_name),\n                         fn_name)\n    else:\n        print(\"solver must be 'package.module:function' \"\n              \"(or pass --llm)\", file=sys.stderr)\n        return 2\n    arm = args.name or args.solver or \"llm-vendor\"\n    result = run_campaign(camp, solver, solver_name=arm)\n    write_campaign(Path(args.campaign_dir), camp, result,\n                   result_name=arm)\n    print(result.format_text())\n    if extractor is not None:\n        print(extractor.stats_line())\n    return 0 if result.highest_passed == len(\n        result.tier_results) else 1", "walk": [["Run the whole exam from a terminal", "everything the bench does, scriptable \u2014 including the AI vendor chair with reliability counting"]]}]}, {"file": "bedrock.py", "name": "bedrock", "blurb": "The work door: Converse API, injectable client, fully smoked without AWS.", "components": [{"label": "BedrockBackend", "symbol": "BedrockBackend", "file": "bedrock.py", "blurb": "Same contract as Ollama; boto3 deferred to first real call; the compiler, renderer, and vendor adapter take it unchanged.", "code": "class BedrockBackend:\n    name = \"bedrock\"\n\n    def __init__(self, model_id: str,\n                 client: Optional[object] = None,\n                 region: str = \"us-west-2\"):\n        if not model_id:\n            raise BedrockError(\"model_id is required \u2014 e.g. \"\n                               \"'anthropic.claude-3-5-sonnet-\"\n                               \"20240620-v1:0'\")\n        self.model_id = model_id\n        self.region = region\n        self._client = client\n\n    def _get_client(self):\n        if self._client is None:\n            try:\n                import boto3\n            except ImportError:\n                raise BedrockError(\n                    \"boto3 is not installed \u2014 `pip install \"\n                    \"boto3` (SageMaker kernels ship it)\")\n            self._client = boto3.client(\n                \"bedrock-runtime\", region_name=self.region)\n        return self._client\n\n    def complete(self, prompt: str, *, system: str = \"\",\n                 max_tokens: int = 3000,\n                 temperature: float = 0.0) -> str:\n        client = self._get_client()\n        kwargs = {\n            \"modelId\": self.model_id,\n            \"messages\": [{\"role\": \"user\",\n                          \"content\": [{\"text\": prompt}]}],\n            \"inferenceConfig\": {\n                \"maxTokens\": int(max_tokens),\n                \"temperature\": float(temperature),\n            },\n        }\n        if system:\n            kwargs[\"system\"] = [{\"text\": system}]\n        try:\n            response = client.converse(**kwargs)\n        except Exception as e:\n            raise BedrockError(\n                \"Bedrock converse failed for {}: {}\".format(\n                    self.model_id, e))\n        try:\n            parts = response[\"output\"][\"message\"][\"content\"]\n            return \"\".join(p.get(\"text\", \"\") for p in parts)\n        except (KeyError, TypeError) as e:\n            raise BedrockError(\n                \"unexpected Bedrock response shape: {}\".format(e))", "walk": [["Connect to the hospital's governed AWS models", "open-weight and Claude models inside existing governance \u2014 the sanctioned route when local isn't enough"]]}]}], "plain": "The doors in: a five-step bench a clinician can walk alone, a command line for engineers, and AI connections that stay on your terms.", "steps": [["Guide anyone through five numbered steps", "plain-English banners, red/green readiness on every required field, and buttons that refuse politely until the fields are ready"], ["Show the data the moment it exists", "metric cards, a scrollable preview where any cell \u2014 especially a full clinical note \u2014 opens to read, and one-click downloads of the data, the answer key, and the ledger"], ["End with a report a stakeholder can repeat", "what was tested, the traps with real example phrases, what our model actually learned (its real coefficients), and a named winner"], ["Connect to AI on your terms", "a free local model on the laptop itself, the hospital's governed cloud, or none at all \u2014 and 'OpenAI-compatible' names a message format, not the company: nothing goes to ChatGPT"]]}], "pipeline": {"spec": "so the request is exact, reviewable, and approved by a person before anything exists", "truth": "because grading is only honest when the answer key exists before the data does", "render": "so a model faces realistic mess while the exact truth sits safely beside it", "eval": "so every score is measured against planted truth AND the best score possible", "campaign": "so one lucky result can never pass \u2014 verdicts come from three difficulties with statistics attached", "solvers": "so every vendor claim is measured against a free, transparent challenger in the identical seat", "gates": "runs alongside every step \u2014 lawful recipe, kept promises, honest uncertainty", "iface": "runs alongside every step \u2014 the bench, the command line, and AI connections on your terms"}}</script>
<script>
var DATA=JSON.parse(document.getElementById('atlas').textContent);
var stage=document.getElementById('stage');
var crumbs=document.getElementById('crumbs');
function esc(s){return String(s).replace(/&/g,'&amp;')
 .replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hi(code){
 var s=esc(code);
 s=s.replace(/(&quot;|')((?:\\.|(?!\1)[^\\\n])*)(\1)/g,
  function(m){return '<span class="tok-s">'+m+'</span>';});
 s=s.replace(/(^|\n)([ \t]*#[^\n]*)/g,
  function(m,a,b){return a+'<span class="tok-c">'+b+
   '</span>';});
 s=s.replace(/\b(def|class|return|if|elif|else|for|while|try|except|finally|with|import|from|raise|yield|lambda|not|and|or|in|is|None|True|False|assert|continue|break|pass|global)\b/g,
  '<span class="tok-k">$1</span>');
 s=s.replace(/\b(self|cls)\b/g,
  '<span class="tok-d">$1</span>');
 return s;}
function setCrumbs(parts){
 var out=[];
 for(var i=0;i<parts.length;i++){
  var p=parts[i];
  if(i<parts.length-1){
   out.push('<a data-act="'+p.act+'" data-i="'+
    (p.i===undefined?'':p.i)+'">'+p.t+'</a>');}
  else{out.push('<b>'+p.t+'</b>');}}
 crumbs.innerHTML=out.join(' &nbsp;/&nbsp; ');}
function stepsHtml(steps,color,head){
 var h='<div class="narr"><div class="narrhead">'+head+
  '</div>';
 for(var i=0;i<steps.length;i++){
  h+='<div class="pstep"><span class="nchip" '+
   'style="background:'+color+'">'+(i+1)+'</span><span><b>'+
   esc(steps[i][0])+'</b><span class="why"> &mdash; '+
   esc(steps[i][1])+'</span></span></div>';}
 return h+'</div>';}
function hub(){
 setCrumbs([{t:'atlas'}]);
 var FLOW=['spec','truth','render','solvers','eval','campaign'];
 var RAILS=['gates','iface'];
 var byId={};
 for(var i=0;i<DATA.domains.length;i++){
  byId[DATA.domains[i].id]=[DATA.domains[i],i];}
 var W=1060,H=600,y=250,x0=118,dx=(W-2*x0)/(FLOW.length-1);
 var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
 s+='<defs><marker id="arr" viewBox="0 0 10 10" refX="9" '+
  'refY="5" markerWidth="7" markerHeight="7" orient="auto">'+
  '<path d="M0 0 L10 5 L0 10 z" fill="#8A97A3"/></marker>'+
  '</defs>';
 s+='<text x="'+(x0-84)+'" y="'+(y-26)+'" font-size="10" '+
  'fill="#5C6B78">an English</text>'+
  '<text x="'+(x0-84)+'" y="'+(y-13)+'" font-size="10" '+
  'fill="#5C6B78">paragraph</text>'+
  '<line x1="'+(x0-56)+'" y1="'+y+'" x2="'+(x0-44)+'" y2="'+y+
  '" stroke="#8A97A3" stroke-width="1.6" '+
  'marker-end="url(#arr)"/>';
 var k;
 for(k=0;k<FLOW.length-1;k++){
  var xa=x0+k*dx+46,xb=x0+(k+1)*dx-52;
  s+='<line x1="'+xa+'" y1="'+y+'" x2="'+xb+'" y2="'+y+
   '" stroke="#8A97A3" stroke-width="1.6" '+
   'marker-end="url(#arr)"/>';}
 var xe=x0+(FLOW.length-1)*dx;
 s+='<line x1="'+(xe+46)+'" y1="'+y+'" x2="'+(xe+62)+'" y2="'+
  y+'" stroke="#8A97A3" stroke-width="1.6" '+
  'marker-end="url(#arr)"/>'+
  '<text x="'+(xe+70)+'" y="'+(y-6)+'" font-size="10" '+
  'fill="#5C6B78">a measured</text>'+
  '<text x="'+(xe+70)+'" y="'+(y+7)+'" font-size="10" '+
  'fill="#5C6B78">verdict</text>';
 for(k=0;k<FLOW.length;k++){
  var pair=byId[FLOW[k]],d=pair[0],di=pair[1];
  var x=x0+k*dx,above=(k%2===0);
  s+='<g class="node" data-act="domain" data-i="'+di+'">'+
   '<circle class="halo" cx="'+x+'" cy="'+y+
   '" r="56" fill="'+d.color+'"/>'+
   '<circle class="plate" cx="'+x+'" cy="'+y+'" r="44" fill="'+d.color+
   '"/>'+
   '<text x="'+x+'" y="'+(y-1)+'" text-anchor="middle" '+
   'fill="#fff" font-size="10.5" font-weight="600">0'+
   (k+1)+'</text>'+
   '<text x="'+x+'" y="'+(y+13)+'" text-anchor="middle" '+
   'fill="#fff" font-size="9" opacity=".95">'+d.stage+
   '</text></g>';
  var ly=above?y-118:y+82;
  s+='<line x1="'+x+'" y1="'+(above?y-56:y+56)+'" x2="'+x+
   '" y2="'+(above?ly+30:ly-12)+'" stroke="'+d.color+
   '" stroke-width="1.2" opacity=".5"/>';
  s+='<text x="'+x+'" y="'+ly+'" text-anchor="middle" '+
   'font-size="11.5" font-weight="600" fill="#17222C">'+
   d.label+'</text>';
  var noteLines=d.note.split('\n');
  for(var q=0;q<noteLines.length;q++){
   s+='<text x="'+x+'" y="'+(ly+15+q*13)+
    '" text-anchor="middle" font-size="9.5" '+
    'fill="#5C6B78">'+noteLines[q]+'</text>';}}
 for(var r=0;r<RAILS.length;r++){
  var rp=byId[RAILS[r]],rd=rp[0],ri=rp[1];
  var ry=442+r*72;
  s+='<g class="node" data-act="domain" data-i="'+ri+'">'+
   '<rect class="halo" x="'+(x0-58)+'" y="'+(ry-26)+
   '" width="'+(W-2*x0+116)+'" height="52" rx="8" fill="'+
   rd.color+'"/>'+
   '<rect class="plate" x="'+(x0-50)+'" y="'+(ry-20)+'" width="'+
   (W-2*x0+100)+'" height="40" rx="5" fill="#fff" stroke="'+
   rd.color+'" stroke-width="2"/>'+
   '<text x="'+(x0-34)+'" y="'+(ry+4)+'" font-size="11.5" '+
   'font-weight="600" fill="'+rd.color+'">'+rd.label+
   '</text>'+
   '<text x="'+(W-x0+34)+'" y="'+(ry+4)+'" font-size="9.5" '+
   'text-anchor="end" fill="#5C6B78">'+
   rd.note.replace(/\n/g,' ')+'</text></g>';
  for(k=0;k<FLOW.length;k++){
   var tx=x0+k*dx;
   s+='<line x1="'+tx+'" y1="'+(ry-20)+'" x2="'+tx+'" y2="'+
    (r===0?y+140:ry-52)+'" stroke="'+rd.color+
    '" stroke-width="1" opacity=".18"/>';}}
 s+='</svg>';
 var narr='<div class="narr"><div class="narrhead">'+
  'THE PIPELINE IN PLAIN ENGLISH</div>';
 var order=[],r;
 for(r=0;r<DATA.domains.length;r++){
  if(DATA.domains[r].stage)order.push(r);}
 for(r=0;r<DATA.domains.length;r++){
  if(!DATA.domains[r].stage)order.push(r);}
 for(var q=0;q<order.length;q++){
  var dd=DATA.domains[order[q]];
  var bold=dd.plain.replace(/\.$/,'');
  if(!dd.stage)bold+=' (runs alongside every step)';
  narr+='<div class="pstep"><span class="nchip" '+
   'style="background:'+dd.color+'">'+(q+1)+
   '</span><span><b>'+esc(bold)+'</b><span class="why">'+
   ' &mdash; '+esc(DATA.pipeline[dd.id])+
   '</span></span></div>';}
 narr+='</div>';
 stage.innerHTML=s+'<div class="blurb">The pipeline reads '+
  'left to right: what happens to your paragraph. The two '+
  'rails below guard and expose every stage. Every node is '+
  'clickable: domain &rarr; modules &rarr; components '+
  '&rarr; the actual source.</div>'+narr;}
function domainView(i){
 var d=DATA.domains[i];
 setCrumbs([{t:'atlas',act:'hub'},{t:d.label}]);
 var W=980,H=340,cx=180,cy=H/2;
 var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
 var n=d.modules.length;
 for(var j=0;j<n;j++){
  var m=d.modules[j];
  var y=60+j*((H-100)/Math.max(n-1,1)),x=560;
  s+='<path d="M '+(cx+58)+' '+cy+' C 380 '+cy+', 380 '+y+
   ', '+(x-96)+' '+y+'" stroke="'+d.color+
   '" stroke-width="1.4" fill="none" opacity=".4"/>';
  s+='<g class="node" data-act="module" data-i="'+i+
   '" data-j="'+j+'">'+
   '<rect class="halo" x="'+(x-104)+'" y="'+(y-30)+
   '" width="208" height="60" rx="6" fill="'+d.color+'"/>'+
   '<rect class="plate" x="'+(x-96)+'" y="'+(y-24)+'" width="192" '+
   'height="48" rx="4" fill="#fff" stroke="'+d.color+
   '" stroke-width="2"/>'+
   '<text x="'+x+'" y="'+(y-3)+'" text-anchor="middle" '+
   'fill="#17222C" font-size="12" font-weight="600">'+
   m.name+'</text>'+
   '<text x="'+x+'" y="'+(y+13)+'" text-anchor="middle" '+
   'fill="'+d.color+'" font-size="9.5">'+
   m.components.length+' component'+
   (m.components.length>1?'s':'')+' &middot; '+m.file+
   '</text></g>';}
 s+='<circle cx="'+cx+'" cy="'+cy+'" r="58" fill="'+d.color+
  '"/>'+
  '<text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" '+
  'fill="#fff" font-size="11.5" font-weight="600">'+
  d.label+'</text></svg>';
 stage.innerHTML=s+'<div class="blurb">'+d.blurb+'</div>'+
  stepsHtml(d.steps,d.color,
   'WHAT HAPPENS HERE, STEP BY STEP');}
function moduleView(i,j){
 var d=DATA.domains[i],m=d.modules[j];
 setCrumbs([{t:'atlas',act:'hub'},
  {t:d.label,act:'domain',i:i},{t:m.name}]);
 var chips='';
 for(var k=0;k<m.components.length;k++){
  var c=m.components[k];
  chips+='<div class="chip" style="border-left-color:'+
   d.color+'" data-act="show" data-i="'+i+'" data-j="'+j+
   '" data-k="'+k+'" id="chip'+k+'">'+
   '<b>'+esc(c.label)+'</b><small>'+c.file+
   ' &middot; '+esc(c.symbol)+'</small></div>';}
 stage.innerHTML='<div class="explorer"><div>'+
  '<div class="blurb" style="margin:0 0 12px">'+m.blurb+
  '</div>'+chips+'</div><div id="codepane"></div></div>';
 showComp(i,j,0);}
function showComp(i,j,k){
 var d=DATA.domains[i],c=d.modules[j].components[k];
 var chipEls=document.querySelectorAll('.chip');
 for(var q=0;q<chipEls.length;q++){
  chipEls[q].className=(q===k)?'chip active':'chip';}
 document.getElementById('codepane').innerHTML=
  '<div class="codebox"><div class="codehead">synthkit/'+
  c.file+' &nbsp;&middot;&nbsp; <b>'+esc(c.symbol)+
  '</b></div>'+
  '<div class="compblurb">'+esc(c.blurb)+'</div>'+
  '<div class="walkwrap">'+
  stepsHtml(c.walk,d.color,'PLAIN ENGLISH WALKTHROUGH')+
  '</div>'+
  '<pre class="code">'+hi(c.code)+'</pre></div>';}
function findAct(el){
 while(el&&el!==document){
  if(el.getAttribute&&el.getAttribute('data-act')){
   return el;}
  el=el.parentNode;}
 return null;}
document.addEventListener('click',function(ev){
 var el=findAct(ev.target);
 if(!el)return;
 var act=el.getAttribute('data-act');
 var i=parseInt(el.getAttribute('data-i')||'0',10);
 var j=parseInt(el.getAttribute('data-j')||'0',10);
 var k=parseInt(el.getAttribute('data-k')||'0',10);
 if(act==='hub')hub();
 else if(act==='domain')domainView(i);
 else if(act==='module')moduleView(i,j);
 else if(act==='show')showComp(i,j,k);});
hub();
</script></script></body></html>
