 at a missing value"]]}, {"label": "TextMiner: reading the notes, honestly", "symbol": "TextMiner", "file": "autosolver.py", "blurb": "Plain English: from training records ALONE it learns which words and phrases predict the outcome \u2014 no peeking at the recipe. Negated mentions ('denies X') are kept as separate evidence from 'X', because clinical risk is often phrased negatively ('no home support'). That split alone bought +0.03 AUROC.", "code": "class TextMiner:\n    \"\"\"Learns discriminative note phrases FROM TRAINING DATA \u2014\n    no access to the spec. Unigrams + bigrams, minimum document\n    frequency, ranked by |label-rate lift| * sqrt(support);\n    features are presence bits with a negation window: a term\n    within 3 tokens after a negation cue does not count. Built\n    for hybrid tables where the outcome signal hides in a note\n    column; deterministic.\"\"\"\n\n    def __init__(self, top_k: int = 40, min_df: int = 5):\n        self.top_k = top_k\n        self.min_df = min_df\n        self.text_cols: List[str] = []\n        self.terms: List[str] = []\n\n    @staticmethod\n    def _text_columns(rows):\n        if not rows:\n            return []\n        out = []\n        for name in rows[0]:\n            if name.startswith(\"_\"):\n                continue\n            vals = [str(r.get(name, \"\")) for r in rows[:200]]\n            if vals and sum(len(v) for v in vals) / len(vals) > 40:\n                out.append(name)\n        return out\n\n    @staticmethod\n    def _grams(toks):\n        for t in toks:\n            yield t\n        for a, b in zip(toks, toks[1:]):\n            yield a + \" \" + b\n\n    @staticmethod\n    def _present(term, toks):\n        \"\"\"Returns (affirmed, negated) presence. Negated\n        occurrences are a SEPARATE feature, not a suppression:\n        clinical risk is often phrased negatively (\"no home\n        support\", \"no transportation\") and only the training\n        labels can say which sign a negated mention carries.\"\"\"\n        parts = term.split(\" \")\n        n = len(parts)\n        affirmed = negated = False\n        for i in range(len(toks) - n + 1):\n            if toks[i:i + n] == parts:\n                lo = max(0, i - 3)\n                if any(t in _NEG_TOKENS\n                       for t in toks[lo:i]):\n                    negated = True\n                else:\n                    affirmed = True\n        return affirmed, negated\n\n    def fit(self, rows, labels) -> \"TextMiner\":\n        self.text_cols = self._text_columns(rows)\n        if not self.text_cols:\n            return self\n        base = sum(1.0 for y in labels if y) / max(len(labels), 1)\n        df: Dict[str, int] = {}\n        pos: Dict[str, int] = {}\n        docs = []\n        for r, y in zip(rows, labels):\n            toks = []\n            for c in self.text_cols:\n                toks.extend(_tokens(str(r.get(c, \"\"))))\n            grams = set(self._grams(toks))\n            docs.append((toks, y))\n            for g in grams:\n                df[g] = df.get(g, 0) + 1\n                if y:\n                    pos[g] = pos.get(g, 0) + 1\n        scored = []\n        for g, d in df.items():\n            if d < self.min_df or d > 0.9 * len(rows):\n                continue\n            rate = pos.get(g, 0) / d\n            lift = abs(rate - base) * (d ** 0.5)\n            scored.append((lift, g))\n        scored.sort(key=lambda t: (-t[0], t[1]))\n        self.terms = [g for _s, g in scored[:self.top_k]]\n        return self\n\n    def encode(self, rows) -> List[List[float]]:\n        out = []\n        for r in rows:\n            toks = []\n            for c in self.text_cols:\n                toks.extend(_tokens(str(r.get(c, \"\"))))\n            feats: List[float] = []\n            for t in self.terms:\n                aff, neg = self._present(t, toks)\n                feats.append(1.0 if aff else 0.0)\n                feats.append(1.0 if neg else 0.0)\n            out.append(feats)\n        return out", "walk": [["Read every training note and find predictive phrases", "using only the training answers \u2014 never the recipe"], ["Keep denials separate from mentions", "'denies missing doses' and 'missing doses' are different evidence; in medicine the denial often points the other way"]]}, {"label": "autosolver_hybrid: the doctor's own model", "symbol": "autosolver_hybrid", "file": "autosolver.py", "blurb": "Tabular features PLUS mined note features into one logistic regression. The free challenger that beat the text-blind vendor by 0.12 on the capstone cohort.", "code": "def autosolver_hybrid():\n    \"\"\"The doctor's own model: tabular features through the\n    standard encoder PLUS mined note features injected as\n    numeric pseudo-columns. Blind to the spec; everything it\n    knows about the text it learned from training labels.\"\"\"\n    def solve(train_rows, train_labels, test_rows):\n        miner = TextMiner().fit(train_rows, train_labels)\n        aug_train = _augment(train_rows,\n                             miner.encode(train_rows))\n        aug_test = _augment(test_rows,\n                            miner.encode(test_rows))\n        model = LogisticBaseline().fit(aug_train, train_labels)\n        _publish_fit(\"autosolver_hybrid\", model, miner)\n        return model.score(aug_test)\n    return solve", "walk": [["Combine the table's numbers with the notes' phrases", "into one simple risk model"], ["Beat the text-blind vendor with it", "by 0.12 on the capstone cohort \u2014 the value of reading, measured"]]}, {"label": "Model transparency: real coefficients", "symbol": "_publish_fit", "file": "autosolver.py", "blurb": "Every fit publishes its actual learned weights with human names \u2014 categorical one-hots expanded, mined phrases labeled ('note phrase \"kg\" mentioned \u2014 raises risk'). Building this caught patient NAMES wearing risk weights; identifier-like columns are now excluded from features.", "code": "def _publish_fit(tag, model, miner=None):\n    try:\n        names = _feature_names(model.encoder, miner)\n        if len(names) != len(model.w):\n            LAST_FIT[tag] = {\"error\": \"name/weight mismatch\"}\n            return\n        ranked = sorted(zip(names, model.w),\n                        key=lambda t: -abs(t[1]))\n        LAST_FIT[tag] = {\n            \"kind\": \"logistic regression (standard library, \"\n                    \"deterministic, L2-regularized)\",\n            \"n_features\": len(names),\n            \"text_terms\": len(miner.terms) if miner else 0,\n            \"top\": [{\"name\": n, \"weight\": round(w, 3),\n                     \"direction\": \"raises risk\" if w > 0\n                     else \"lowers risk\"}\n                    for n, w in ranked[:12]\n                    if abs(w) > 1e-6]}\n    except Exception as e:                 # never break a run\n        LAST_FIT[tag] = {\"error\": str(e)}", "walk": [["Publish the model's actual learned weights, named", "'note phrase kg mentioned \u2014 raises risk' beside ejection fraction \u2014 the answer to 'but what did it actually learn?'"]]}, {"label": "run_showdown", "symbol": "run_showdown", "file": "autosolver.py", "blurb": "ceiling / baseline / vendor per tier, with a SELECTABLE baseline (hybrid as the floor) and a [bar:] verdict split from the baseline comparison \u2014 the meeting summary as a function.", "code": "def run_showdown(campaign, vendor: Callable,\n                 vendor_name: str = \"vendor\",\n                 train_seed_offset: int = 1000,\n                 baseline: Optional[Callable] = None,\n                 baseline_name: str = \"synthkit baseline\") -> ShowdownResult:\n    from .campaign import _judge\n    from .tableeval import (evaluate_prediction,\n                            resolve_prediction_metric)\n    from .tableplan import plan_table\n    from .tablespec import TableSpec\n    if campaign.goal != \"predict\":\n        raise ValueError(\"showdowns run on predict campaigns\")\n    if baseline is None:\n        baseline = autosolver()\n    tiers: List[ShowdownTier] = []\n    for tier in campaign.tiers:\n        spec = TableSpec.from_json(tier.spec_json)\n        train_spec = TableSpec.from_json(tier.spec_json)\n        train_spec.master_seed += train_seed_offset\n        train_bp = plan_table(train_spec)\n        test_bp = plan_table(spec)\n        outcome = campaign.outcome\n        n_train = len(train_bp.clean_rows)\n        n_test = len(test_bp.clean_rows)\n        train_rows = [\n            {k: v for k, v in row.items() if k != outcome}\n            for row in train_bp.dirty_rows[:n_train]]\n        train_labels = [\n            1 if train_bp.clean_rows[r][outcome] == \"True\" else 0\n            for r in range(n_train)]\n        test_rows = [\n            {k: v for k, v in row.items() if k != outcome}\n            for row in test_bp.dirty_rows[:n_test]]\n        v_scores = list(vendor(train_rows, train_labels,\n                               test_rows))\n        b_scores = baseline(train_rows, train_labels, test_rows)\n        v_rep = evaluate_prediction(test_bp, outcome, v_scores,\n                                    vendor_name)\n        b_rep = evaluate_prediction(test_bp, outcome, b_scores,\n                                    \"synthkit-baseline\")\n        tr = _judge(tier.conditions,\n                    lambda m: resolve_prediction_metric(v_rep, m))\n        tiers.append(ShowdownTier(\n            tier=tier.name,\n            ceiling=round(v_rep.ceiling_auroc, 4),\n            baseline_auroc=round(b_rep.auroc, 4),\n            vendor_auroc=round(v_rep.auroc, 4),\n            vendor_passed=tr.passed,\n        ))\n    return ShowdownResult(title=campaign.title,\n                          vendor_name=vendor_name,\n                          tiers=tiers,\n                          baseline_name=baseline_name)", "walk": [["Give both models the identical exam", "same data, same hidden answers, three difficulties"], ["Report ceiling, our model, and the vendor per tier", "with the pass-mark verdict kept separate from who beat whom \u2014 one line per tier, meeting-ready"]]}]}, {"file": "llmvendor.py", "name": "llmvendor", "blurb": "The chair a real model sat in: 26% trap rate characterized, intervened to 3.7% [1.6-8.4], 1,662 calls, 0 malformed.", "components": [{"label": "LLMExtractor", "symbol": "LLMExtractor", "file": "llmvendor.py", "blurb": "Blind prompts (elements, never distractors), JSON salvage, majority voting, reliability stats, and the extra_system intervention seam.", "code": "class LLMExtractor(ExtractorAdapter):\n    \"\"\"An outside LLM, adapted to the evaluator's contract.\"\"\"\n\n    def __init__(self, backend, spec: DataSpec,\n                 samples: int = 1, name: str = \"llm-vendor\",\n                 temperature: float = 0.0,\n                 max_tokens: int = 1200,\n                 extra_system: str = \"\"):\n        \"\"\"`extra_system` is the INTERVENTION seam: additional\n        system-prompt instructions appended after the element\n        list, for measuring what prompt-hardening buys against a\n        characterized failure mode. The base prompt stays blind;\n        interventions are explicit, named, and diffable.\"\"\"\n        if samples < 1:\n            raise ValueError(\"samples must be >= 1\")\n        self.backend = backend\n        self.samples = samples\n        self.name = name\n        self.temperature = temperature\n        self.max_tokens = max_tokens\n        self.extra_system = extra_system.strip()\n        self.system, self.task = self._prompts(spec)\n        if self.extra_system:\n            self.system += \"\\n\\n\" + self.extra_system\n        self.stats: Dict[str, int] = {\n            \"calls\": 0, \"malformed\": 0, \"empty\": 0,\n            \"voted_out\": 0}\n\n    # ---------------- prompt construction ----------------\n    @staticmethod\n    def _prompts(spec: DataSpec):\n        lines = []\n        for uf in spec.unstructured_fields:\n            for el in uf.target_elements:\n                lines.append(\"- {}: {}\".format(\n                    el.element_id, el.description))\n        system = (\n            \"You extract clinical information from notes. \"\n            \"Respond ONLY with a JSON array, no prose, no \"\n            \"markdown fences. Each item: {\\\"category\\\": <one of \"\n            \"the element ids below>, \\\"text\\\": <the exact \"\n            \"relevant text from the note, verbatim>}. If nothing \"\n            \"matches an element, omit it. Extract only what the \"\n            \"note ACTUALLY states.\\n\\nElements:\\n\" +\n            \"\\n\".join(lines))\n        task = (\"Note:\\n---\\n{}\\n---\\nJSON array only, starting \"\n                \"with '['.\")\n        return system, task\n\n    # ---------------- extraction ----------------\n    def _one_sample(self, doc_text: str) -> List[Extraction]:\n        self.stats[\"calls\"] += 1\n        raw = self.backend.complete(\n            self.task.format(doc_text), system=self.system,\n            max_tokens=self.max_tokens,\n            temperature=self.temperature)\n        arr = _find_json_array(raw or \"\")\n        if arr is None:\n            self.stats[\"malformed\"] += 1\n            return []\n        out: List[Extraction] = []\n        for item in arr:\n            if not isinstance(item, dict):\n                self.stats[\"malformed\"] += 1\n                continue\n            category = str(item.get(\"category\", \"\")).strip()\n            text = str(item.get(\"text\", \"\")).strip()\n            if category and text:\n                out.append(Extraction(category=category,\n                                      text=text))\n        if not out:\n            self.stats[\"empty\"] += 1\n        return out\n\n    def extract(self, doc_id: str,\n                doc_text: str) -> List[Extraction]:\n        if self.samples == 1:\n            return self._one_sample(doc_text)\n        tallies: Dict[tuple, int] = {}\n        keep_form: Dict[tuple, Extraction] = {}\n        for _ in range(self.samples):\n            seen_this_sample = set()\n            for ex in self._one_sample(doc_text):\n                key = (_norm(ex.category), _norm(ex.text))\n                if key in seen_this_sample:\n                    continue          # duplicates within one\n                seen_this_sample.add(key)\n                tallies[key] = tallies.get(key, 0) + 1\n                keep_form.setdefault(key, ex)\n        need = self.samples // 2 + 1\n    # ... (13 more lines in llmvendor.py) ...", "walk": [["Put an AI model in the tested seat, blind", "it's told what to find, never what the traps are"], ["Count its unreliability honestly", "unusable answers are tallied, majority voting is available, and an instruction tweak can be A/B tested"]]}, {"label": "_find_json_array", "symbol": "_find_json_array", "file": "llmvendor.py", "blurb": "Salvages arrays from fences and prose; hopeless output counts as malformed instead of crashing.", "code": "def _find_json_array(raw: str) -> Optional[list]:\n    \"\"\"Salvage a JSON array from model output that may include\n    prose or fences. Tries the whole string, then fenced blocks,\n    then the first bracketed span.\"\"\"\n    candidates = [raw.strip()]\n    if \"```\" in raw:\n        for block in raw.split(\"```\")[1::2]:\n            candidates.append(\n                block.replace(\"json\", \"\", 1).strip())\n    span = _first_balanced_array(raw)\n    if span:\n        candidates.append(span)\n    for cand in candidates:\n        try:\n            parsed = json.loads(cand)\n        except json.JSONDecodeError:\n            continue\n        if isinstance(parsed, list):\n            return parsed\n    return None", "walk": [["Salvage structured answers from messy AI replies", "answers arrive wrapped in prose and formatting; hopeless ones count as failures instead of crashing"]]}, {"label": "The linear salvage scanner", "symbol": "_first_balanced_array", "file": "llmvendor.py", "blurb": "Replaced a backtracking regex that spun FOREVER on a 3B model's unclosed-bracket rambles \u2014 one bug, three live incidents (frozen ticker, idle server, Ctrl-C traceback). String-aware bracket scan: 0.0001s on the killer input, 17 rambles counted calmly in its first real outing.", "code": "def _first_balanced_array(raw: str) -> str:\n    \"\"\"Linear scan for the first balanced [...] span, string-\n    aware. Replaces a backtracking regex that hung for MINUTES\n    on a rambling 3B's unclosed-bracket output (live catch:\n    the 154s frozen ticker and a CLI Ctrl-C traceback both\n    pointed at the same regex). O(n), immune to input shape.\"\"\"\n    start = -1\n    depth = 0\n    in_str = False\n    esc = False\n    for k, ch in enumerate(raw):\n        if in_str:\n            if esc:\n                esc = False\n            elif ch == \"\\\\\":\n                esc = True\n            elif ch == '\"':\n                in_str = False\n            continue\n        if ch == '\"':\n            in_str = True\n        elif ch == \"[\":\n            if depth == 0:\n                start = k\n            depth += 1\n        elif ch == \"]\":\n            if depth > 0:\n                depth -= 1\n                if depth == 0 and start >= 0:\n                    return raw[start:k + 1]\n    return \"\"", "walk": [["Scan long rambling replies in one safe pass", "the previous approach could spin forever on one bad reply \u2014 it froze a live run three different ways before being replaced; the fix handled 17 rambles in microseconds"]]}]}], "plain": "Field our own free, transparent model \u2014 and give any vendor's model the identical seat.", "steps": [["Standardize the messy table automatically", "dates in five formats become one; dollar signs and typos are cleaned; names and record numbers are excluded from evidence \u2014 they once snuck in wearing risk weights"], ["Learn which note phrases predict the outcome", "from training records alone \u2014 and 'denies missing doses' is kept separate from 'missing doses', because in medicine the denial often means the opposite"], ["Train a simple, explainable risk model", "classic logistic regression: every learned weight can be shown and named \u2014 no black box on our side"], ["Seat any vendor's model in the same chair", "same training data, same hidden answers \u2014 one AI vendor was measured falling for 26% of the traps, then improved to under 4% and re-verified"], ["Count when a tested AI fails to follow instructions", "a small model gave unusable answers on 17 of 24 calls \u2014 that unreliability is itself a finding, counted calmly instead of crashing"]]}, {"id": "gates", "stage": "", "note": "validation, semantic lint,\nstatistics \u2014 guarding every stage", "label": "Quality Gates", "color": "#B7791F", "blurb": "Three layers of gate: validation (lawful?), semantic lint (meant?), statistics (known?). Every check here was a human catch first.", "modules": [{"file": "lint.py", "name": "lint", "blurb": "Probe-based: plan real data, inspect realized properties. Tables L1-L6, corpora D1-D5.", "components": [{"label": "lint_table", "symbol": "lint_table", "file": "lint.py", "blurb": "L1 realized prevalence vs declared target (caught a 67%-vs-15-20% intercept pre-render), L2 derived magnitudes (the 10^150-dollar stay), L3 rule coupling, L4 fossils, L5 ignored name pools, L6 dropped mess clauses.", "code": "def lint_table(spec: TableSpec, description: str = \"\",\n               probe_rows: int = 300) -> LintReport:\n    \"\"\"Plan a deterministic probe and inspect what the spec\n    actually produces. Never raises for content reasons; the spec\n    must already validate.\"\"\"\n    from .tableplan import plan_table\n    spec.validate()\n    probe = TableSpec.from_json(spec.to_json())\n    probe.rows = min(spec.rows, probe_rows)\n    bp = plan_table(probe)\n    n = len(bp.clean_rows)\n    report = LintReport(probe_rows=n)\n    add = report.findings.append\n\n    rule_targets = {r.get(\"later\") for r in spec.rules\n                    if r.get(\"kind\") == \"date_after\"}\n    rule_targets |= {r.get(\"target\") for r in spec.rules\n                     if r.get(\"kind\") == \"derived\"}\n\n    # ---- L1: outcome prevalence ----\n    for oc in spec.outcomes:\n        name = oc[\"name\"]\n        if oc.get(\"kind\") == \"linear\":\n            vals = [float(r[name]) for r in bp.clean_rows]\n            mean = sum(vals) / n\n            var = sum((v - mean) ** 2 for v in vals) / n\n            tr_ = oc.get(\"target_range\")\n            if var < 1e-12:\n                add(LintFinding(\n                    \"WARN\", \"L1-degenerate\",\n                    \"outcome `{}` has zero variance \u2014 no signal \"\n                    \"to regress\".format(name)))\n            elif tr_ and not (float(tr_[0]) <= mean\n                              <= float(tr_[1])):\n                add(LintFinding(\n                    \"WARN\", \"L1-range\",\n                    \"outcome `{}` realizes mean {:.2f} against \"\n                    \"the declared target range [{}, {}] \u2014 \"\n                    \"adjust the intercept\".format(\n                        name, mean, tr_[0], tr_[1])))\n            else:\n                add(LintFinding(\n                    \"INFO\", \"L1-range\",\n                    \"outcome `{}` realizes mean {:.2f}, sd \"\n                    \"{:.2f}\".format(name, mean, var ** 0.5)))\n            continue\n        rate = sum(1 for r in bp.clean_rows\n                   if r[name] == \"True\") / n\n        target = oc.get(\"target_prevalence\")\n        if target:\n            lo, hi = float(target[0]), float(target[1])\n            if not (lo <= rate <= hi):\n                add(LintFinding(\n                    \"WARN\", \"L1-prevalence\",\n                    \"outcome `{}` realizes {:.1%} against the \"\n                    \"declared target [{:.0%}, {:.0%}] \u2014 adjust \"\n                    \"the intercept (more negative = rarer)\"\n                    .format(name, rate, lo, hi)))\n            else:\n                add(LintFinding(\n                    \"INFO\", \"L1-prevalence\",\n                    \"outcome `{}` realizes {:.1%}, inside its \"\n                    \"declared target\".format(name, rate)))\n        elif rate < 0.01 or rate > 0.9:\n            add(LintFinding(\n                \"WARN\", \"L1-degenerate\",\n                \"outcome `{}` realizes {:.1%} \u2014 nearly single-\"\n                \"class; prediction campaigns will be vacuous\"\n                .format(name, rate)))\n        else:\n            add(LintFinding(\n                \"INFO\", \"L1-prevalence\",\n                \"outcome `{}` realizes {:.1%} (no declared \"\n                \"target \u2014 add `target_prevalence: [lo, hi]` to \"\n                \"enforce)\".format(name, rate)))\n\n    # ---- L2: derived-value sanity ----\n    for rule in spec.rules:\n        if rule.get(\"kind\") != \"derived\":\n            continue\n        target = rule[\"target\"]\n        vals = []\n        for r in bp.clean_rows:\n            try:\n                vals.append(float(r[target]))\n            except ValueError:\n                pass\n        if not vals:\n            continue\n        top = max(abs(v) for v in vals)\n    # ... (63 more lines in lint.py) ...", "walk": [["Generate a sample and measure it against the promises", "the realized readmission rate versus the promised range \u2014 this catch is where 'the data means what you said' comes from"]]}, {"label": "lint_corpus", "symbol": "lint_corpus", "file": "lint.py", "blurb": "D1 never-planted elements, D2 unloaded traps, D3 id collisions, D4 flat styles, D5 trap-language coverage.", "code": "def lint_corpus(spec, description: str = \"\",\n                probe_docs: int = 30) -> LintReport:\n    \"\"\"Plans a deterministic probe corpus and inspects what the\n    document spec actually plants.\"\"\"\n    from .planner import plan_corpus\n    from .spec import DataSpec\n    assert isinstance(spec, DataSpec)\n    spec.validate()\n    probe = DataSpec.from_json(spec.to_json())\n    probe.corpus.size = min(spec.corpus.size, probe_docs)\n    blueprints = plan_corpus(probe)\n    n = len(blueprints)\n    report = LintReport(probe_rows=n)\n    add = report.findings.append\n\n    planted: dict = {}\n    distracted: dict = {}\n    styles: dict = {}\n    for bp in blueprints:\n        for note in bp.notes:\n            for el in note.elements:\n                planted[el.element_id] = planted.get(\n                    el.element_id, 0) + 1\n            for d in note.distractors:\n                distracted[d.distractor_id] = distracted.get(\n                    d.distractor_id, 0) + 1\n            for axis, val in note.style.items():\n                styles.setdefault(axis, set()).add(val)\n\n    element_ids = set()\n    distractor_ids = set()\n    for uf in spec.unstructured_fields:\n        for el in uf.target_elements:\n            element_ids.add(el.element_id)\n            if planted.get(el.element_id, 0) == 0:\n                add(LintFinding(\n                    \"WARN\", \"D1-never-planted\",\n                    \"element `{}` was never planted across {} \"\n                    \"probe documents \u2014 its recall will divide \"\n                    \"by zero conceptually; check probability \"\n                    \"and difficulty\".format(el.element_id, n)))\n        for dis in uf.distractors:\n            distractor_ids.add(dis.distractor_id)\n            if dis.density > 0 and distracted.get(\n                    dis.distractor_id, 0) == 0:\n                add(LintFinding(\n                    \"WARN\", \"D2-toothless\",\n                    \"distractor `{}` has density {} but landed \"\n                    \"in zero probe documents \u2014 the trap is \"\n                    \"unloaded\".format(dis.distractor_id,\n                                      dis.density)))\n\n    overlap = element_ids & distractor_ids\n    if overlap:\n        add(LintFinding(\n            \"WARN\", \"D3-collision\",\n            \"ids used as BOTH element and distractor: {} \u2014 \"\n            \"scoring cannot tell reward from trap\".format(\n                \", \".join(sorted(overlap)))))\n\n    for axis, vals in sorted(styles.items()):\n        if len(vals) == 1:\n            add(LintFinding(\n                \"INFO\", \"D4-flat-style\",\n                \"style axis `{}` drew a single value across \"\n                \"the probe \u2014 the corpus will read uniformly\"\n                .format(axis)))\n\n    if description:\n        text = description.lower()\n        if (\"trap\" in text or \"distractor\" in text) \\\n                and not distractor_ids:\n            add(LintFinding(\n                \"WARN\", \"D5-coverage\",\n                \"the description asks for traps/distractors \"\n                \"but the spec defines none\"))\n    return report", "walk": [["Do the same promise-check for document collections", "are the facts, traps, and styles landing at their declared rates"]]}]}], "plain": "Guard rails that run alongside every step: is the recipe lawful, does the data keep its promises, and are we sure?", "steps": [["Check the recipe is complete and lawful", "before anything is created"], ["Generate a sample and measure it against the promises", "'readmission was promised at 5-12% and lands at 9.3%' \u2014 the data means what the paragraph said"], ["Refuse to overclaim", "when the numbers can't support a verdict, the instrument says so and prescribes the sample size that would"]]}, {"id": "iface", "stage": "", "note": "CLI - bench - notebooks - Bedrock:\nthe doors into every stage", "label": "Interfaces & Backends", "color": "#0E6E64", "blurb": "One library, four doors: CLI, the calibration bench, self-contained notebooks, and pluggable LLM backends including AWS Bedrock.", "modules": [{"file": "gui.py", "name": "gui \u2014 the bench", "blurb": "Five numbered steps a clinician can walk without an engineer: plain-English banners, required/optional badges, live red/green readiness that GATES the buttons, jargon-free labels ('a table \u2014 one row per patient'), a governance strip, and depth styling (sheened raised buttons, inset editables, shadowed cards) so the eye knows what is pressable. Plus: async jobs with budget+cancel, fingerprint chip, persistence.", "components": [{"label": "build_info \u2014 the chip", "symbol": "build_info", "file": "gui.py", "blurb": "version - built date - fingerprint; matches `synthkit version` so 'am I current' is a glance. Caught a real install defect on first use.", "code": "def build_info() -> dict:\n    \"\"\"version \u00b7 built date \u00b7 fingerprint \u2014 the legible answer to\n    'am I on the latest?'. Compare against `synthkit version` in\n    a terminal: the CLI reads the same disk, so a match means\n    the bench serves what is installed.\"\"\"\n    import datetime\n    from . import __version__\n    pkg = Path(__file__).parent\n    newest = max(path.stat().st_mtime\n                 for path in pkg.glob(\"*.py\"))\n    return {\n        \"version\": __version__,\n        \"built\": datetime.date.fromtimestamp(\n            newest).isoformat(),\n        \"fingerprint\": build_fingerprint(),\n    }", "walk": [["Stamp the page with exactly which build is running", "one glance against the command line answers 'am I current' \u2014 it caught a real stale install on day one"]]}, {"label": "Async jobs with a budget", "symbol": "api_job", "file": "gui.py", "blurb": "A wedged ollama once served a 6-minute run for 106 minutes; jobs now time out readably and can be cancelled.", "code": "def api_job(payload: dict) -> dict:\n    import time\n    job = _JOBS.get(payload.get(\"id\", \"\"))\n    if job is None:\n        return {\"error\": \"unknown job\"}\n    elapsed = round(time.time() - job[\"started\"], 1)\n    status = job[\"status\"]\n    if status == \"running\" and job.get(\"cancelled\"):\n        status = \"cancelled\"\n    elif status == \"running\" and elapsed > JOB_BUDGET_S:\n        status = \"timeout\"\n    out = {\"status\": status, \"elapsed\": elapsed}\n    if status == \"done\":\n        out[\"result\"] = job[\"result\"]\n    elif status == \"error\":\n        out[\"error\"] = job[\"error\"]\n    elif status == \"timeout\":\n        out[\"error\"] = (\"job exceeded its {}s budget \u2014 the \"\n                        \"backend is likely crawling or wedged \"\n                        \"(a wedged ollama once served a 6-minute \"\n                        \"run for 106 minutes). The thread may \"\n                        \"still finish in the background; safe \"\n                        \"to move on.\".format(int(JOB_BUDGET_S)))\n    elif status == \"cancelled\":\n        out[\"error\"] = (\"cancelled \u2014 the current backend call \"\n                        \"may run to completion in the \"\n                        \"background, then stop\")\n    return out", "walk": [["Run long work in the background with a budget", "a stuck AI once served a 6-minute job for 106 minutes; now jobs tick visibly, time out readably, and can be cancelled"]]}, {"label": "Data transparency: preview + downloads", "symbol": "api_export", "file": "gui.py", "blurb": "The moment data exists: metric cards (records / corruptions / outcome-rate vs promise), a white scrollable preview with click-to-read-any-cell (the notes, full screen), and one-click downloads \u2014 messy CSV/JSON, the clean answer key, the corruption ledger.", "code": "def api_export(payload: dict) -> dict:\n    \"\"\"Return a run artifact for download. which: dirty|clean|\n    ledger; fmt: csv|json. Table runs only (documents live as\n    .txt on disk already).\"\"\"\n    import csv as _csv\n    import io\n    run = Path(payload[\"dir\"])\n    which = payload.get(\"which\", \"dirty\")\n    fmt = payload.get(\"fmt\", \"csv\")\n    if which == \"ledger\":\n        raw = (run / \"ledger.json\").read_text(encoding=\"utf-8\")\n        return {\"filename\": \"corruption_ledger.json\",\n                \"content\": raw, \"mime\": \"application/json\"}\n    path = run / (\"dirty.csv\" if which == \"dirty\"\n                  else \"clean.csv\")\n    raw = path.read_text(encoding=\"utf-8\")\n    label = (\"synthetic_data\" if which == \"dirty\"\n             else \"answer_key\")\n    if fmt == \"csv\":\n        return {\"filename\": label + \".csv\", \"content\": raw,\n                \"mime\": \"text/csv\"}\n    rows = list(_csv.DictReader(io.StringIO(raw)))\n    return {\"filename\": label + \".json\",\n            \"content\": json.dumps(rows, indent=1,\n                                  ensure_ascii=False),\n            \"mime\": \"application/json\"}", "walk": [["Hand over the run's files on click", "the messy data, the clean answer key, and the corruption ledger \u2014 CSV or JSON, straight to the browser"]]}, {"label": "The plain-English final report", "symbol": "_showdown_report", "file": "gui.py", "blurb": "After the showdown: what happened in plain terms, the hidden traps WITH example phrases pulled live from the spec, both methodologies, the trained model's actual coefficients as weight bars, color-coded per-tier verdicts, and the WINNER card on top.", "code": "def _showdown_report(camp, tiers, vendor_name, baseline_name):\n    \"\"\"Everything the plain-English final report needs: dataset\n    facts, trap examples pulled from the ACTUAL spec, model\n    methodology, per-tier verdicts, and the winner.\"\"\"\n    from .tablespec import TableSpec\n    spec = None\n    for t in camp.tiers:\n        if \"as-specified\" in t.name or spec is None:\n            spec = TableSpec.from_json(t.spec_json)\n            if \"as-specified\" in t.name:\n                break\n    oc = next((o for o in spec.outcomes\n               if o[\"name\"] == camp.outcome), spec.outcomes[0])\n    traps = []\n    mess_kinds = set()\n    note_cols = 0\n    for c in spec.columns:\n        if c.ctype == \"note\":\n            note_cols += 1\n            n = c.note or {}\n            for dis in n.get(\"distractors\", []):\n                phr = (dis.get(\"phrasings\") or [\"\"])[0]\n                if dis.get(\"excludes\"):\n                    traps.append({\n                        \"kind\": \"negation trap\",\n                        \"example\": phr,\n                        \"why\": \"appears ONLY in patients \"\n                               \"WITHOUT the risk \u2014 a model \"\n                               \"matching keywords without \"\n                               \"understanding negation gets \"\n                               \"this exactly backwards\"})\n                else:\n                    traps.append({\n                        \"kind\": \"history trap\",\n                        \"example\": phr,\n                        \"why\": \"an old, resolved finding \u2014 \"\n                               \"not current risk\"})\n            for el in n.get(\"elements\", [])[:2]:\n                traps.append({\n                    \"kind\": \"hidden signal\",\n                    \"example\": (el.get(\"phrasings\")\n                                or [\"\"])[0],\n                    \"why\": \"genuine risk, phrased informally \"\n                           \"\u2014 worth {} in the true risk \"\n                           \"model, invisible to any model \"\n                           \"that ignores the note\".format(\n                               el.get(\"weight\"))})\n        m = c.mess\n        for attr, label in [\n                (\"missing_rate\", \"missing values\"),\n                (\"typo_rate\", \"typos\"),\n                (\"format_rate\", \"mixed formats\"),\n                (\"outlier_rate\", \"implausible outliers\"),\n                (\"wrong_rate\", \"subtly wrong values\"),\n                (\"case_rate\", \"inconsistent casing\"),\n                (\"space_rate\", \"stray whitespace\")]:\n            if getattr(m, attr, 0):\n                mess_kinds.add(label)\n    if spec.duplicate_rate:\n        mess_kinds.add(\"duplicated rows\")\n    meth = {\n        \"autosolver\": \"standardizes every messy column \"\n            \"(dates to one format, numbers cleaned of $ and \"\n            \"commas, missing values handled), then fits a \"\n            \"logistic regression \u2014 a classic, transparent \"\n            \"statistical model. Pure standard-library code, \"\n            \"fully deterministic, zero external dependencies. \"\n            \"It does NOT read free-text fields.\",\n        \"autosolver_hybrid\": \"does everything autosolver does, \"\n            \"AND mines the free-text notes: from the training \"\n            \"records alone it learns which words and phrases \"\n            \"predict the outcome (keeping negated mentions \u2014 \"\n            \"'denies X' \u2014 as separate evidence from 'X'), \"\n            \"then feeds table features and text features into \"\n            \"one logistic regression. No hand-written rules, \"\n            \"no external libraries, fully deterministic.\",\n    }\n    key = \"as-specified\"\n    kt = next((t for t in tiers if key in t[\"tier\"]),\n              tiers[len(tiers) // 2] if tiers else None)\n    winner = None\n    if kt:\n        vw = kt[\"vendor\"] >= kt[\"baseline\"]\n        winner = {\n            \"name\": vendor_name if vw else baseline_name,\n            \"loser\": baseline_name if vw else vendor_name,\n            \"vendor_won\": vw,\n            \"tier\": kt[\"tier\"],\n            \"margin\": round(abs(kt[\"vendor\"]\n                                - kt[\"baseline\"]), 3)}\n    # ... (23 more lines in gui.py) ...", "walk": [["Assemble the plain-English final report", "dataset facts, trap examples quoted from the actual recipe, both methodologies, the model's real learned weights"], ["Name a winner and show why", "color-coded per-tier cards, winner on top \u2014 the slide that writes itself"]]}]}, {"file": "openai_compat.py", "name": "openai_compat", "blurb": "The open-source door. 'OpenAI-compatible' names the message FORMAT the local-serving world standardized on \u2014 llama.cpp, LM Studio, vLLM, llamafile \u2014 NOT the company: no ChatGPT, no account, traffic stays on the machine. This one backend put a $0 Llama-3B on the demo laptop.", "components": [{"label": "OpenAICompatBackend", "symbol": "OpenAICompatBackend", "file": "openai_compat.py", "blurb": "One class covering every OpenAI-dialect server; injectable transport, both response dialects, llamafile-citing errors. Field-proven: the Windows laptop rendered its first live clinical prose through it (7 verified first try / 1 retried / 0 fallbacks).", "code": "class OpenAICompatBackend:\n    name = \"openai\"\n\n    def __init__(self, base_url: str = \"\",\n                 model: str = \"local\",\n                 api_key: str = \"\",\n                 timeout_s: float = 300.0,\n                 opener=None):\n        self.base_url = (base_url\n                         or os.environ.get(\n                             \"SYNTHKIT_OPENAI_BASE\", \"\")\n                         or DEFAULT_BASE).rstrip(\"/\")\n        self.model = model or \"local\"\n        self.api_key = api_key or os.environ.get(\n            \"SYNTHKIT_OPENAI_KEY\", \"\")\n        self.timeout_s = timeout_s\n        self._opener = opener or urllib.request.urlopen\n\n    def complete(self, prompt: str, *, system: str = \"\",\n                 max_tokens: int = 3000,\n                 temperature: float = 0.0) -> str:\n        messages = []\n        if system:\n            messages.append({\"role\": \"system\",\n                             \"content\": system})\n        messages.append({\"role\": \"user\", \"content\": prompt})\n        body = json.dumps({\n            \"model\": self.model,\n            \"messages\": messages,\n            \"max_tokens\": int(max_tokens),\n            \"temperature\": float(temperature),\n        }).encode(\"utf-8\")\n        headers = {\"Content-Type\": \"application/json\"}\n        if self.api_key:\n            headers[\"Authorization\"] = \"Bearer \" + self.api_key\n        req = urllib.request.Request(\n            self.base_url + \"/chat/completions\",\n            data=body, headers=headers)\n        try:\n            with self._opener(req,\n                              timeout=self.timeout_s) as resp:\n                payload = json.loads(\n                    resp.read().decode(\"utf-8\"))\n        except urllib.error.URLError as e:\n            raise OpenAICompatError(\n                \"cannot reach {} \u2014 is the model server \"\n                \"running? (llamafile: `llamafile.exe -m \"\n                \"model.gguf --server --port 8080`) [{}]\".format(\n                    self.base_url, e))\n        except Exception as e:\n            raise OpenAICompatError(\n                \"openai-compat call failed: {}\".format(e))\n        try:\n            choice = payload[\"choices\"][0]\n            msg = choice.get(\"message\") or {}\n            text = msg.get(\"content\")\n            if text is None:\n                text = choice.get(\"text\")\n            if text is None:\n                raise KeyError(\"no content\")\n            return text\n        except (KeyError, IndexError, TypeError) as e:\n            raise OpenAICompatError(\n                \"unexpected response shape from {}: {}\".format(\n                    self.base_url, e))", "walk": [["Speak the standard local-AI message format", "one connector covers llama.cpp, LM Studio, vLLM and more \u2014 the format is named after OpenAI but nothing is sent to them; it works with the network unplugged"], ["Power the $0 demo", "a 3-billion-parameter model on the demo laptop wrote verified clinical prose through this door"]]}]}, {"file": "cli.py", "name": "cli", "blurb": "Everything scriptable: compile, render, lint, campaigns, trials, showdown, version.", "components": [{"label": "campaign-run --llm", "symbol": "cmd_campaign_run", "file": "cli.py", "blurb": "The vendor chair from the terminal: backend, model, samples, @file interventions, reliability line.", "code": "def cmd_campaign_run(args) -> int:\n    from .campaign import load_campaign, run_campaign, \\\n        write_campaign\n    camp = load_campaign(Path(args.campaign_dir))\n    extractor = None\n    if args.llm:\n        if camp.goal != \"extract\":\n            print(\"--llm runs an LLM vendor on extract \"\n                  \"campaigns only\", file=sys.stderr)\n            return 2\n        from .llmvendor import LLMExtractor\n        from .spec import DataSpec\n        spec = DataSpec.from_json(camp.tiers[0].spec_json)\n        extra = args.llm_extra_system\n        if extra.startswith(\"@\"):\n            extra = Path(extra[1:]).read_text(encoding=\"utf-8\")\n        extractor = LLMExtractor(\n            _backend(args.llm_backend, args.llm_model), spec,\n            samples=args.llm_samples,\n            name=args.name or \"llm-vendor\",\n            extra_system=extra)\n        solver = extractor\n    elif \":\" in args.solver:\n        mod_name, fn_name = args.solver.split(\":\", 1)\n        _cwd_importable()\n        solver = getattr(importlib.import_module(mod_name),\n                         fn_name)\n    else:\n        print(\"solver must be 'package.module:function' \"\n              \"(or pass --llm)\", file=sys.stderr)\n        return 2\n    arm = args.name or args.solver or \"llm-vendor\"\n    result = run_campaign(camp, solver, solver_name=arm)\n    write_campaign(Path(args.campaign_dir), camp, result,\n                   result_name=arm)\n    print(result.format_text())\n    if extractor is not None:\n        print(extractor.stats_line())\n    return 0 if result.highest_passed == len(\n        result.tier_results) else 1", "walk": [["Run the whole exam from a terminal", "everything the bench does, scriptable \u2014 including the AI vendor chair with reliability counting"]]}]}, {"file": "bedrock.py", "name": "bedrock", "blurb": "The work door: Converse API, injectable client, fully smoked without AWS.", "components": [{"label": "BedrockBackend", "symbol": "BedrockBackend", "file": "bedrock.py", "blurb": "Same contract as Ollama; boto3 deferred to first real call; the compiler, renderer, and vendor adapter take it unchanged.", "code": "class BedrockBackend:\n    name = \"bedrock\"\n\n    def __init__(self, model_id: str,\n                 client: Optional[object] = None,\n                 region: str = \"us-west-2\"):\n        if not model_id:\n            raise BedrockError(\"model_id is required \u2014 e.g. \"\n                               \"'anthropic.claude-3-5-sonnet-\"\n                               \"20240620-v1:0'\")\n        self.model_id = model_id\n        self.region = region\n        self._client = client\n\n    def _get_client(self):\n        if self._client is None:\n            try:\n                import boto3\n            except ImportError:\n                raise BedrockError(\n                    \"boto3 is not installed \u2014 `pip install \"\n                    \"boto3` (SageMaker kernels ship it)\")\n            self._client = boto3.client(\n                \"bedrock-runtime\", region_name=self.region)\n        return self._client\n\n    def complete(self, prompt: str, *, system: str = \"\",\n                 max_tokens: int = 3000,\n                 temperature: float = 0.0) -> str:\n        client = self._get_client()\n        kwargs = {\n            \"modelId\": self.model_id,\n            \"messages\": [{\"role\": \"user\",\n                          \"content\": [{\"text\": prompt}]}],\n            \"inferenceConfig\": {\n                \"maxTokens\": int(max_tokens),\n                \"temperature\": float(temperature),\n            },\n        }\n        if system:\n            kwargs[\"system\"] = [{\"text\": system}]\n        try:\n            response = client.converse(**kwargs)\n        except Exception as e:\n            raise BedrockError(\n                \"Bedrock converse failed for {}: {}\".format(\n                    self.model_id, e))\n        try:\n            parts = response[\"output\"][\"message\"][\"content\"]\n            return \"\".join(p.get(\"text\", \"\") for p in parts)\n        except (KeyError, TypeError) as e:\n            raise BedrockError(\n                \"unexpected Bedrock response shape: {}\".format(e))", "walk": [["Connect to the hospital's governed AWS models", "open-weight and Claude models inside existing governance \u2014 the sanctioned route when local isn't enough"]]}]}], "plain": "The doors in: a five-step bench a clinician can walk alone, a command line for engineers, and AI connections that stay on your terms.", "steps": [["Guide anyone through five numbered steps", "plain-English banners, red/green readiness on every required field, and buttons that refuse politely until the fields are ready"], ["Show the data the moment it exists", "metric cards, a scrollable preview where any cell \u2014 especially a full clinical note \u2014 opens to read, and one-click downloads of the data, the answer key, and the ledger"], ["End with a report a stakeholder can repeat", "what was tested, the traps with real example phrases, what our model actually learned (its real coefficients), and a named winner"], ["Connect to AI on your terms", "a free local model on the laptop itself, the hospital's governed cloud, or none at all \u2014 and 'OpenAI-compatible' names a message format, not the company: nothing goes to ChatGPT"]]}, {"id": "phase2", "label": "Learning From Real Data (first engine)", "stage": true, "color": "#7B4B94", "blurb": "Phase 2. Everything above INVENTS a population from a recipe. This stage learns one from an existing extract \u2014 fitting distributions, mess rates and the relationships between fields \u2014 and hands back an editable recipe. The privacy line is absolute: real data teaches PARAMETERS, and generation never touches a record.", "modules": [{"file": "../scripts/omop_wrangle.py", "name": "wrangler", "blurb": "Six clinical tables collapsed into one tidy row per visit: key normalisation, a temporal drug join, and an EAV lab panel pivoted wide.", "components": [{"label": "Tidy one row per visit", "symbol": "main", "file": "../scripts/omop_wrangle.py", "blurb": "Joins person, visits, conditions, procedures, drugs and measurements. Keys arrive as ints AND as leading-zero text in the same column, so every key is normalised or rows silently vanish; orphans are counted and reported rather than dropped in silence.", "code": "def main() -> None:\n    ap = argparse.ArgumentParser()\n    ap.add_argument(\"--src\", required=True,\n                    help=\"folder holding the OMOP CSVs\")\n    ap.add_argument(\"-o\", \"--out\", default=\"tidy_visits.csv\")\n    ap.add_argument(\"--max-labs\", type=int, default=24,\n                    help=\"pivot the N most common measurements\")\n    ap.add_argument(\"--report\", action=\"store_true\",\n                    help=\"print a wrangle report to stdout\")\n    a = ap.parse_args()\n    src = Path(a.src)\n    if not src.exists():\n        sys.exit(\"source folder not found: {}\".format(src))\n\n    rep = []\n\n    def note(msg):\n        rep.append(msg)\n\n    # ---------- person ----------\n    persons = {}\n    for r in read(src / \"person.csv\"):\n        pid = norm_key(r.get(\"person_id\", \"\"))\n        if not pid:\n            continue\n        yob = num(r.get(\"year_of_birth\", \"\"))\n        persons[pid] = {\n            \"year_of_birth\": int(yob) if yob else \"\",\n            \"gender\": clean(r.get(\"gender_source_value\", \"\")),\n            \"race\": clean(r.get(\"race_source_value\", \"\")),\n            \"ethnicity\": clean(r.get(\"ethnicity_source_value\", \"\")),\n        }\n    note(\"person.csv: {} patients\".format(len(persons)))\n\n    # ---------- visits (the spine) ----------\n    visits = {}\n    dupes = 0\n    for r in read(src / \"visit_occurrence.csv\"):\n        vid = norm_key(r.get(\"visit_occurrence_id\", \"\"))\n        if not vid:\n            continue\n        if vid in visits:\n            dupes += 1\n            continue\n        start = parse_date(r.get(\"visit_start_date\", \"\"))\n        end = parse_date(r.get(\"visit_end_date\", \"\"))\n        visits[vid] = {\n            \"visit_id\": vid,\n            \"person_id\": norm_key(r.get(\"person_id\", \"\")),\n            \"visit_start_date\": start,\n            \"visit_end_date\": end,\n            \"visit_type\": clean(r.get(\"visit_source_value\", \"\")),\n            \"admitted_from\": clean(\n                r.get(\"admitted_from_source_value\", \"\")),\n            \"span_days\": ((end - start).days\n                          if start and end else \"\"),\n        }\n    note(\"visit_occurrence.csv: {} visits ({} duplicate ids skipped)\"\n         .format(len(visits), dupes))\n\n    # ---------- conditions per visit ----------\n    cond = defaultdict(list)\n    orphan_c = 0\n    for r in read(src / \"condition_occurrence.csv\"):\n        vid = norm_key(r.get(\"visit_occurrence_id\", \"\"))\n        name = clean(r.get(\"concept_name\", \"\")) or \\\n            clean(r.get(\"condition_source_value\", \"\"))\n        if not vid or vid not in visits:\n            orphan_c += 1\n            continue\n        if name and name.lower() != \"no matching concept\":\n            cond[vid].append(name)\n    note(\"condition_occurrence.csv: {} visits carry conditions \"\n         \"({} rows without a resolvable visit)\"\n         .format(len(cond), orphan_c))\n\n    # ---------- procedures per visit ----------\n    proc = defaultdict(list)\n    proc_qty = defaultdict(float)\n    orphan_p = 0\n    for r in read(src / \"procedure_occurrence.csv\"):\n        vid = norm_key(r.get(\"visit_occurrence_id\", \"\"))\n        if not vid or vid not in visits:\n            orphan_p += 1\n            continue\n        name = clean(r.get(\"concept_name\", \"\")) or \\\n            clean(r.get(\"procedure_source_value\", \"\"))\n        if name:\n            proc[vid].append(name)\n        q = num(r.get(\"quantity\", \"\"))\n    # ... (134 more lines in omop_wrangle.py) ...", "walk": [["Join six clinical tables into one row per visit", "demographics, visits, conditions, procedures, medications and labs all have to meet in one place before anything can be measured"], ["Repair the join keys before trusting them", "the same identifier arrives as a number in one table and as text with a leading zero in another; without normalising them those visits silently vanish"], ["Count what could not be matched, out loud", "orphaned records are reported rather than quietly dropped, because a silent loss looks exactly like clean data"]]}]}, {"file": "../scripts/omop_profile.py", "name": "profiler", "blurb": "Measures patterns as parameters, never records. k-anonymity counts PEOPLE; extremes are withheld; nothing unconfirmed is imposed.", "components": [{"label": "Profile: parameters, never records", "symbol": "main", "file": "../scripts/omop_profile.py", "blurb": "Fits each column, measures missingness and contamination, and reports the joint structure. Every published number is an aggregate over at least k PATIENTS \u2014 the fix after a single heavy utiliser's thirty visits was found clearing a row-based threshold while describing one person.", "code": "def main() -> None:\n    ap = argparse.ArgumentParser()\n    ap.add_argument(\"--in\", dest=\"src\", required=True)\n    ap.add_argument(\"-o\", \"--out\", default=\"profile.json\")\n    ap.add_argument(\"--k\", type=int, default=10,\n                    help=\"minimum cell size (k-anonymity threshold)\")\n    ap.add_argument(\"--group-by\", default=\"\",\n                    help=\"column naming the PRIVACY UNIT, usually \"\n                         \"person_id. Every k-test then counts \"\n                         \"people rather than rows, and \"\n                         \"significance uses the person count \u2014 \"\n                         \"repeated encounters from one patient are \"\n                         \"neither protection nor independent \"\n                         \"evidence.\")\n    ap.add_argument(\"--report\", action=\"store_true\")\n    a = ap.parse_args()\n    k = a.k\n\n    with Path(a.src).open(encoding=\"utf-8-sig\", newline=\"\") as f:\n        rows = list(csv.DictReader(f))\n    if not rows:\n        sys.exit(\"no rows\")\n    cols = list(rows[0].keys())\n    N = len(rows)\n    gb = a.group_by if a.group_by in cols else \"\"\n    groups = ([str(r.get(gb, i)) for i, r in enumerate(rows)]\n              if gb else [str(i) for i in range(N)])\n    n_eff = len(set(groups))\n    if gb:\n        cols = [c for c in cols if c != gb]\n\n    columns, excluded, notes = {}, [], []\n    for c in cols:\n        vals = [r.get(c, \"\") for r in rows]\n        kind, _ = classify(c, vals, k)\n        missing = sum(1 for v in vals if str(v).strip() == \"\") / N\n        if kind == \"excluded_identifier\":\n            excluded.append(c)\n            continue\n        if kind == \"empty\":\n            excluded.append(c)\n            notes.append(\"{}: entirely empty\".format(c))\n            continue\n        if kind == \"constant\":\n            columns[c] = {\"kind\": \"constant\", \"n\": N,\n                          \"missing_rate\": round(missing, 4),\n                          \"note\": \"single value \u2014 carries no \"\n                                  \"information; a candidate to drop\"}\n            continue\n        if kind == \"numeric\":\n            p = profile_numeric(vals, k)\n        elif kind == \"binary\":\n            ones = sum(1 for v in vals if str(v).strip() == \"1\")\n            p = {\"kind\": \"binary\", \"n\": N,\n                 \"rate\": round(ones / N, 4)}\n        elif kind == \"categorical\":\n            p = profile_categorical(vals, k, groups)\n        elif kind == \"list\":\n            p = profile_list(vals, k, groups)\n        elif kind == \"date\":\n            ds = []\n            for v in vals:\n                for f in (\"%Y-%m-%d\", \"%m/%d/%Y\"):\n                    try:\n                        ds.append(datetime.strptime(\n                            str(v).strip(), f).date())\n                        break\n                    except ValueError:\n                        continue\n            if len(ds) >= k:\n                lo, hi = min(ds), max(ds)\n                span = max((hi - lo).days, 1)\n                nb = 10\n                buckets = [0] * nb\n                for d0 in ds:\n                    b = min(nb - 1,\n                            int(nb * (d0 - lo).days / (span + 1)))\n                    buckets[b] += 1\n                # suppress thin buckets to the k floor so a sparse\n                # month cannot single out a person by timing\n                bpeople = [set() for _ in range(nb)]\n                for d0, g in zip(ds, groups[:len(ds)]):\n                    bi2 = min(nb - 1,\n                              int(nb * (d0 - lo).days / (span + 1)))\n                    bpeople[bi2].add(g)\n                buckets = [b if len(bpeople[i]) >= k else 0\n                           for i, b in enumerate(buckets)]\n                if sum(buckets) == 0:\n                    buckets = [1] * nb\n                p = {\"kind\": \"date\", \"n\": len(ds),\n    # ... (307 more lines in omop_profile.py) ...", "walk": [["Measure every column as numbers rather than copying it", "what shape it has, how often it is missing, how often it is implausible"], ["Require at least ten PATIENTS behind every figure", "ten visits can be one person, and a rule counting visits would have published one heavy user's ward as a category"], ["Report how the fields move together, and how sure we are", "with hundreds of pairs tested, some always look convincing by chance; those are shown but never imposed"]]}, {"label": "Contamination-aware fitting", "symbol": "profile_numeric", "file": "../scripts/omop_profile.py", "blurb": "A gaussian column with 4% wild outliers reads as skewed and gets mis-fitted as lognormal, generating the wrong shape entirely. The family is chosen first, the body is trimmed in the space where that family is symmetric, and the extremes are declared separately as a mess rate.", "code": "def profile_numeric(vals, k):\n    xs = [num(v) for v in vals if str(v).strip() != \"\"]\n    xs = [x for x in xs if x is not None]\n    if len(xs) < k:\n        return None\n    zeros = sum(1 for x in xs if x == 0)\n    nz = [x for x in xs if x != 0]\n    body = nz if (zeros / len(xs) > 0.2 and len(nz) >= k) else xs\n    # Contamination guard. A handful of extreme values drags the\n    # fitted shape badly \u2014 a gaussian column with 4% wild outliers\n    # reads as right-skewed and gets fitted lognormal, which then\n    # generates the WRONG distribution. So fit the trimmed body and\n    # declare the outliers separately as a mess rate; synthkit's\n    # spec already speaks `outlier_rate`, so the contamination is\n    # reproduced as contamination rather than baked into the shape.\n    # Family FIRST, then trim in the space where that family is\n    # symmetric. A lognormal's long right tail is legitimate shape,\n    # not contamination \u2014 fencing it in raw space would erase the\n    # skew and mis-fit the column as normal.\n    lognormal_shape = (body and min(body) > 0\n                       and skew(body) > 0.75)\n    space = ([math.log(x) for x in body] if lognormal_shape\n             else list(body))\n    q1, q3 = pct(space, 0.25), pct(space, 0.75)\n    iqr = (q3 - q1) if (q1 is not None and q3 is not None) else 0\n    outlier_rate = 0.0\n    outlier_factor = None\n    if iqr > 0:\n        lo_f, hi_f = q1 - 2.5 * iqr, q3 + 2.5 * iqr\n        keep = [i for i, x in enumerate(space)\n                if lo_f <= x <= hi_f]\n        drop = [i for i, x in enumerate(space)\n                if not (lo_f <= x <= hi_f)]\n        if len(keep) >= k and drop:\n            outlier_rate = round(len(drop) / len(space), 4)\n            inside_raw = [body[i] for i in keep]\n            out_raw = [body[i] for i in drop]\n            med = pct(inside_raw, 0.5) or 1.0\n            if med:\n                outlier_factor = round(\n                    max(abs(max(out_raw, key=abs) / med), 1.5), 2)\n            body = inside_raw\n    degenerate = len(set(body)) < 2\n    fam, params = \"normal\", {}\n    if lognormal_shape and body and min(body) > 0:\n        logs = [math.log(x) for x in body]\n        fam = \"lognormal\"\n        params = {\"mu\": round(mean(logs), 4),\n                  \"sigma\": round(sd(logs), 4)}\n    else:\n        params = {\"mean\": round(mean(body), 4),\n                  \"sd\": round(sd(body), 4)}\n    out = {\n        \"kind\": \"numeric\", \"n\": len(xs),\n        \"degenerate_body\": degenerate,\n        \"family\": fam, \"params\": params,\n        \"p1\": round(pct(xs, 0.01), 4), \"p50\": round(pct(xs, 0.5), 4),\n        \"p99\": round(pct(xs, 0.99), 4),\n        \"integer_valued\": all(float(x).is_integer() for x in xs),\n        \"skew\": round(skew(xs), 3),\n    }\n    if zeros / len(xs) > 0.2:\n        out[\"zero_inflation\"] = round(zeros / len(xs), 4)\n    if outlier_rate:\n        out[\"outlier_rate\"] = outlier_rate\n        out[\"outlier_factor\"] = outlier_factor\n        out[\"fit_note\"] = (\"fitted on the trimmed body; the \"\n                           \"extremes are declared as a mess rate \"\n                           \"so contamination is reproduced as \"\n                           \"contamination, not as shape\")\n    if min(xs) >= 0 and fam == \"normal\":\n        m, s = params[\"mean\"], params[\"sd\"]\n        if s > 0 and m - 2 * s < 0:\n            out[\"warning\"] = (\"observed values are all >= 0 but a \"\n                              \"normal fit would emit negatives; \"\n                              \"generation must clamp at 0\")\n    return out", "walk": [["Decide what shape a column really has", "before trimming anything, because a long tail can be the shape itself rather than contamination"], ["Separate genuine outliers from the shape", "four percent of wild values makes an ordinary column look skewed and get described wrongly; the extremes are declared as their own rate instead"]]}]}, {"file": "condnet.py", "name": "condnet \u2014 the joint model", "blurb": "Learns the JOINT distribution rather than margins plus monotone links, so U-shapes and interactions survive. Every conditional table is a dial.", "components": [{"label": "CondNet: the joint distribution", "symbol": "CondNet", "file": "condnet.py", "blurb": "Discretises every column, learns parent sets by conditional mutual information, stores conditional tables and samples ancestrally. Reproduced a U-shaped relationship whose rank correlation was -0.019 \u2014 invisible to any correlation-based method.", "code": "class CondNet:\n    def __init__(self, k=10, max_parents=3, max_bins=0,\n                 alpha=0.01, seed=20260731,\n                 correction=\"bonferroni\", search_max_visits=0):\n        \"\"\"max_bins=0 means AUTO: resolution is chosen from how\n        much data there is to condition on. Finer bins describe\n        each column better but fragment the table \u2014 with three\n        parents at eight bins, four thousand rows spread across\n        four thousand cells and no dependence can be detected at\n        all. Auto solves bins^(parents+1) ~ n/k, the point where\n        cells stay populated enough to test.\"\"\"\n        # How the search pays for looking at many pairs. \"bonferroni\"\n        # divides alpha by every comparison made, which guarantees\n        # almost no false structure and, on a wide extract, suppresses\n        # a great deal of real structure too - 3,828 comparisons at an\n        # effective n of 800. \"none\" tests each pair at alpha and is\n        # for SCREENING ONLY: candidates found that way must be\n        # confirmed on patients the search never saw, which is a\n        # referee the threshold cannot be.\n        self.correction = correction\n        # Cap on visits per patient used to SEARCH for structure; 0\n        # uses every row. Tables are always fitted on every row.\n        self.search_max_visits = search_max_visits\n        self.k = k\n        self.max_parents = max_parents\n        self.max_bins = max_bins\n        self.alpha = alpha\n        self.seed = seed\n        self.order: List[str] = []\n        self.binnings: Dict[str, Binning] = {}\n        self.parents: Dict[str, List[str]] = {}\n        self.cpt: Dict[str, Dict[str, Dict[str, float]]] = {}\n        self.marginal: Dict[str, Dict[str, float]] = {}\n        self.report: Dict[str, Any] = {}\n\n    # -- learning ------------------------------------------------\n    def _mi(self, xs, ys):\n        joint = Counter(zip(xs, ys))\n        cx, cy = Counter(xs), Counter(ys)\n        n = len(xs)\n        mi = 0.0\n        for (a, b), c in joint.items():\n            pxy = c / n\n            mi += pxy * math.log(pxy / ((cx[a] / n) * (cy[b] / n)))\n        return mi, len(cx), len(cy)\n\n    def _cmi(self, xs, ys, zs):\n        \"\"\"I(X;Y|Z) \u2014 dependence that survives conditioning.\"\"\"\n        if not zs:\n            mi, nx, ny = self._mi(xs, ys)\n            return mi, (nx - 1) * (ny - 1)\n        buckets = defaultdict(lambda: ([], [], set()))\n        gs = getattr(self, \"groups\", None) or list(\n            range(len(xs)))\n        for i, (x, y, z) in enumerate(zip(xs, ys, zs)):\n            buckets[z][0].append(x)\n            buckets[z][1].append(y)\n            buckets[z][2].add(gs[i])\n        n = len(xs)\n        total, df = 0.0, 0\n        # An INTERACTION means the effect lives inside ONE stratum.\n        # The pooled test averages it across all strata while\n        # summing the degrees of freedom across all of them, so it\n        # is weakest exactly where interactions live. Alongside the\n        # pooled statistic we therefore keep the strongest single\n        # stratum, tested on its own people and corrected for how\n        # many strata were inspected.\n        best_g, best_df, best_n, n_strata = 0.0, 1, 0, 0\n        for z, (bx, by, ppl) in buckets.items():\n            if len(ppl) < self.k:\n                continue\n            n_strata += 1\n            mi, nx, ny = self._mi(bx, by)\n            total += (len(bx) / n) * mi\n            df += (nx - 1) * (ny - 1)\n            g = 2.0 * len(ppl) * mi\n            if g > best_g:\n                best_g, best_df = g, max((nx - 1) * (ny - 1), 1)\n                best_n = len(ppl)\n        self._last_stratum = (best_g, best_df, best_n,\n                              max(n_strata, 1))\n        return total, max(df, 1)\n\n    def _unmodellable(self, col, values, n_rows, groups=None):\n        \"\"\"None if the column may be modelled, else why not.\n\n        Bound: a categorical's transition table has levels^2 cells, so\n        levels^2 must not exceed the observations available to fill\n        them at k apiece. The floor of MIN_LEVEL_BUDGET keeps a small\n        extract from having ordinary categoricals pruned out of it.\"\"\"\n    # ... (2081 more lines in condnet.py) ...", "walk": [["Turn every column into bands", "so the relationship between any two of them can be stored as a simple table of what follows what"], ["Find which fields actually explain which", "using a measure that detects dependence of ANY shape, not just the straight-line kind"], ["Store the answer as tables and draw new patients from them", "a table can describe any pattern at all \u2014 including one that reverses direction, which a correlation reports as nothing"]]}, {"label": "Missingness as a pattern", "symbol": "Binning", "file": "condnet.py", "blurb": "Absence gets its own bin, so 'this lab is ordered mainly for the sick' is captured as structure. Point masses \u2014 zeros, detection limits, clamped floors \u2014 are stored as atoms and emitted verbatim, because interval sampling can never produce an exact repeated value.", "code": "class Binning:\n    \"\"\"How one column becomes discrete symbols and back again.\"\"\"\n\n    def __init__(self, name, kind, edges=None, levels=None,\n                 integer=False, missing_rate=0.0, fine=None,\n                 atoms=None, clamp=None, nonneg=False):\n        self.name = name\n        self.kind = kind                  # numeric | categorical\n        self.edges = edges or []          # len = nbins + 1\n        self.levels = levels or []\n        self.integer = integer\n        self.missing_rate = missing_rate\n        # TWO resolutions, deliberately. `edges` are the coarse\n        # bins used for CONDITIONING \u2014 they must stay wide enough\n        # that cells keep enough rows to detect dependence. `fine`\n        # is a denser quantile grid used only to reconstruct a\n        # VALUE once a bin has been chosen, so the column's own\n        # distribution survives the discretization. Conditioning\n        # power and marginal fidelity stop competing.\n        self.fine = fine or []\n        # Point masses. Clinical numbers pile up on exact values \u2014\n        # zeros, detection limits, clamped floors, defaults. No\n        # amount of interval sampling reproduces \"exactly 0.4 in\n        # 4% of rows\", so repeated values are stored as atoms with\n        # their own probability and emitted verbatim.\n        self.atoms = atoms or {}\n        # Plausibility bounds. Tail extrapolation exists so the\n        # generated distribution keeps its spread after the outer\n        # bin edges were pulled in to p1/p99 \u2014 but on a sparse bin\n        # it can overshoot into values that cannot occur. A\n        # diastolic pressure of 37 in a clinical demo undermines\n        # every credible number beside it, so emitted values are\n        # held inside a band the data itself supports: the\n        # published percentiles widened by half an interquartile\n        # range, and never through zero for a quantity that is\n        # never observed negative.\n        self.clamp = clamp or []\n        self.nonneg = nonneg\n\n    # -- learning ------------------------------------------------\n    @staticmethod\n    def learn(name, values, k, max_bins=10, min_level_count=None,\n              groups=None):\n        \"\"\"`groups` names the PRIVACY UNIT for each row \u2014 usually\n        the patient. Every k-test then counts distinct people, not\n        rows. It matters enormously: 931 visits from 92 patients\n        means a cell holding ten rows can be one person's ten\n        visits, and k-anonymity on rows would be no protection at\n        all. With no groups supplied each row is its own unit, so\n        behaviour is unchanged.\"\"\"\n        gs = groups or [str(i) for i in range(len(values))]\n        pairs = [(v, g) for v, g in zip(values, gs)\n                 if str(v).strip() != \"\"]\n        present = [v for v, _ in pairs]\n        miss = 1.0 - (len(present) / max(1, len(values)))\n        nums = [_num(v) for v in present]\n        numeric = present and all(x is not None for x in nums)\n        if numeric:\n            distinct = sorted(set(nums))\n            # A numeric column with few distinct values \u2014 a 0/1\n            # outcome, a small count, a coded category \u2014 must NOT\n            # be quantile-binned: the quantiles collapse onto the\n            # same value, the column reads as constant and gets\n            # dropped. That silently destroyed outcome columns, so\n            # low-cardinality numerics are modelled by their actual\n            # values instead.\n            if len(distinct) <= max(2 * max_bins, 12):\n                by_v = defaultdict(set)\n                for v, g in pairs:\n                    x = _num(v)\n                    if x is not None:\n                        by_v[x].add(g)\n                keep = [v for v in distinct\n                        if len(by_v.get(v, ())) >= k]\n                if len(keep) >= 2:\n                    return Binning(\n                        name, \"discrete\",\n                        levels=[repr(v) for v in keep],\n                        integer=all(float(v).is_integer()\n                                    for v in distinct),\n                        missing_rate=miss)\n        if numeric:\n            xs = [x for x in nums if x is not None]\n            # bin count is bounded by how many rows each bin must\n            # hold: a bin thinner than k cannot be published\n            nb = max(2, min(max_bins, len(xs) // max(k, 1)))\n            # Bin edges are order statistics \u2014 real observed\n            # values. Interior quantiles are heavily aggregated and\n            # safe to publish, but the outermost edges would be the\n            # true MINIMUM and MAXIMUM, i.e. two specific people's\n    # ... (209 more lines in condnet.py) ...", "walk": [["Give 'missing' its own band", "because whether a test was ordered is itself informative \u2014 a lab absent for the healthy and present for the sick is a pattern worth reproducing"], ["Keep exact repeated values exactly", "zeros, detection limits and default readings pile up on one number, and drawing from a range would never reproduce that"], ["Never publish anyone's true minimum or maximum", "the extremes belong to individuals; the bands stop short of them and the tails are extrapolated instead"]]}, {"label": "Generating patients, not rows", "symbol": "CondNet.sample_patients", "file": "condnet.py", "blurb": "Draws a person once \u2014 their fixed traits and how many times they are seen \u2014 then their visits in order, each conditioned on those traits AND on the visit before. Row-wise sampling gives a pile of encounters with no clinical course; measured visit-to-visit correlation 0.70 against a source of 0.78, where independent rows give 0.03.", "code": "    def sample_patients(self, n_patients: int, seed: int = 0,\n                        max_visits: int = 0\n                        ) -> List[Dict[str, Any]]:\n        \"\"\"Generate PEOPLE, each with a course of visits.\n\n        A patient is drawn once \u2014 their fixed traits, and how many\n        times they are seen. Their visits are then drawn in order,\n        each one conditioned on the patient's traits and on the\n        visit before it, so a value that drifts drifts plausibly\n        instead of being redrawn from scratch every row.\n\n        Row-wise sampling cannot produce this. It is also what\n        makes a synthetic dataset behave like real longitudinal\n        data under any analysis that groups by patient \u2014 which is\n        most of them.\n        \"\"\"\n        rng = random.Random(seed)\n        counts = list(self.visit_counts.items()) or [(1, 1)]\n        total = float(sum(w for _, w in counts))\n        out: List[Dict[str, Any]] = []\n        patient_cols = [c for c in self.order\n                        if self.level.get(c) == \"patient\"]\n        for pi in range(n_patients):\n            u = rng.random() * total\n            acc, nvis = 0.0, counts[0][0]\n            for v, w in counts:\n                acc += w\n                if u <= acc:\n                    nvis = v\n                    break\n            if max_visits:\n                nvis = min(nvis, max_visits)\n            pid = \"SYN{:06d}\".format(pi)\n            traits: Dict[str, str] = {}\n            prev: Dict[str, str] = {}\n            # The last symbol actually OBSERVED for this patient, as\n            # distinct from whatever the last row held. They differ\n            # whenever a visit did not measure the column, which for\n            # a 44%-covered vital is most visits.\n            last_seen: Dict[str, str] = {}\n            # The last observed VALUE, as distinct from its bin symbol.\n            # A lag feature is rebuilt from the value, because the\n            # feature's bins were learned separately from its source's\n            # and the two symbol vocabularies need not agree.\n            last_value: Dict[str, float] = {}\n            anchors: Dict[str, float] = {}\n            for vi in range(max(1, nvis)):\n                assign: Dict[str, str] = {}\n                for c in self.order:\n                    rec = getattr(self, \"feature_recipe\", {}).get(c)\n                    if rec is not None:\n                        # recomputed, never drawn - see feature_recipe\n                        assign[c] = self._feature_symbol(\n                            c, rec, assign, last_value,\n                            _rng(seed, pi, vi, c, \"feat\"))\n                        continue\n                    if c in traits:               # fixed trait\n                        assign[c] = traits[c]\n                        continue\n                    # Two sources of structure, and BOTH must\n                    # apply. Letting the transition table replace\n                    # the parent conditioning was silently\n                    # discarding every cross-column relationship\n                    # after the first visit \u2014 systolic-diastolic\n                    # correlation fell from 0.66 to 0.15, because\n                    # diastolic stopped depending on systolic at\n                    # all. They are combined instead: each source\n                    # contributes its departure from the column's\n                    # own marginal, which is the standard way to\n                    # merge two conditional beliefs about the same\n                    # quantity.\n                    dist, _ = self._lookup(c, assign)\n                    lag_tbl = self.lag.get(c)\n                    # Key on the last OBSERVED value, not the last\n                    # row. When the previous visit did not measure\n                    # this column, prev[c] is MISSING and\n                    # lag_tbl[MISSING] answers \"what follows a gap\" -\n                    # essentially the column's marginal, carrying\n                    # nothing about THIS patient's level. The anchor\n                    # cannot rescue it either: the anchor sets\n                    # position WITHIN a bin, and the bin has already\n                    # been drawn from a memoryless key.\n                    #\n                    # Measured on a real extract: complete columns\n                    # kept 74-93% of their source steadiness while\n                    # 44%-covered ones kept 40-47%. Retention tracked\n                    # coverage, which is this and nothing else.\n                    #\n                    # It also settles the \"variable-lag\" mismatch.\n                    # target_autocorr pairs consecutive PRESENT\n    # ... (159 more lines in condnet.py) ...", "walk": [["Invent a person before inventing their visits", "decide what is fixed about them and how many times they are seen, because four visits from one patient is a different thing from four patients seen once"], ["Walk their visits in order, not at random", "what was true last time shapes what is true this time, so a reading that drifts drifts plausibly instead of being redrawn from nothing"], ["Keep the links between fields alive across the whole course", "otherwise blood pressure and its partner measurement stop moving together after the first visit, which is the failure that made earlier attempts look convincing one row at a time and wrong as a record"]]}, {"label": "A privacy budget", "symbol": "CondNet.learn", "file": "condnet.py", "blurb": "With an epsilon set, every published table carries calibrated noise and each person's contribution is capped so the sensitivity is bounded. Measured cost at epsilon 1: about 5% of the structure. k-anonymity is a property of the tables; epsilon is a bound on what an adversary can infer.", "code": "    def learn(
