   pkg = Path(__file__).parent\n    newest = max(path.stat().st_mtime\n                 for path in pkg.glob(\"*.py\"))\n    return {\n        \"version\": __version__,\n        \"built\": datetime.date.fromtimestamp(\n            newest).isoformat(),\n        \"fingerprint\": build_fingerprint(),\n    }"}, {"label": "Async jobs with a budget", "symbol": "api_job", "file": "gui.py", "blurb": "A wedged ollama once served a 6-minute run for 106 minutes; jobs now time out readably and can be cancelled.", "code": "def api_job(payload: dict) -> dict:\n    import time\n    job = _JOBS.get(payload.get(\"id\", \"\"))\n    if job is None:\n        return {\"error\": \"unknown job\"}\n    elapsed = round(time.time() - job[\"started\"], 1)\n    status = job[\"status\"]\n    if status == \"running\" and job.get(\"cancelled\"):\n        status = \"cancelled\"\n    elif status == \"running\" and elapsed > JOB_BUDGET_S:\n        status = \"timeout\"\n    out = {\"status\": status, \"elapsed\": elapsed}\n    if status == \"done\":\n        out[\"result\"] = job[\"result\"]\n    elif status == \"error\":\n        out[\"error\"] = job[\"error\"]\n    elif status == \"timeout\":\n        out[\"error\"] = (\"job exceeded its {}s budget \u2014 the \"\n                        \"backend is likely crawling or wedged \"\n                        \"(a wedged ollama once served a 6-minute \"\n                        \"run for 106 minutes). The thread may \"\n                        \"still finish in the background; safe \"\n                        \"to move on.\".format(int(JOB_BUDGET_S)))\n    elif status == \"cancelled\":\n        out[\"error\"] = (\"cancelled \u2014 the current backend call \"\n                        \"may run to completion in the \"\n                        \"background, then stop\")\n    return out"}]}, {"file": "cli.py", "name": "cli", "blurb": "Everything scriptable: compile, render, lint, campaigns, trials, showdown, version.", "components": [{"label": "campaign-run --llm", "symbol": "cmd_campaign_run", "file": "cli.py", "blurb": "The vendor chair from the terminal: backend, model, samples, @file interventions, reliability line.", "code": "def cmd_campaign_run(args) -> int:\n    from .campaign import load_campaign, run_campaign, \\\n        write_campaign\n    camp = load_campaign(Path(args.campaign_dir))\n    extractor = None\n    if args.llm:\n        if camp.goal != \"extract\":\n            print(\"--llm runs an LLM vendor on extract \"\n                  \"campaigns only\", file=sys.stderr)\n            return 2\n        from .llmvendor import LLMExtractor\n        from .spec import DataSpec\n        spec = DataSpec.from_json(camp.tiers[0].spec_json)\n        extra = args.llm_extra_system\n        if extra.startswith(\"@\"):\n            extra = Path(extra[1:]).read_text(encoding=\"utf-8\")\n        extractor = LLMExtractor(\n            _backend(args.llm_backend, args.llm_model), spec,\n            samples=args.llm_samples,\n            name=args.name or \"llm-vendor\",\n            extra_system=extra)\n        solver = extractor\n    elif \":\" in args.solver:\n        mod_name, fn_name = args.solver.split(\":\", 1)\n        solver = getattr(importlib.import_module(mod_name),\n                         fn_name)\n    else:\n        print(\"solver must be 'package.module:function' \"\n              \"(or pass --llm)\", file=sys.stderr)\n        return 2\n    arm = args.name or args.solver or \"llm-vendor\"\n    result = run_campaign(camp, solver, solver_name=arm)\n    write_campaign(Path(args.campaign_dir), camp, result,\n                   result_name=arm)\n    print(result.format_text())\n    if extractor is not None:\n        print(extractor.stats_line())\n    return 0 if result.highest_passed == len(\n        result.tier_results) else 1"}]}, {"file": "bedrock.py", "name": "bedrock", "blurb": "The work door: Converse API, injectable client, fully smoked without AWS.", "components": [{"label": "BedrockBackend", "symbol": "BedrockBackend", "file": "bedrock.py", "blurb": "Same contract as Ollama; boto3 deferred to first real call; the compiler, renderer, and vendor adapter take it unchanged.", "code": "class BedrockBackend:\n    name = \"bedrock\"\n\n    def __init__(self, model_id: str,\n                 client: Optional[object] = None,\n                 region: str = \"us-west-2\"):\n        if not model_id:\n            raise BedrockError(\"model_id is required \u2014 e.g. \"\n                               \"'anthropic.claude-3-5-sonnet-\"\n                               \"20240620-v1:0'\")\n        self.model_id = model_id\n        self.region = region\n        self._client = client\n\n    def _get_client(self):\n        if self._client is None:\n            try:\n                import boto3\n            except ImportError:\n                raise BedrockError(\n                    \"boto3 is not installed \u2014 `pip install \"\n                    \"boto3` (SageMaker kernels ship it)\")\n            self._client = boto3.client(\n                \"bedrock-runtime\", region_name=self.region)\n        return self._client\n\n    def complete(self, prompt: str, *, system: str = \"\",\n                 max_tokens: int = 3000,\n                 temperature: float = 0.0) -> str:\n        client = self._get_client()\n        kwargs = {\n            \"modelId\": self.model_id,\n            \"messages\": [{\"role\": \"user\",\n                          \"content\": [{\"text\": prompt}]}],\n            \"inferenceConfig\": {\n                \"maxTokens\": int(max_tokens),\n                \"temperature\": float(temperature),\n            },\n        }\n        if system:\n            kwargs[\"system\"] = [{\"text\": system}]\n        try:\n            response = client.converse(**kwargs)\n        except Exception as e:\n            raise BedrockError(\n                \"Bedrock converse failed for {}: {}\".format(\n                    self.model_id, e))\n        try:\n            parts = response[\"output\"][\"message\"][\"content\"]\n            return \"\".join(p.get(\"text\", \"\") for p in parts)\n        except (KeyError, TypeError) as e:\n            raise BedrockError(\n                \"unexpected Bedrock response shape: {}\".format(e))"}]}]}]}</script>
<script>
var DATA=JSON.parse(document.getElementById('atlas').textContent);

function esc(s){return String(s).replace(/&/g,'&amp;')
 .replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hi(code){
 var s=esc(code);
 s=s.replace(/(&quot;|')((?:\\.|(?!\1)[^\\\n])*)(\1)/g,
  function(m){return '<span class="tok-s">'+m+'</span>';});
 s=s.replace(/(^|\n)([ \t]*#[^\n]*)/g,
  function(m,a,b){return a+'<span class="tok-c">'+b+
   '</span>';});
 s=s.replace(/\b(def|class|return|if|elif|else|for|while|try|except|finally|with|import|from|raise|yield|lambda|not|and|or|in|is|None|True|False|assert|continue|break|pass|global)\b/g,
  '<span class="tok-k">$1</span>');
 s=s.replace(/\b(self|cls)\b/g,
  '<span class="tok-d">$1</span>');
 return s;}
function setCrumbs(parts){
 var out=[];
 for(var i=0;i<parts.length;i++){
  var p=parts[i];
  if(i<parts.length-1){
   out.push('<a data-act="'+p.act+'" data-i="'+
    (p.i===undefined?'':p.i)+'">'+p.t+'</a>');}
  else{out.push('<b>'+p.t+'</b>');}}
 crumbs.innerHTML=out.join(' &nbsp;/&nbsp; ');}

   (m.components.length>1?'s':'')+' &middot; '+m.file+
   '</text></g>';}
 s+='<circle cx="'+cx+'" cy="'+cy+'" r="58" fill="'+d.color+
  '"/>'+
  '<text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" '+
  'fill="#fff" font-size="11.5" font-weight="600">'+
  d.label+'</text></svg>';
 stage.innerHTML=s+'<div class="blurb">'+d.blurb+'</div>';}
function moduleView(i,j){
 var d=DATA.domains[i],m=d.modules[j];
 setCrumbs([{t:'atlas',act:'hub'},
  {t:d.label,act:'domain',i:i},{t:m.name}]);
 var chips='';
 for(var k=0;k<m.components.length;k++){
  var c=m.components[k];
  chips+='<div class="chip" style="border-left-color:'+
   d.color+'" data-act="show" data-i="'+i+'" data-j="'+j+
   '" data-k="'+k+'" id="chip'+k+'">'+
   '<b>'+esc(c.label)+'</b><small>'+c.file+
   ' &middot; '+esc(c.symbol)+'</small></div>';}
 stage.innerHTML='<div class="explorer"><div>'+
  '<div class="blurb" style="margin:0 0 12px">'+m.blurb+
  '</div>'+chips+'</div><div id="codepane"></div></div>';
 showComp(i,j,0);}
function showComp(i,j,k){
 var d=DATA.domains[i],c=d.modules[j].components[k];
 var chipEls=document.querySelectorAll('.chip');
 for(var q=0;q<chipEls.length;q++){
  chipEls[q].className=(q===k)?'chip active':'chip';}
 document.getElementById('codepane').innerHTML=
  '<div class="codebox"><div class="codehead">synthkit/'+
  c.file+' &nbsp;&middot;&nbsp; <b>'+esc(c.symbol)+
  '</b></div>'+
  '<div class="compblurb">'+esc(c.blurb)+'</div>'+
  '<pre class="code">'+hi(c.code)+'</pre></div>';}
function findAct(el){
 while(el&&el!==document){
  if(el.getAttribute&&el.getAttribute('data-act')){
   return el;}
  el=el.parentNode;}
 return null;}
document.addEventListener('click',function(ev){
 var el=findAct(ev.target);
 if(!el)return;
 var act=el.getAttribute('data-act');
 var i=parseInt(el.getAttribute('data-i')||'0',10);
 var j=parseInt(el.getAttribute('data-j')||'0',10);
 var k=parseInt(el.getAttribute('data-k')||'0',10);
 if(act==='hub')hub();
 else if(act==='domain')domainView(i);
 else if(act==='module')moduleView(i,j);
 else if(act==='show')showComp(i,j,k);});
hub();
</script></script></body></html>
