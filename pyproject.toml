[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "synthkit"
version = "0.10.0"
description = "Synthetic data creation and testing engine: spec, plan, verified render, exact evaluation, experiments"
requires-python = ">=3.8"
license = {text = "Proprietary"}

[project.scripts]
synthkit = "synthkit.cli:main"

[tool.setuptools]
packages = ["synthkit"]
