, int]] = {}\n\n    def bump(tag, key):\n        b = buckets.setdefault(\n            tag, {\"n\": 0, \"found\": 0, \"missed\": 0,\n                  \"false_positive\": 0, \"value_wrong\": 0,\n                  \"stale_taken_as_current\": 0,\n                  \"uncertain_taken_as_certain\": 0})\n        b[key] += 1\n        return b\n\n    for ledger, got in zip(ledgers, extractions):\n        claimed = {}\n        for g in got or []:\n            claimed[g.get(\"fact\")] = g\n        for entry in ledger:\n            tags = entry[\"corruptions\"] or [\"clean\"]\n            g = claimed.get(entry[\"fact\"])\n            said_present = bool(g and g.get(\"present\", True))\n            for t in tags:\n                bump(t, \"n\")\n                if entry[\"asserts_present\"]:\n                    bump(t, \"found\" if said_present else \"missed\")\n                elif said_present:\n                    # the text says the finding is ABSENT and the\n                    # model claimed it anyway \u2014 the trap\n                    bump(t, \"false_positive\")\n                if (g and entry.get(\"asserted_value\") is not None\n                        and g.get(\"value\") is not None\n                        and str(g[\"value\"]).strip()\n                        != str(entry[\"asserted_value\"]).strip()):\n                    bump(t, \"value_wrong\")\n                if (g and not entry[\"is_current\"]\n                        and g.get(\"current\", True)):\n                    bump(t, \"stale_taken_as_current\")\n                if (g and not entry[\"is_certain\"]\n                        and g.get(\"certain\", True)):\n                    bump(t, \"uncertain_taken_as_certain\")\n\n    report = {}\n    for tag, b in sorted(buckets.items()):\n        pos = b[\"found\"] + b[\"missed\"]\n        neg = b[\"n\"] - pos\n        report[tag] = {\n            \"description\": CORRUPTIONS.get(\n                tag, \"no corruption applied\"),\n            \"mentions\": b[\"n\"],\n            \"recall\": (round(b[\"found\"] / pos, 3) if pos else None),\n            \"false_positive_rate\": (\n                round(b[\"false_positive\"] / neg, 3)\n                if neg else None),\n            \"value_errors\": b[\"value_wrong\"],\n            \"stale_taken_as_current\": b[\"stale_taken_as_current\"],\n            \"uncertain_taken_as_certain\":\n                b[\"uncertain_taken_as_certain\"],\n        }\n    return report", "walk": [["Grade every mention against what the note really said", "not against the structured record, so reading is what is being measured"], ["Report the result by the kind of mess involved", "'recall 0.91 overall, 0.00 on scope traps' names a missing skill; a single average names nothing"]]}]}, {"file": "learnspec.py", "name": "translation layer", "blurb": "Turns a learned model into things a person can read and edit: findings in clinical English, a dial per relationship, and a note plan derived from the columns that were actually learned.", "components": [{"label": "Findings in clinical English", "symbol": "narrate", "file": "learnspec.py", "blurb": "Reports what was found as sentences a clinician would say, and separates them from what the pipeline filed as its own arithmetic. An instrument that presents a count derived from a list as a discovery is harder to trust than one that says which is which.", "code": "def narrate(net) -> Dict[str, Any]:\n    \"\"\"What the model found, in plain English.\n\n    Findings and bookkeeping are reported separately and labelled\n    as such. An instrument that presents its own arithmetic as a\n    discovery is harder to trust than one that says which is which.\n    \"\"\"\n    rep = net.report\n    findings = []\n    for e in rep.get(\"edges\", []):\n        child = _pretty(e[\"child\"])\n        parents = [_pretty(p) for p in e[\"parents\"]]\n        if len(parents) == 1:\n            sentence = (\"{} moves with {}\".format(child, parents[0]))\n        else:\n            sentence = (\"{} depends on {} together\".format(\n                child, \" and \".join(parents)))\n        findings.append({\n            \"sentence\": sentence,\n            \"child\": e[\"child\"], \"parents\": e[\"parents\"],\n            \"kind\": (\"interaction\" if len(parents) > 1\n                     else \"relationship\")})\n\n    book = []\n    for d in rep.get(\"derived_columns\", []):\n        book.append({\n            \"sentence\": \"{} is computed from {}\".format(\n                _pretty(d[\"column\"]), _pretty(d[\"determined_by\"])),\n            \"column\": d[\"column\"]})\n    for b, a in (rep.get(\"derived_families\") or {}).items():\n        book.append({\n            \"sentence\": \"every {} follows from the {}\".format(\n                b.replace(\"_\", \" \"), a.replace(\"_\", \" \")),\n            \"column\": b})\n\n    n_rows = rep.get(\"rows\", 0)\n    n_people = rep.get(\"persons\", n_rows)\n    return {\n        \"headline\": (\n            \"Learned from {} records covering {} patients. \"\n            \"{} real relationship{} found; {} column{} filed as \"\n            \"arithmetic the data pipeline itself created.\".format(\n                n_rows, n_people, len(findings),\n                \"\" if len(findings) == 1 else \"s\",\n                len(book), \"\" if len(book) == 1 else \"s\")),\n        \"findings\": findings,\n        \"bookkeeping\": book,\n        \"resolution\": rep.get(\"bins\"),\n        \"effective_n\": rep.get(\"effective_n\", n_people),\n        # The 800 / 3,200 figures were measured on a NARROW schema.\n        # Blind search corrects across every pair, so a wide extract\n        # needs more of each - 3,828 comparisons on an 88-column one.\n        # And an interaction with no main effect is never found at any\n        # patient count: neither variable is marginally visible, so\n        # neither is proposed as a parent and the pair is never tested\n        # together. Stating the figures without their conditions is\n        # how a measurement becomes folklore.\n        \"caveat\": (\n            \"Relationships are only as trustworthy as the number \"\n            \"of patients behind them. At {} patients this model \"\n            \"can support simple relationships; nonlinear ones need \"\n            \"roughly 800 and interactions roughly 3,200 \u2014 measured \"\n            \"on a narrow schema, with {} comparisons corrected for \"\n            \"here, so a wider one needs more of each. An interaction \"\n            \"whose factors have no effect on their own is not found \"\n            \"at any patient count.\".format(\n                rep.get(\"effective_n\", n_people),\n                rep.get(\"comparisons_corrected_for\", \"?\"))),\n    }", "walk": [["Say what was found in words a clinician would use", "'this medication moves with this diagnosis' rather than a line of column names and symbols"], ["Keep the discoveries apart from the bookkeeping", "a count computed from a list is arithmetic we created, and presenting it as a finding is the tool congratulating itself on its own filing"], ["Say how much data stands behind it, unprompted", "a relationship found in ninety patients deserves a different confidence than one found in nine thousand, and the reader should not have to ask"]]}, {"label": "Planting truth on learned data", "symbol": "plant_outcome", "file": "learnspec.py", "blurb": "Weights stated by a person become the outcome, and the intercept is solved to hit a declared prevalence. Because the causes were authored rather than inferred, the probability behind every record is known and so is the best score any model could reach.", "code": "def plant_outcome(rows: List[Dict[str, Any]],\n                  weights: Dict[str, float],\n                  name: str = \"outcome\",\n                  prevalence: Optional[float] = None,\n                  intercept: float = 0.0,\n                  seed: int = 20260803) -> Dict[str, Any]:\n    \"\"\"Compute an outcome from coefficients the user chose.\n\n    This is what turns generated data into an EXAM. The weights\n    are a human's causal claims \u2014 nothing infers them \u2014 so the\n    probability behind every row is known exactly, and therefore\n    so is the best score any model could possibly achieve on it.\n\n    The intercept is only a base rate, so when a prevalence is\n    declared it is solved for rather than guessed.\n    \"\"\"\n    import math\n    import random as _rnd\n    cols = [c for c, w in (weights or {}).items() if w]\n    if not cols:\n        return {\"error\": \"Give at least one column a weight \u2014 \"\n                         \"those weights are the planted truth.\"}\n    z = {c: _standardize(rows, c) for c in cols}\n    base = [sum(weights[c] * z[c][i] for c in cols)\n            for i in range(len(rows))]\n\n    def realize(b0):\n        return [1.0 / (1.0 + math.exp(-max(-30.0,\n                                           min(30.0, b0 + v))))\n                for v in base]\n\n    solved = intercept\n    if prevalence:\n        lo, hi = -25.0, 25.0\n        for _ in range(40):\n            mid = (lo + hi) / 2.0\n            p = realize(mid)\n            if sum(p) / len(p) < prevalence:\n                lo = mid\n            else:\n                hi = mid\n        solved = round((lo + hi) / 2.0, 4)\n    probs = realize(solved)\n    r = _rnd.Random(seed)\n    labels = [1 if r.random() < p else 0 for p in probs]\n    for row, lab in zip(rows, labels):\n        row[name] = lab\n    return {\"rows\": rows, \"probs\": probs, \"label\": name,\n            \"intercept\": solved,\n            \"realized_prevalence\": round(\n                sum(labels) / len(labels), 4),\n            \"weights\": {c: weights[c] for c in cols},\n            \"note\": \"the coefficients are stated by a person, not \"\n                    \"inferred; that is what makes the answer key \"\n                    \"exact and the ceiling knowable\"}", "walk": [["Let a person state what causes what", "the weights are a human claim, and that is precisely what makes the answer key exact rather than circular"], ["Solve the base rate to match the prevalence asked for", "how common the outcome is gets adjusted; the causal claims never do"], ["Keep the true probability behind every record", "which is what makes it possible to say the best score any model could reach, instead of guessing at it"]]}, {"label": "Hiding the causes in the prose", "symbol": "columns_to_hide", "file": "learnspec.py", "blurb": "Removing a fact from the columns is not enough: the medication list is rebuilt in every row and still spells the drug out. The parent list goes too, or a model that cannot read simply looks the answer up and the comparison measures nothing.", "code": "def columns_to_hide(net, text_only: List[str]) -> List[str]:\n    \"\"\"Everything that would leak a hidden fact back into a column.\n\n    Hiding the indicator `active_drugs::furosemide` is not enough:\n    the medication list is rebuilt in every generated row, and it\n    still spells the drug out. A model that cannot read prose\n    would simply look it up there, and the whole reading-versus-\n    blind comparison would measure nothing. So the parent list\n    goes too.\n    \"\"\"\n    hide = set(text_only or [])\n    for col in list(hide):\n        if \"::\" in col:\n            hide.add(col.split(\"::\", 1)[0])\n    return sorted(hide)", "walk": [["Take the facts being tested out of the columns entirely", "so a model that cannot read the notes is genuinely missing them"], ["Remember that a list rebuilds itself", "hiding one medication is pointless while the medication list beside it still spells the drug out; the list goes too"]]}, {"label": "One note plan, shared", "symbol": "facts_from_columns", "file": "learnspec.py", "blurb": "The bench and the command line each sniffed columns their own way, which is two implementations of one idea and a guarantee they drift. This is the single one.", "code": "def facts_from_columns(rows: List[Dict[str, Any]],\n                      max_facts: int = 12,\n                      text_only: Optional[List[str]] = None,\n                      skip: Optional[List[str]] = None\n                      ) -> List[FactSpec]:\n    \"\"\"Derive a note plan from data alone, with no model.\n\n    The pipeline and the bench were each sniffing columns their\n    own way, which is two implementations of one idea and a\n    guarantee they will drift. This is the single one; the\n    model-based version adds what the model knows on top.\n    \"\"\"\n    hide = set(text_only or [])\n    avoid = set(skip or []) | {\"person_id\", \"visit_id\",\n                               \"visit_number\"}\n    facts: List[FactSpec] = []\n    sample = rows[:400]\n    for col in (rows[0] if rows else {}):\n        if col in avoid or col.startswith(\"_\"):\n            continue\n        vals = {str(r.get(col, \"\")).strip() for r in sample}\n        vals.discard(\"\")\n        if not vals:\n            continue\n        place = \"text_only\" if col in hide else \"both_agree\"\n        if vals <= {\"0\", \"1\", \"True\", \"False\", \"true\", \"false\"} \\\n                and len(vals) == 2:\n            kind = (\"med\" if (\"drug\" in col or \"med\" in col)\n                    else \"condition\")\n            facts.append(FactSpec(\n                col, _pretty(col), kind,\n                section=(\"plan\" if kind == \"med\"\n                         else \"assessment\"),\n                placement=place,\n                corruptions=[\"abbreviation\", \"negation_simple\",\n                             \"negation_scope_trap\", \"hedge\",\n                             \"temporal_history\"]))\n        elif all(_isnum(v) for v in list(vals)[:40]) \\\n                and len(vals) > 8:\n            facts.append(FactSpec(\n                col, _pretty(col), \"measurement\",\n                section=\"vitals\", placement=place,\n                corruptions=[\"transcription_error\",\n                             \"omitted_units\", \"copy_forward\",\n                             \"abbreviation\"]))\n        if len(facts) >= max_facts:\n            break\n    return facts", "walk": [["Work out which fields are findings and which are numbers", "a diagnosis gets written up the way a diagnosis is written; a blood pressure the way a measurement is"], ["Do it once, in one place", "the bench and the command line each had their own version, which is how two tools that should agree quietly stop agreeing"]]}]}, {"file": "attack.py", "name": "attacking the privacy claim", "blurb": "Everything else argues for privacy from architecture. This measures it, by trying to break it.", "components": [{"label": "Membership inference", "symbol": "membership_audit", "file": "attack.py", "blurb": "Split a cohort, fit on one half, then ask an adversary which half a person came from using only what we publish. An AUC of 0.5 is a coin flip. Validated by first catching a generator that memorises, at 1.0 \u2014 a privacy test that cannot fail proves nothing.", "code": "def membership_audit(net, members, nonmembers,\n                     synthetic: Optional[List[Dict]] = None,\n                     nn_sample: int = 150) -> Dict[str, Any]:\n    \"\"\"Run both adversaries and report what they managed.\n\n    `members` were used to fit the model; `nonmembers` were held\n    out. They must come from the same population, or the attack\n    measures the difference between two populations rather than\n    the leak.\n    \"\"\"\n    out: Dict[str, Any] = {\n        \"members\": len(members), \"nonmembers\": len(nonmembers)}\n    out[\"likelihood\"] = likelihood_attack(net, members, nonmembers)\n    if synthetic:\n        m = members[:nn_sample]\n        nm = nonmembers[:nn_sample]\n        out[\"nearest_neighbour\"] = nearest_neighbour_attack(\n            m, nm, synthetic[:2000])\n    aucs = [v[\"auc\"] for k, v in out.items()\n            if isinstance(v, dict) and \"auc\" in v]\n    worst = max(aucs) if aucs else 0.5\n    out[\"worst_auc\"] = worst\n    # 0.5 is a coin flip. The band below is deliberately generous\n    # to the ATTACKER: a claim of privacy should have to survive a\n    # strict reading, not a flattering one.\n    out[\"verdict\"] = (\"PASS\" if worst < 0.60 else\n                      \"MARGINAL\" if worst < 0.70 else \"FAIL\")\n    # How many people stood behind the model matters for reading\n    # this number. With a small cohort the model has little\n    # choice but to fit its members closely, so a raised AUC says\n    # as much about the size of the cohort as about the method \u2014\n    # and saying so is the difference between a useful warning\n    # and a scary one.\n    n_people = len({r.get(\"person_id\") for r in members\n                    if r.get(\"person_id\")}) or len(members)\n    out[\"members_are_people\"] = n_people\n    if worst >= 0.60 and n_people < 300:\n        out[\"context\"] = (\n            \"Only about {} people stood behind this model. At \"\n            \"that size a raised score is expected: there is not \"\n            \"enough of a crowd for anyone to hide in, and the \"\n            \"same method on a larger cohort would very likely \"\n            \"come back clean. Treat this as a reason to widen \"\n            \"the cohort, not to distrust the approach \u2014 and \"\n            \"check it again once it is wider.\".format(n_people))\n    out[\"reading\"] = (\n        \"The strongest adversary scored {:.3f}, where 0.5 is a \"\n        \"coin flip and 1.0 would mean every member identified. {}\"\n        .format(worst,\n                \"That is no better than guessing, so membership \"\n                \"in this cohort is not recoverable from what we \"\n                \"publish.\"\n                if worst < 0.60 else\n                \"That is better than guessing: something about \"\n                \"who was in the cohort is leaking, and the number \"\n                \"says how much.\"))\n    return out", "walk": [["Split the patients in two and learn from only one half", "so there is a right answer about who was in and who was not"], ["Ask an attacker to work out which half a person came from", "using only what we publish \u2014 the synthetic data, and the model itself"], ["Report how often they get it right", "a coin flip means nothing leaked; anything better than a coin flip means something did, and the number says how much"], ["Prove the test can catch a real leak first", "run it against a tool that simply republishes the original records; if that is not caught, a pass means nothing"]]}, {"label": "The stronger adversary sees the model", "symbol": "likelihood_attack", "file": "attack.py", "blurb": "A published model is exactly what a determined attacker would hold, so it is handed over. If the model finds its training records visibly more probable than strangers, membership is leaking and this says by how much.", "code": "def likelihood_attack(net, members, nonmembers) -> Dict[str, Any]:\n    \"\"\"Score by how probable the published model finds each row.\"\"\"\n    scores = [net.log_likelihood(r) for r in members] + \\\n             [net.log_likelihood(r) for r in nonmembers]\n    y = [1] * len(members) + [0] * len(nonmembers)\n    return {\"auc\": round(auroc(scores, y), 4),\n            \"attacker_sees\": \"the published model itself\"}", "walk": [["Hand the attacker the model itself", "because a published model is exactly what a determined attacker would have, and testing against a weaker one flatters us"], ["Ask how probable the model finds each person", "if it recognises the people it was built from, it is carrying them with it"]]}]}, {"file": "noteextract.py", "name": "the note vendor chair", "blurb": "A language model held to a narrow contract \u2014 present, current, certain \u2014 and graded on it.", "components": [{"label": "NoteExtractor: the tested seat", "symbol": "NoteExtractor", "file": "noteextract.py", "blurb": "Asks only what the NOTE asserts, blind to which corruptions were planted. Unusable replies, empty arrays and invented fact keys are each counted separately: a model that cannot hold the answer format is a procurement finding, not a harness problem.", "code": "class NoteExtractor:\n    \"\"\"A language model adapted to the note-grading contract.\"\"\"\n\n    def __init__(self, backend, facts: List[Dict[str, str]],\n                 name: str = \"llm-note-vendor\",\n                 temperature: float = 0.0,\n                 max_tokens: int = 800,\n                 extra_system: str = \"\"):\n        self.backend = backend\n        self.facts = facts\n        self.name = name\n        self.temperature = temperature\n        self.max_tokens = max_tokens\n        self.extra_system = (extra_system or \"\").strip()\n        self.system = SYSTEM\n        if self.extra_system:\n            self.system += \"\\n\\n\" + self.extra_system\n        self.valid_keys = {f[\"key\"] for f in facts}\n        self.stats: Dict[str, int] = {\n            \"calls\": 0, \"malformed\": 0, \"empty\": 0,\n            \"unknown_fact\": 0, \"bad_item\": 0}\n\n    def _fact_list(self) -> str:\n        return \"\\n\".join(\n            \"- {} : {}\".format(f[\"key\"], f[\"label\"])\n            for f in self.facts)\n\n    def extract(self, note: str) -> List[Dict[str, Any]]:\n        self.stats[\"calls\"] += 1\n        raw = self.backend.complete(\n            TASK.format(facts=self._fact_list(), note=note),\n            system=self.system, max_tokens=self.max_tokens,\n            temperature=self.temperature)\n        arr = _find_json_array(raw or \"\")\n        if arr is None:\n            # nothing salvageable \u2014 counted, not crashed on\n            self.stats[\"malformed\"] += 1\n            return []\n        if not arr:\n            self.stats[\"empty\"] += 1\n            return []\n        out: List[Dict[str, Any]] = []\n        for item in arr:\n            if not isinstance(item, dict):\n                self.stats[\"bad_item\"] += 1\n                continue\n            key = str(item.get(\"fact\", \"\")).strip()\n            if key not in self.valid_keys:\n                # a hallucinated fact key is its own failure mode\n                self.stats[\"unknown_fact\"] += 1\n                continue\n            out.append({\n                \"fact\": key,\n                \"present\": _as_bool(item.get(\"present\"), True),\n                \"current\": _as_bool(item.get(\"current\"), True),\n                \"certain\": _as_bool(item.get(\"certain\"), True),\n                \"value\": (None if item.get(\"value\") in\n                          (None, \"\", \"null\")\n                          else str(item.get(\"value\")).strip()),\n            })\n        return out\n\n    def extract_all(self, notes: List[str]\n                    ) -> List[List[Dict[str, Any]]]:\n        return [self.extract(n) for n in notes]\n\n    def reliability(self) -> Dict[str, Any]:\n        c = max(self.stats[\"calls\"], 1)\n        bad = self.stats[\"malformed\"]\n        return {\n            \"name\": self.name,\n            \"calls\": self.stats[\"calls\"],\n            \"malformed\": bad,\n            \"malformed_rate\": round(bad / c, 4),\n            \"empty_replies\": self.stats[\"empty\"],\n            \"hallucinated_fact_keys\": self.stats[\"unknown_fact\"],\n            \"non_object_items\": self.stats[\"bad_item\"],\n            \"reading\": \"a model that cannot hold the answer \"\n                       \"format is not a harness problem \u2014 it is a \"\n                       \"procurement finding, and it belongs beside \"\n                       \"the accuracy numbers rather than hidden \"\n                       \"behind them\",\n        }", "walk": [["Ask the model three questions per fact", "is it true of this patient, is it current, and is it stated plainly \u2014 which is where clinical reading actually goes wrong"], ["Never tell it what the traps are", "the questions define the answer format; naming the planted mess would make the exam meaningless"], ["Count replies that cannot be used at all", "a model that will not hold the answer format is a different problem from a model that is wrong, and buyers need to see both"]]}, {"label": "A reader with no model attached", "symbol": "ScriptedBackend", "file": "noteextract.py", "blurb": "Deterministic stand-ins for a keyword matcher, a clause-scoped reader and a format-breaking model, so the grading path can be demonstrated with no network \u2014 and so each failure mode is provably detected.", "code": "class ScriptedBackend:\n    \"\"\"A deterministic stand-in for tests and dry runs.\n\n    `behaviour` selects a failure mode to imitate, so the grading\n    path can be exercised \u2014 and proven to detect each failure \u2014\n    without a model or a network.\n    \"\"\"\n\n    def __init__(self, facts, behaviour: str = \"careful\",\n                 terms: Optional[Dict[str, List[str]]] = None):\n        self.facts = facts\n        self.behaviour = behaviour\n        self.terms = terms or {}\n        self.calls = 0\n\n    def complete(self, prompt, system=\"\", max_tokens=0,\n                 temperature=0.0):\n        import re\n        self.calls += 1\n        note = prompt.split(\"---\")[1] if \"---\" in prompt else prompt\n        if self.behaviour == \"malformed\":\n            return \"Sure! Here are the findings I noticed:\"\n        out = []\n        low = note.lower()\n        for f in self.facts:\n            terms = self.terms.get(f[\"key\"], [f[\"label\"]])\n            hit = None\n            for t in terms:\n                if t.lower() in low:\n                    hit = t\n                    break\n            if not hit:\n                continue\n            item = {\"fact\": f[\"key\"], \"present\": True,\n                    \"current\": True, \"certain\": True,\n                    \"value\": None}\n            if self.behaviour != \"naive\":\n                clause = \"\"\n                for line in note.split(\"\\n\"):\n                    for c in re.split(r\"[.;]\", line):\n                        if hit.lower() in c.lower():\n                            clause = c.lower()\n                            break\n                    if clause:\n                        break\n                if any(n in clause for n in\n                       (\"no \", \"denies \", \"not present\",\n                        \"is not\", \"negative for\",\n                        \"no evidence of\", \"ruled out\",\n                        \"not currently on\", \"discontinued\",\n                        \"not on active\", \"off \")):\n                    item[\"present\"] = False\n                if any(h in clause for h in\n                       (\"possible\", \"cannot rule out\",\n                        \"suspected\")):\n                    item[\"certain\"] = False\n                if any(p in clause for p in\n                       (\"history of\", \"prior \", \"in the past\",\n                        \"resolved\", \"per prior note\")):\n                    item[\"current\"] = False\n            out.append(item)\n        return json.dumps(out)", "walk": [["Stand in for a model with no model attached", "a keyword matcher, a careful reader and one that answers in prose \u2014 so the whole grading path runs offline"], ["Prove each failure is actually detected", "a scorecard that cannot fail is worthless, so every failure mode has a stand-in that triggers it deliberately"]]}]}], "plain": "Write the facts into a messy clinical note, and keep a record of what that note really says.", "steps": [["Decide where each fact is allowed to appear", "some only in the columns, some only in the note, and some in both while DISAGREEING \u2014 which is the situation that makes chart review hard"], ["Write it the way clinicians actually write", "abbreviations, denials, hedges, findings copied forward from l face": "runs alongside every step \u2014 the bench, the command line, and AI connections on your terms"}}</script>
<script>
var DATA=JSON.parse(document.getElementById('atlas').textContent);
var stage=document.getElementById('stage');
var crumbs=document.getElementById('crumbs');
function esc(s){return String(s).replace(/&/g,'&amp;')
 .replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hi(code){
 var s=esc(code);
 s=s.replace(/(&quot;|')((?:\\.|(?!\1)[^\\\n])*)(\1)/g,
  function(m){return '<span class="tok-s">'+m+'</span>';});
 s=s.replace(/(^|\n)([ \t]*#[^\n]*)/g,
  function(m,a,b){return a+'<span class="tok-c">'+b+
   '</span>';});
 s=s.replace(/\b(def|class|return|if|elif|else|for|while|try|except|finally|with|import|from|raise|yield|lambda|not|and|or|in|is|None|True|False|assert|continue|break|pass|global)\b/g,
  '<span class="tok-k">$1</span>');
 s=s.replace(/\b(self|cls)\b/g,
  '<span class="tok-d">$1</span>');
 return s;}
function setCrumbs(parts){
 var out=[];
 for(var i=0;i<parts.length;i++){
  var p=parts[i];
  if(i<parts.length-1){
   out.push('<a data-act="'+p.act+'" data-i="'+
    (p.i===undefined?'':p.i)+'">'+p.t+'</a>');}
  else{out.push('<b>'+p.t+'</b>');}}
 crumbs.innerHTML=out.join(' &nbsp;/&nbsp; ');}
function stepsHtml(steps,color,head){
 var h='<div class="narr"><div class="narrhead">'+head+
  '</div>';
 for(var i=0;i<steps.length;i++){
  h+='<div class="pstep"><span class="nchip" '+
   'style="background:'+color+'">'+(i+1)+'</span><span><b>'+
   esc(steps[i][0])+'</b><span class="why"> &mdash; '+
   esc(steps[i][1])+'</span></span></div>';}
 return h+'</div>';}
function hub(){
 setCrumbs([{t:'atlas'}]);
 var FLOW=['spec','truth','render','solvers','eval','campaign'];
 var RAILS=['gates','iface'];
 var byId={};
 for(var i=0;i<DATA.domains.length;i++){
  byId[DATA.domains[i].id]=[DATA.domains[i],i];}
 var W=1060,H=600,y=250,x0=118,dx=(W-2*x0)/(FLOW.length-1);
 var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
 s+='<defs><marker id="arr" viewBox="0 0 10 10" refX="9" '+
  'refY="5" markerWidth="7" markerHeight="7" orient="auto">'+
  '<path d="M0 0 L10 5 L0 10 z" fill="#8A97A3"/></marker>'+
  '</defs>';
 s+='<text x="'+(x0-84)+'" y="'+(y-26)+'" font-size="10" '+
  'fill="#5C6B78">an English</text>'+
  '<text x="'+(x0-84)+'" y="'+(y-13)+'" font-size="10" '+
  'fill="#5C6B78">paragraph</text>'+
  '<line x1="'+(x0-56)+'" y1="'+y+'" x2="'+(x0-44)+'" y2="'+y+
  '" stroke="#8A97A3" stroke-width="1.6" '+
  'marker-end="url(#arr)"/>';
 var k;
 for(k=0;k<FLOW.length-1;k++){
  var xa=x0+k*dx+46,xb=x0+(k+1)*dx-52;
  s+='<line x1="'+xa+'" y1="'+y+'" x2="'+xb+'" y2="'+y+
   '" stroke="#8A97A3" stroke-width="1.6" '+
   'marker-end="url(#arr)"/>';}
 var xe=x0+(FLOW.length-1)*dx;
 s+='<line x1="'+(xe+46)+'" y1="'+y+'" x2="'+(xe+62)+'" y2="'+
  y+'" stroke="#8A97A3" stroke-width="1.6" '+
  'marker-end="url(#arr)"/>'+
  '<text x="'+(xe+70)+'" y="'+(y-6)+'" font-size="10" '+
  'fill="#5C6B78">a measured</text>'+
  '<text x="'+(xe+70)+'" y="'+(y+7)+'" font-size="10" '+
  'fill="#5C6B78">verdict</text>';
 for(k=0;k<FLOW.length;k++){
  var pair=byId[FLOW[k]],d=pair[0],di=pair[1];
  var x=x0+k*dx,above=(k%2===0);
  s+='<g class="node" data-act="domain" data-i="'+di+'">'+
   '<circle class="halo" cx="'+x+'" cy="'+y+
   '" r="56" fill="'+d.color+'"/>'+
   '<circle class="plate" cx="'+x+'" cy="'+y+'" r="44" fill="'+d.color+
   '"/>'+
   '<text x="'+x+'" y="'+(y-1)+'" text-anchor="middle" '+
   'fill="#fff" font-size="10.5" font-weight="600">0'+
   (k+1)+'</text>'+
   '<text x="'+x+'" y="'+(y+13)+'" text-anchor="middle" '+
   'fill="#fff" font-size="9" opacity=".95">'+d.stage+
   '</text></g>';
  var ly=above?y-118:y+82;
  s+='<line x1="'+x+'" y1="'+(above?y-56:y+56)+'" x2="'+x+
   '" y2="'+(above?ly+30:ly-12)+'" stroke="'+d.color+
   '" stroke-width="1.2" opacity=".5"/>';
  s+='<text x="'+x+'" y="'+ly+'" text-anchor="middle" '+
   'font-size="11.5" font-weight="600" fill="#17222C">'+
   d.label+'</text>';
  var noteLines=d.note.split('\n');
  for(var q=0;q<noteLines.length;q++){
   s+='<text x="'+x+'" y="'+(ly+15+q*13)+
    '" text-anchor="middle" font-size="9.5" '+
    'fill="#5C6B78">'+noteLines[q]+'</text>';}}
 for(var r=0;r<RAILS.length;r++){
  var rp=byId[RAILS[r]],rd=rp[0],ri=rp[1];
  var ry=442+r*72;
  s+='<g class="node" data-act="domain" data-i="'+ri+'">'+
   '<rect class="halo" x="'+(x0-58)+'" y="'+(ry-26)+
   '" width="'+(W-2*x0+116)+'" height="52" rx="8" fill="'+
   rd.color+'"/>'+
   '<rect class="plate" x="'+(x0-50)+'" y="'+(ry-20)+'" width="'+
   (W-2*x0+100)+'" height="40" rx="5" fill="#fff" stroke="'+
   rd.color+'" stroke-width="2"/>'+
   '<text x="'+(x0-34)+'" y="'+(ry+4)+'" font-size="11.5" '+
   'font-weight="600" fill="'+rd.color+'">'+rd.label+
   '</text>'+
   '<text x="'+(W-x0+34)+'" y="'+(ry+4)+'" font-size="9.5" '+
   'text-anchor="end" fill="#5C6B78">'+
   rd.note.replace(/\n/g,' ')+'</text></g>';
  for(k=0;k<FLOW.length;k++){
   var tx=x0+k*dx;
   s+='<line x1="'+tx+'" y1="'+(ry-20)+'" x2="'+tx+'" y2="'+
    (r===0?y+140:ry-52)+'" stroke="'+rd.color+
    '" stroke-width="1" opacity=".18"/>';}}
 s+='</svg>';
 var narr='<div class="narr"><div class="narrhead">'+
  'THE PIPELINE IN PLAIN ENGLISH</div>';
 var order=[],r;
 for(r=0;r<DATA.domains.length;r++){
  if(DATA.domains[r].stage)order.push(r);}
 for(r=0;r<DATA.domains.length;r++){
  if(!DATA.domains[r].stage)order.push(r);}
 for(var q=0;q<order.length;q++){
  var dd=DATA.domains[order[q]];
  var bold=dd.plain.replace(/\.$/,'');
  if(!dd.stage)bold+=' (runs alongside every step)';
  narr+='<div class="pstep"><span class="nchip" '+
   'style="background:'+dd.color+'">'+(q+1)+
   '</span><span><b>'+esc(bold)+'</b><span class="why">'+
   ' &mdash; '+esc(DATA.pipeline[dd.id])+
   '</span></span></div>';}
 narr+='</div>';
 stage.innerHTML=s+'<div class="blurb">The pipeline reads '+
  'left to right: what happens to your paragraph. The two '+
  'rails below guard and expose every stage. Every node is '+
  'clickable: domain &rarr; modules &rarr; components '+
  '&rarr; the actual source.</div>'+narr;}
function domainView(i){
 var d=DATA.domains[i];
 setCrumbs([{t:'atlas',act:'hub'},{t:d.label}]);
 var W=980,H=340,cx=180,cy=H/2;
 var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
 var n=d.modules.length;
 for(var j=0;j<n;j++){
  var m=d.modules[j];
  var y=60+j*((H-100)/Math.max(n-1,1)),x=560;
  s+='<path d="M '+(cx+58)+' '+cy+' C 380 '+cy+', 380 '+y+
   ', '+(x-96)+' '+y+'" stroke="'+d.color+
   '" stroke-width="1.4" fill="none" opacity=".4"/>';
  s+='<g class="node" data-act="module" data-i="'+i+
   '" data-j="'+j+'">'+
   '<rect class="halo" x="'+(x-104)+'" y="'+(y-30)+
   '" width="208" height="60" rx="6" fill="'+d.color+'"/>'+
   '<rect class="plate" x="'+(x-96)+'" y="'+(y-24)+'" width="192" '+
   'height="48" rx="4" fill="#fff" stroke="'+d.color+
   '" stroke-width="2"/>'+
   '<text x="'+x+'" y="'+(y-3)+'" text-anchor="middle" '+
   'fill="#17222C" font-size="12" font-weight="600">'+
   m.name+'</text>'+
   '<text x="'+x+'" y="'+(y+13)+'" text-anchor="middle" '+
   'fill="'+d.color+'" font-size="9.5">'+
   m.components.length+' component'+
   (m.components.length>1?'s':'')+' &middot; '+m.file+
   '</text></g>';}
 s+='<circle cx="'+cx+'" cy="'+cy+'" r="58" fill="'+d.color+
  '"/>'+
  '<text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" '+
  'fill="#fff" font-size="11.5" font-weight="600">'+
  d.label+'</text></svg>';
 stage.innerHTML=s+'<div class="blurb">'+d.blurb+'</div>'+
  stepsHtml(d.steps,d.color,
   'WHAT HAPPENS HERE, STEP BY STEP');}
function moduleView(i,j){
 var d=DATA.domains[i],m=d.modules[j];
 setCrumbs([{t:'atlas',act:'hub'},
  {t:d.label,act:'domain',i:i},{t:m.name}]);
 var chips='';
 for(var k=0;k<m.components.length;k++){
  var c=m.components[k];
  chips+='<div class="chip" style="border-left-color:'+
   d.color+'" data-act="show" data-i="'+i+'" data-j="'+j+
   '" data-k="'+k+'" id="chip'+k+'">'+
   '<b>'+esc(c.label)+'</b><small>'+c.file+
   ' &middot; '+esc(c.symbol)+'</small></div>';}
 stage.innerHTML='<div class="explorer"><div>'+
  '<div class="blurb" style="margin:0 0 12px">'+m.blurb+
  '</div>'+chips+'</div><div id="codepane"></div></div>';
 showComp(i,j,0);}
function showComp(i,j,k){
 var d=DATA.domains[i],c=d.modules[j].components[k];
 var chipEls=document.querySelectorAll('.chip');
 for(var q=0;q<chipEls.length;q++){
  chipEls[q].className=(q===k)?'chip active':'chip';}
 document.getElementById('codepane').innerHTML=
  '<div class="codebox"><div class="codehead">synthkit/'+
  c.file+' &nbsp;&middot;&nbsp; <b>'+esc(c.symbol)+
  '</b></div>'+
  '<div class="compblurb">'+esc(c.blurb)+'</div>'+
  '<div class="walkwrap">'+
  stepsHtml(c.walk,d.color,'PLAIN ENGLISH WALKTHROUGH')+
  '</div>'+
  '<pre class="code">'+hi(c.code)+'</pre></div>';}
function findAct(el){
 while(el&&el!==document){
  if(el.getAttribute&&el.getAttribute('data-act')){
   return el;}
  el=el.parentNode;}
 return null;}
document.addEventListener('click',function(ev){
 var el=findAct(ev.target);
 if(!el)return;
 var act=el.getAttribute('data-act');
 var i=parseInt(el.getAttribute('data-i')||'0',10);
 var j=parseInt(el.getAttribute('data-j')||'0',10);
 var k=parseInt(el.getAttribute('data-k')||'0',10);
 if(act==='hub')hub();
 else if(act==='domain')domainView(i);
 else if(act==='module')moduleView(i,j);
 else if(act==='show')showComp(i,j,k);});
hub();
</script></script></body></html>
