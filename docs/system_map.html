ple's worth of evidence"], ["Exclude patient identity from the model entirely", "without this the model learned to condition on WHO the patient was, which is memorisation with extra steps"], ["Ask the cheaper question where the data allows it", "'when this patient's own reading drifts, does their risk change' is answered by their visits; 'do these patients differ from those' is answered only by the patient count"]]}]}, {"file": "../scripts/fidelity_report.py", "name": "scorecard", "blurb": "Does the synthetic data carry the same patterns, and does it avoid reproducing the people? Both halves validated against deliberate failures.", "components": [{"label": "Fidelity and privacy scored together", "symbol": "main", "file": "../scripts/fidelity_report.py", "blurb": "Marginals, missingness, correlations, the SHAPE of each dependence and the interactions \u2014 with tolerances derived from the sampling distribution rather than fixed thresholds. Relationships that are only noise in the source are skipped, because reproducing randomness is not fidelity.", "code": "def main() -> None:\n    ap = argparse.ArgumentParser()\n    ap.add_argument(\"--source\", required=True)\n    ap.add_argument(\"--synthetic\", required=True)\n    ap.add_argument(\"--profile\", default=\"\")\n    ap.add_argument(\"-o\", \"--out\", default=\"fidelity_report.json\")\n    ap.add_argument(\"--nn-sample\", type=int, default=400)\n    ap.add_argument(\"--target\", default=\"\",\n                    help=\"outcome column: interactions affecting \"\n                         \"it are tested explicitly\")\n    ap.add_argument(\"--deep-bins\", type=int, default=4)\n    ap.add_argument(\"--max-pairs\", type=int, default=400)\n    ap.add_argument(\"--report\", action=\"store_true\")\n    a = ap.parse_args()\n\n    S, G = read(a.source), read(a.synthetic)\n    if not S or not G:\n        sys.exit(\"empty input\")\n    shared = [c for c in S[0] if c in G[0]]\n\n    numcols, catcols = [], []\n    for c in shared:\n        vals = [num(r.get(c)) for r in S\n                if not is_missing(r.get(c))]\n        vals = [v for v in vals if v is not None]\n        present = sum(1 for r in S if not is_missing(r.get(c)))\n        if present and len(vals) / present > 0.9:\n            numcols.append(c)\n        elif present:\n            catcols.append(c)\n\n    marg, fails = [], 0\n    for c in numcols:\n        xs = [num(r.get(c)) for r in S]\n        ys = [num(r.get(c)) for r in G]\n        xs = [x for x in xs if x is not None]\n        ys = [y for y in ys if y is not None]\n        d = ks_distance(xs, ys)\n        tol = ks_tolerance(len(xs), len(ys))\n        ok = d <= tol\n        fails += 0 if ok else 1\n        marg.append({\"column\": c, \"type\": \"numeric\", \"metric\": \"KS\",\n                     \"value\": round(d, 4),\n                     \"tolerance\": round(tol, 4),\n                     \"pass\": ok,\n                     \"source_mean\": round(mean(xs), 3),\n                     \"synth_mean\": round(mean(ys), 3),\n                     \"source_sd\": round(sd(xs), 3),\n                     \"synth_sd\": round(sd(ys), 3)})\n    for c in catcols:\n        xs = [(r.get(c) or \"\").strip() for r in S\n              if not is_missing(r.get(c))]\n        ys = [(r.get(c) or \"\").strip() for r in G\n              if not is_missing(r.get(c))]\n        d = tvd(xs, ys)\n        big = max((Counter(xs).most_common(1) or [(\"\", 0)])[0][1]\n                  / max(1, len(xs)), 0.05)\n        tol = prop_tolerance(big, len(xs), len(ys))\n        ok = d <= tol\n        fails += 0 if ok else 1\n        marg.append({\"column\": c, \"type\": \"categorical\",\n                     \"metric\": \"TVD\", \"value\": round(d, 4),\n                     \"tolerance\": round(tol, 4), \"pass\": ok,\n                     \"source_levels\": len(set(xs)),\n                     \"synth_levels\": len(set(ys))})\n    miss = []\n    for c in shared:\n        ms = sum(1 for r in S if is_missing(r.get(c))) / len(S)\n        mg = sum(1 for r in G if is_missing(r.get(c))) / len(G)\n        d = abs(ms - mg)\n        tol = prop_tolerance((ms + mg) / 2 or 0.02, len(S), len(G))\n        ok = d <= tol\n        fails += 0 if ok else 1\n        miss.append({\"column\": c, \"source_rate\": round(ms, 4),\n                     \"synth_rate\": round(mg, 4),\n                     \"delta\": round(d, 4),\n                     \"tolerance\": round(tol, 4), \"pass\": ok})\n\n    # joint structure\n    pairs = []\n    if a.profile:\n        P = json.loads(Path(a.profile).read_text(encoding=\"utf-8\"))\n        conf = [c for c in P[\"joint\"][\"numeric_correlations\"]\n                if c.get(\"confirmed\")]\n    else:\n        conf = []\n        for i in range(len(numcols)):\n            for j in range(i + 1, len(numcols)):\n                conf.append({\"a\": numcols[i], \"b\": numcols[j]})\n    for pr in conf:\n    # ... (399 more lines in fidelity_report.py) ...", "walk": [["Compare every column's shape, source against synthetic", "and set the bar by how much two samples of the same size would differ by chance, rather than by a made-up threshold"], ["Check that the RELATIONSHIPS survived, not just the columns", "data can match on every field individually and have lost every connection between them"], ["Skip anything the source itself cannot confirm", "asking synthetic data to reproduce noise is a coin flip counted as a failure"]]}, {"label": "The nearest-neighbour privacy test", "symbol": "nn_distances", "file": "../scripts/fidelity_report.py", "blurb": "Synthetic records must sit no closer to real records than real records sit to each other. Catches the interpolation failure mode \u2014 near-copies with zero exact matches \u2014 which an exact-match test alone would pass.", "code": "def nn_distances(A, B, numcols, catcols, stats, sample, seed=5):\n    \"\"\"Distance from each row of A to its nearest row in B.\"\"\"\n    rng = random.Random(seed)\n    a = A if len(A) <= sample else rng.sample(A, sample)\n    b = B if len(B) <= sample else rng.sample(B, sample)\n    out = []\n    for ra in a:\n        best = None\n        for rb in b:\n            tot = 0.0\n            dims = 0\n            for c in numcols:\n                x, y = num(ra.get(c)), num(rb.get(c))\n                if x is None or y is None:\n                    continue\n                s = stats[c] or 1.0\n                tot += ((x - y) / s) ** 2\n                dims += 1\n            for c in catcols:\n                x = (ra.get(c) or \"\").strip()\n                y = (rb.get(c) or \"\").strip()\n                if not x and not y:\n                    continue\n                tot += 0.0 if x == y else 1.0\n                dims += 1\n            if dims == 0:\n                continue\n            d = math.sqrt(tot / dims)\n            if best is None or d < best:\n                best = d\n                if best == 0.0:\n                    break\n        if best is not None:\n            out.append(best)\n    return out", "walk": [["Measure how close each invented record sits to a real one", "and compare that against how close real records already sit to each other"], ["Fail when the invented records hug real people", "which catches methods that blend real patients together \u2014 they produce no exact copies and still leak"]]}]}, {"file": "../scripts/power_sweep.py", "name": "power curve", "blurb": "How many patients does each kind of structure need? Measured against planted truth, because with real data you never know the answer.", "components": [{"label": "Patients needed, per structure type", "symbol": "main", "file": "../scripts/power_sweep.py", "blurb": "Plants a monotone relationship, a U-shape, a threshold and two interactions, then measures recovery across cohort sizes. Turns 'we need more data' into a specification: nonlinear structure at ~800 patients, interactions at ~3,200 \u2014 and zero false positives at every size.", "code": "def main() -> None:\n    ap = argparse.ArgumentParser()\n    ap.add_argument(\"--sizes\",\n                    default=\"100,200,400,800,1600,3200\")\n    ap.add_argument(\"--seeds\", type=int, default=3)\n    ap.add_argument(\"--visits\", type=int, default=4)\n    ap.add_argument(\"--k\", type=int, default=10)\n    ap.add_argument(\"--max-parents\", type=int, default=3)\n    ap.add_argument(\"-o\", \"--out\", default=\"power_sweep.json\")\n    ap.add_argument(\"--multilevel\", action=\"store_true\",\n                    help=\"test within-person relationships on the \"\n                         \"degrees of freedom a within-person \"\n                         \"comparison actually has, instead of \"\n                         \"collapsing everything to the patient \"\n                         \"count\")\n    ap.add_argument(\"--focused\", action=\"store_true\",\n                    help=\"declare the candidate relationships \"\n                         \"instead of searching blindly, so the \"\n                         \"multiple-comparison correction covers \"\n                         \"only the questions actually asked\")\n    ap.add_argument(\"--report\", action=\"store_true\")\n    a = ap.parse_args()\n    sizes = [int(s) for s in a.sizes.split(\",\")]\n\n    results = []\n    for n in sizes:\n        runs = [run_once(n, a.visits, 1000 + s, a.k, a.max_parents,\n                         a.focused, a.multilevel)\n                for s in range(a.seeds)]\n        agg = {\"patients\": n,\n               \"rows\": int(statistics.mean(\n                   x[\"rows\"] for x in runs)),\n               \"bins\": statistics.mode([x[\"bins\"] for x in runs]),\n               \"corrections\": runs[0][\"corrections\"],\n               \"edges\": round(statistics.mean(\n                   x[\"edges\"] for x in runs), 1),\n               \"false_positives\": round(statistics.mean(\n                   x[\"false_positives\"] for x in runs), 2),\n               \"recovery\": {}, \"partial\": {}}\n        for label, _, _ in TRUTH:\n            agg[\"recovery\"][label] = round(\n                sum(1 for x in runs if x[\"recovered\"][label])\n                / len(runs), 3)\n            agg[\"partial\"][label] = round(statistics.mean(\n                x[\"partial\"][label] for x in runs), 3)\n        results.append(agg)\n        print(\"  {:>6} patients ({:>6} rows) done\".format(\n            n, agg[\"rows\"]), flush=True)\n\n    # the headline: patients needed for reliable recovery\n    needed, half = {}, {}\n    for label, _, _ in TRUTH:\n        hit = [r[\"patients\"] for r in results\n               if r[\"recovery\"][label] >= 0.99]\n        needed[label] = hit[0] if hit else None\n        # The 50% point is the standard power-curve statistic and\n        # far less jumpy than \"recovered in every single run\",\n        # which a handful of seeds cannot estimate stably.\n        h = [r[\"patients\"] for r in results\n             if r[\"recovery\"][label] >= 0.5]\n        half[label] = h[0] if h else None\n\n    payload = {\"config\": {\"search\": (\"targeted\" if a.focused\n                                     else \"blind\"),\n                          \"levels\": (\"multilevel\" if a.multilevel\n                                     else \"single-level\"),\n                          \"sizes\": sizes, \"seeds\": a.seeds,\n                          \"visits_per_patient\": a.visits,\n                          \"k\": a.k,\n                          \"max_parents\": a.max_parents},\n               \"results\": results,\n               \"patients_needed\": needed,\n               \"patients_for_half_recovery\": half,\n               \"caveat\": \"the ordering reflects EFFECT SIZE as \"\n                         \"well as complexity: a large three-way \"\n                         \"jump can be easier to detect than a \"\n                         \"graded two-way one. Read these as \"\n                         \"figures for structures of this \"\n                         \"strength, not as universal constants.\",\n               \"reading\": \"recovery = the fraction of runs in \"\n                          \"which the planted relationship was \"\n                          \"found. Sample sizes count PATIENTS; \"\n                          \"repeated visits from one person are \"\n                          \"not independent evidence.\"}\n    Path(a.out).write_text(json.dumps(payload, indent=1),\n                           encoding=\"utf-8\")\n    print(\"\\nWROTE {}\".format(a.out))\n\n    if a.report:\n        print(\"\\n\" + \"=\" * 72)\n    # ... (41 more lines in power_sweep.py) ...", "walk": [["Plant relationships of known kinds and known strengths", "a straight one, one that reverses, one with a cut-point, and two that only appear in combination"], ["Grow the cohort until each is reliably recovered", "which converts 'we need more data' into a number per kind of pattern"], ["Count how often pure noise is mistaken for a finding", "an instrument that finds structure everywhere is worthless; this one found none at any size"]]}]}], "plain": "Learn what an existing extract looks like, and hand back a recipe someone can edit.", "steps": [["Collapse the hospital's tables into one row per visit", "keys arrive in mixed formats, facts live in six places, and labs arrive one row per test \u2014 all of which has to be reconciled before anything can be measured"], ["Measure the patterns as numbers, never as records", "distributions, how often values go missing, how often they are implausible, and how the fields move together \u2014 every figure covering at least ten patients"], ["Learn the relationships that are actually there", "including the ones a correlation cannot see: a lab that is dangerous at BOTH extremes, or a drug that only matters in the elderly"], ["Refuse to learn the ones that are not", "with hundreds of possible pairings, some always look convincing by chance; those are reported and never imposed"], ["Hand back a recipe where every number is a dial", "so a person can keep the shape of the real data and make any pattern in it stronger, weaker, or absent"], ["Say how many patients each kind of pattern needs", "measured against data where the answer is known \u2014 which is the only honest way to say whether a dataset is big enough"]]}, {"id": "narrative", "label": "Notes & Extraction", "stage": true, "color": "#B45309", "blurb": "Clinical facts rendered into messy prose, with a ledger of what each note actually asserts \u2014 so an extractor can be graded by the KIND of mess that beat it. Nothing here learns language from real notes: facts are authored and rendered, so no phrasing can trace to a patient.", "modules": [{"file": "transcribe.py", "name": "transcribe", "blurb": "Structured facts become prose, corrupted by a taxonomy rather than by undifferentiated noise.", "components": [{"label": "Placement: where each fact is allowed to live", "symbol": "transcribe_row", "file": "transcribe.py", "blurb": "A benchmark whose facts appear identically in a column and a note measures nothing \u2014 a model can ignore the text and score perfectly. So each fact declares itself structured-only, text-only, agreeing, or DISAGREEING, which is the hard part of chart abstraction and the part worth grading.", "code": "def transcribe_row(row: Dict[str, Any], spec: TranscribeSpec,\n                   row_index: int, prior: Optional[Dict] = None\n                   ) -> Tuple[str, List[Dict[str, Any]], Dict]:\n    \"\"\"Return (note text, ledger, structured overrides).\n\n    The overrides are how `both_disagree` and `structured_only`\n    are honoured: the structured record keeps the true value while\n    the prose says something else, or says nothing at all.\n    \"\"\"\n    r = _rng(spec.seed, row_index, \"note\")\n    by_section = {s: [] for s in SECTIONS}\n    ledger: List[Dict[str, Any]] = []\n    overrides: Dict[str, Any] = {}\n\n    # a compound negation needs two absent findings to share one\n    # operator, so collect the candidates first\n    compound_pool = []\n\n    for fact in spec.facts:\n        value = row.get(fact.column, \"\")\n        if fact.placement == \"structured_only\":\n            continue\n        if fact.placement == \"text_only\":\n            # the whole point is that it can ONLY be found by\n            # reading, so the column is emptied whether or not\n            # this particular note ends up mentioning it\n            overrides[fact.column] = \"\"\n        present = _present(fact, value)\n\n        chosen = []\n        for c in fact.corruptions:\n            if r.random() < spec.rates.get(c, 0.0):\n                chosen.append(c)\n        # negation only applies where the fact is genuinely ABSENT,\n        # so a model that keyword-matches gets it backwards; and a\n        # fact cannot be both negated and hedged\n        if \"negation_scope_trap\" in chosen:\n            # the trap asserts the finding IS present while a\n            # negation sits nearby, so it is meaningless on a fact\n            # that is genuinely absent \u2014 and it must never share a\n            # clause with a real negation, or the ledger would\n            # record two contradictory truths for one mention\n            if present:\n                chosen = [c for c in chosen\n                          if c in (\"negation_scope_trap\",\n                                   \"abbreviation\")]\n            else:\n                chosen = [c for c in chosen\n                          if c != \"negation_scope_trap\"]\n        if \"negation_simple\" in chosen or \\\n                \"negation_compound\" in chosen:\n            if present:\n                chosen = [c for c in chosen\n                          if not c.startswith(\"negation\")]\n            else:\n                chosen = [c for c in chosen\n                          if c not in (\"hedge\",\n                                       \"temporal_history\")]\n        elif not present and fact.kind != \"measurement\":\n            continue          # absent and not negated: say nothing\n\n        if \"negation_compound\" in chosen:\n            compound_pool.append(fact)\n            continue\n\n        text, truth = _phrase(fact, value, chosen, r)\n        truth[\"placement\"] = fact.placement\n        truth[\"structured_value\"] = value\n        if fact.placement == \"both_disagree\":\n            if fact.kind == \"measurement\":\n                overrides[fact.column] = _transpose(str(value))\n            else:\n                overrides[fact.column] = \"0\" if present else \"1\"\n            truth[\"disagrees_with_structured\"] = True\n            # the ledger must hold what the STRUCTURED RECORD ends\n            # up saying, not the value we started from, or a\n            # scorer cannot tell which source is wrong\n            truth[\"structured_value\"] = overrides[fact.column]\n        if fact.placement == \"text_only\":\n            overrides[fact.column] = \"\"\n            truth[\"structured_value\"] = \"\"\n        by_section[fact.section].append(text)\n        ledger.append(truth)\n\n    if len(compound_pool) >= 2:\n        a, b = compound_pool[0], compound_pool[1]\n        by_section[a.section].append(\n            \"No {} or {}.\".format(a.label, b.label))\n        for f in (a, b):\n            ledger.append({\n    # ... (26 more lines in transcribe.py) ...", "walk": [["Decide where each fact is allowed to appear", "if every fact sits in both the column and the note, a model can ignore the writing entirely and still score perfectly"], ["Let the note and the record disagree on purpose", "reconciling a form that says one thing against a note that says another is the actual work of chart review"], ["Write down what the sentence really claims", "which is the answer key: a denial means absent, a hedge means unconfirmed, a copied-forward number means stale"]]}, {"label": "The corruption taxonomy", "symbol": "CORRUPTIONS", "file": "transcribe.py", "blurb": "Nine kinds of mess, each testing a distinct competence: abbreviation, simple and compound negation, hedging, historical mentions, copy-forward staleness, transposed digits, missing units \u2014 and the scope trap, where a negation sits in the same clause but does not reach the finding.", "code": "CORRUPTIONS = {\n    \"abbreviation\":\n        \"written in shorthand a model may not expand\",\n    \"negation_simple\":\n        \"asserted as absent \u2014 the fact is NOT true of this patient\",\n    \"negation_compound\":\n        \"two findings negated by one operator ('no X or Y'), so \"\n        \"the scope reaches further than a naive reader expects\",\n    \"hedge\":\n        \"asserted with uncertainty \u2014 not a confirmed finding\",\n    \"temporal_history\":\n        \"a PAST finding, not a current one\",\n    \"copy_forward\":\n        \"a stale value carried over from an earlier visit; the \"\n        \"structured field holds the current one\",\n    \"transcription_error\":\n        \"digits transposed relative to the structured field\",\n    \"omitted_units\":\n        \"a number with no unit, so scale must be inferred\",\n    \"negation_scope_trap\":\n        \"a negation sits in the same clause but does NOT reach \"\n        \"the finding ('no improvement in X' \u2014 X is present). Any \"\n        \"extractor that looks for a negation word nearby gets \"\n        \"this exactly backwards, which is why clause-level rules \"\n        \"score well until they meet real prose\",\n}", "walk": [["Name every kind of mess separately", "shorthand, denials, denials covering two findings at once, hedging, old findings, copied-forward numbers, transposed digits, missing units"], ["Include the trap that defeats the obvious fix", "'no improvement in heart failure' contains a denial that does not reach the finding \u2014 any reader looking for a negative word nearby gets it exactly backwards"]]}, {"label": "Grading by corruption", "symbol": "score_extraction", "file": "transcribe.py", "blurb": "One overall recall hides everything that matters. Sliced by corruption it reads 'recall 0.91, but 0.00 on scope traps', which names a missing competence instead of issuing a mark.", "code": "def score_extraction(ledgers, extractions,\n                     ) -> Dict[str, Any]:\n    \"\"\"Grade an extractor against the ledger, BY CORRUPTION TYPE.\n\n    `extractions[i]` is what a model claims it found in note i: a\n    list of {\"fact\": column, \"present\": bool, \"value\": optional}.\n\n    A single overall recall hides everything that matters. Sliced\n    by corruption, the report says which specific competence is\n    missing \u2014 negation scope, temporal reasoning, unit inference \u2014\n    which is actionable in a way that a grade is not.\n    \"\"\"\n    buckets: Dict[str, Dict[str, int]] = {}\n\n    def bump(tag, key):\n        b = buckets.setdefault(\n            tag, {\"n\": 0, \"found\": 0, \"missed\": 0,\n                  \"false_positive\": 0, \"value_wrong\": 0,\n                  \"stale_taken_as_current\": 0,\n                  \"uncertain_taken_as_certain\": 0})\n        b[key] += 1\n        return b\n\n    for ledger, got in zip(ledgers, extractions):\n        claimed = {}\n        for g in got or []:\n            claimed[g.get(\"fact\")] = g\n        for entry in ledger:\n            tags = entry[\"corruptions\"] or [\"clean\"]\n            g = claimed.get(entry[\"fact\"])\n            said_present = bool(g and g.get(\"present\", True))\n            for t in tags:\n                bump(t, \"n\")\n                if entry[\"asserts_present\"]:\n                    bump(t, \"found\" if said_present else \"missed\")\n                elif said_present:\n                    # the text says the finding is ABSENT and the\n                    # model claimed it anyway \u2014 the trap\n                    bump(t, \"false_positive\")\n                if (g and entry.get(\"asserted_value\") is not None\n                        and g.get(\"value\") is not None\n                        and str(g[\"value\"]).strip()\n                        != str(entry[\"asserted_value\"]).strip()):\n                    bump(t, \"value_wrong\")\n                if (g and not entry[\"is_current\"]\n                        and g.get(\"current\", True)):\n                    bump(t, \"stale_taken_as_current\")\n                if (g and not entry[\"is_certain\"]\n                        and g.get(\"certain\", True)):\n                    bump(t, \"uncertain_taken_as_certain\")\n\n    report = {}\n    for tag, b in sorted(buckets.items()):\n        pos = b[\"found\"] + b[\"missed\"]\n        neg = b[\"n\"] - pos\n        report[tag] = {\n            \"description\": CORRUPTIONS.get(\n                tag, \"no corruption applied\"),\n            \"mentions\": b[\"n\"],\n            \"recall\": (round(b[\"found\"] / pos, 3) if pos else None),\n            \"false_positive_rate\": (\n                round(b[\"false_positive\"] / neg, 3)\n                if neg else None),\n            \"value_errors\": b[\"value_wrong\"],\n            \"stale_taken_as_current\": b[\"stale_taken_as_current\"],\n            \"uncertain_taken_as_certain\":\n                b[\"uncertain_taken_as_certain\"],\n        }\n    return report", "walk": [["Grade every mention against what the note really said", "not against the structured record, so reading is what is being measured"], ["Report the result by the kind of mess involved", "'recall 0.91 overall, 0.00 on scope traps' names a missing skill; a single average names nothing"]]}]}, {"file": "noteextract.py", "name": "the note vendor chair", "blurb": "A language model held to a narrow contract \u2014 present, current, certain \u2014 and graded on it.", "components": [{"label": "NoteExtractor: the tested seat", "symbol": "NoteExtractor", "file": "noteextract.py", "blurb": "Asks only what the NOTE asserts, blind to which corruptions were planted. Unusable replies, empty arrays and invented fact keys are each counted separately: a model that cannot hold the answer format is a procurement finding, not a harness problem.", "code": "class NoteExtractor:\n    \"\"\"A language model adapted to the note-grading contract.\"\"\"\n\n    def __init__(self, backend, facts: List[Dict[str, str]],\n                 name: str = \"llm-note-vendor\",\n                 temperature: float = 0.0,\n                 max_tokens: int = 800,\n                 extra_system: str = \"\"):\n        self.backend = backend\n        self.facts = facts\n        self.name = name\n        self.temperature = temperature\n        self.max_tokens = max_tokens\n        self.extra_system = (extra_system or \"\").strip()\n        self.system = SYSTEM\n        if self.extra_system:\n            self.system += \"\\n\\n\" + self.extra_system\n        self.valid_keys = {f[\"key\"] for f in facts}\n        self.stats: Dict[str, int] = {\n            \"calls\": 0, \"malformed\": 0, \"empty\": 0,\n            \"unknown_fact\": 0, \"bad_item\": 0}\n\n    def _fact_list(self) -> str:\n        return \"\\n\".join(\n            \"- {} : {}\".format(f[\"key\"], f[\"label\"])\n            for f in self.facts)\n\n    def extract(self, note: str) -> List[Dict[str, Any]]:\n        self.stats[\"calls\"] += 1\n        raw = self.backend.complete(\n            TASK.format(facts=self._fact_list(), note=note),\n            system=self.system, max_tokens=self.max_tokens,\n            temperature=self.temperature)\n        arr = _find_json_array(raw or \"\")\n        if arr is None:\n            # nothing salvageable \u2014 counted, not crashed on\n            self.stats[\"malformed\"] += 1\n            return []\n        if not arr:\n            self.stats[\"empty\"] += 1\n            return []\n        out: List[Dict[str, Any]] = []\n        for item in arr:\n            if not isinstance(item, dict):\n                self.stats[\"bad_item\"] += 1\n                continue\n            key = str(item.get(\"fact\", \"\")).strip()\n            if key not in self.valid_keys:\n                # a hallucinated fact key is its own failure mode\n                self.stats[\"unknown_fact\"] += 1\n                continue\n            out.append({\n                \"fact\": key,\n                \"present\": _as_bool(item.get(\"present\"), True),\n                \"current\": _as_bool(item.get(\"current\"), True),\n                \"certain\": _as_bool(item.get(\"certain\"), True),\n                \"value\": (None if item.get(\"value\") in\n                          (None, \"\", \"null\")\n                          else str(item.get(\"value\")).strip()),\n            })\n        return out\n\n    def extract_all(self, notes: List[str]\n                    ) -> List[List[Dict[str, Any]]]:\n        return [self.extract(n) for n in notes]\n\n    def reliability(self) -> Dict[str, Any]:\n        c = max(self.stats[\"calls\"], 1)\n        bad = self.stats[\"malformed\"]\n        return {\n            \"name\": self.name,\n            \"calls\": self.stats[\"calls\"],\n            \"malformed\": bad,\n            \"malformed_rate\": round(bad / c, 4),\n            \"empty_replies\": self.stats[\"empty\"],\n            \"hallucinated_fact_keys\": self.stats[\"unknown_fact\"],\n            \"non_object_items\": self.stats[\"bad_item\"],\n            \"reading\": \"a model that cannot hold the answer \"\n                       \"format is not a harness problem \u2014 it is a \"\n                       \"procurement finding, and it belongs beside \"\n                       \"the accuracy numbers rather than hidden \"\n                       \"behind them\",\n        }", "walk": [["Ask the model three questions per fact", "is it true of this patient, is it current, and is it stated plainly \u2014 which is where clinical reading actually goes wrong"], ["Never tell it what the traps are", "the questions define the answer format; naming the planted mess would make the exam meaningless"], ["Count replies that cannot be used at all", "a model that will not hold the answer format is a different problem from a model that is wrong, and buyers need to see both"]]}, {"label": "A reader with no model attached", "symbol": "ScriptedBackend", "file": "noteextract.py", "blurb": "Deterministic stand-ins for a keyword matcher, a clause-scoped reader and a format-breaking model, so the grading path can be demonstrated with no network \u2014 and so each failure mode is provably detected.", "code": "class ScriptedBackend:\n    \"\"\"A deterministic stand-in for tests and dry runs.\n\n    `behaviour` selects a failure mode to imitate, so the grading\n    path can be exercised \u2014 and proven to detect each failure \u2014\n    without a model or a network.\n    \"\"\"\n\n    def __init__(self, facts, behaviour: str = \"careful\",\n                 terms: Optional[Dict[str, List[str]]] = None):\n        self.facts = facts\n        self.behaviour = behaviour\n        self.terms = terms or {}\n        self.calls = 0\n\n    def complete(self, prompt, system=\"\", max_tokens=0,\n                 temperature=0.0):\n        import re\n        self.calls += 1\n        note = prompt.split(\"---\")[1] if \"---\" in prompt else prompt\n        if self.behaviour == \"malformed\":\n            return \"Sure! Here are the findings I noticed:\"\n        out = []\n        low = note.lower()\n        for f in self.facts:\n            terms = self.terms.get(f[\"key\"], [f[\"label\"]])\n            hit = None\n            for t in terms:\n                if t.lower() in low:\n                    hit = t\n                    break\n            if not hit:\n                continue\n            item = {\"fact\": f[\"key\"], \"present\": True,\n                    \"current\": True, \"certain\": True,\n                    \"value\": None}\n            if self.behaviour != \"naive\":\n                clause = \"\"\n                for line in note.split(\"\\n\"):\n                    for c in re.split(r\"[.;]\", line):\n                        if hit.lower() in c.lower():\n                            clause = c.lower()\n                            break\n                    if clause:\n                        break\n                if any(n in clause for n in\n                       (\"no \", \"denies \", \"not present\", \"is not\")):\n                    item[\"present\"] = False\n                if any(h in clause for h in\n                       (\"possible\", \"cannot rule out\",\n                        \"suspected\")):\n                    item[\"certain\"] = False\n                if any(p in clause for p in\n                       (\"history of\", \"prior \", \"in the past\",\n                        \"resolved\", \"per prior note\")):\n                    item[\"current\"] = False\n            out.append(item)\n        return json.dumps(out)", "walk": [["Stand in for a model with no model attached", "a keyword matcher, a careful reader and one that answers in prose \u2014 so the whole grading path runs offline"], ["Prove each failure is actually detected", "a scorecard that cannot fail is worthless, so every failure mode has a stand-in that triggers it deliberately"]]}]}], "plain": "Write the facts into a messy clinical note, and keep a record of what that note really says.", "steps": [["Decide where each fact is allowed to appear", "some only in the columns, some only in the note, and some in both while DISAGREEING \u2014 which is the situation that makes chart review hard"], ["Write it the way clinicians actually write", "abbreviations, denials, hedges, findings copied forward from last month, transposed numbers, missing units"], ["Record what each sentence truly asserts", "so a denial counts as absence, a hedge counts as uncertainty, and a carried-forward value counts as stale \u2014 the answer key for the text"], ["Grade a reader by the KIND of mess that beat it", "one overall score would average everything into a number that names nothing; per-category it reads 'handles negation, cannot reason about scope'"], ["Count a model that cannot answer at all, separately", "failing to hold the answer format is a different problem from being wrong, and buyers need to know which one they are looking at"]]}], "pipeline": {"spec": "so the request is exact, reviewable, and approved by a person before anything exists", "truth": "because grading is only honest when the answer key exists before the data does", "render": "so a model faces realistic mess while the exact truth sits safely beside it", "eval": "so every score is measured against planted truth AND the best score possible", "campaign": "so one lucky result can never pass \u2014 verdicts come from three difficulties with statistics attached", "solvers": "so every vendor claim is measured against a free, transparent challenger in the identical seat", "gates": "runs alongside every step \u2014 lawful recipe, kept promises, honest uncertainty", "phase2": "so a benchmark can be shaped like the hospital's own data instead of an engineer's guess \u2014 while generation still consumes parameters, never records", "narrative": "because the clinical value that vendors compete over is locked in free text, and an exam that only has columns cannot test for it", "iface": "runs alongside every step \u2014 the bench, the command line, and AI connections on your terms"}}</script>

   out.push('<a data-act="'+p.act+'" data-i="'+
    (p.i===undefined?'':p.i)+'">'+p.t+'</a>');}
  else{out.push('<b>'+p.t+'</b>');}}
 crumbs.innerHTML=out.join(' &nbsp;/&nbsp; ');}
function stepsHtml(steps,color,head){
 var h='<div class="narr"><div class="narrhead">'+head+
  '</div>';
 for(var i=0;i<steps.length;i++){
  h+='<div class="pstep"><span class="nchip" '+
   'style="background:'+color+'">'+(i+1)+'</span><span><b>'+
   esc(steps[i][0])+'</b><span class="why"> &mdash; '+
   esc(steps[i][1])+'</span></span></div>';}
 return h+'</div>';}

function findAct(el){
 while(el&&el!==document){
  if(el.getAttribute&&el.getAttribute('data-act')){
   return el;}
  el=el.parentNode;}
 return null;}
document.addEventListener('click',function(ev){
 var el=findAct(ev.target);
 if(!el)return;
 var act=el.getAttribute('data-act');
 var i=parseInt(el.getAttribute('data-i')||'0',10);
 var j=parseInt(el.getAttribute('data-j')||'0',10);
 var k=parseInt(el.getAttribute('data-k')||'0',10);
 if(act==='hub')hub();
 else if(act==='domain')domainView(i);
 else if(act==='module')moduleView(i,j);
 else if(act==='show')showComp(i,j,k);});
hub();
