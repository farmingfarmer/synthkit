name: synthkit CI

# The smoke net is deterministic and LLM-free by design (StubBackend
# everywhere), so the core jobs need zero credentials or secrets —
# they run on any fork, any PR, any runner. The Bedrock integration
# job is dispatch-gated for the AWS-controlled environment and
# assumes a role via OIDC (no long-lived keys).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_bedrock:
        description: "Run the Bedrock live-render integration job"
        type: boolean
        default: false

jobs:
  # THE WHOLE SMOKE NET, INCLUDING THE FITTED PATH.
  #
  # Until this job existed CI ran five suites, all belonging to the
  # authored pipeline, and never installed numpy, pandas or
  # scikit-learn - so the thirteen suites covering discover ->
  # blueprint -> generate could not run here at all. Every check on
  # that path was executing on one laptop, by hand, for months. That
  # is a ritual with a single point of failure, not verification.
  #
  # SHARDED because the net is ten minutes serial and a ten-minute
  # wall on every pull request is a check people switch off. The
  # suites are independent processes; `run_all_smokes.py --shard`
  # deals them round-robin, and `smoke_packaging` asserts the split
  # covers every suite exactly once so a dropped one cannot hide
  # behind five green shards.
  smoke-net:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor: scikit-learn, numpy and scipy all
        # declare `requires-python >=3.10`, which is why the old
        # `>=3.8` in pyproject was false rather than generous.
        # 3.13 IS NOT DECORATION - it is where pandas 3 lands, and
        # the development machine was still on 3.10 with pandas 2.3.
        # Two suites passed here and failed on the machine that holds
        # the data: writing a string into a float64 column was a
        # FutureWarning on 2.3 and is a TypeError on 3.0. Testing only
        # what the author happens to have installed is how that
        # reaches the one machine where a crash costs a round trip.
        python-version: ["3.10", "3.13"]
        shard: [0, 1, 2, 3]
    name: smoke net ${{ matrix.python-version }} (shard ${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with dependencies
        # `pip install -e .` is now enough - the numeric dependencies
        # are declared in pyproject rather than living only in
        # requirements.txt, which is what made "seven suites do not
        # run" a documented footgun instead of an impossible state.
        run: pip install -e .
      - name: Confirm the fitted path's dependencies are importable
        # A guard against this job silently degrading into the old
        # one. If these ever stop importing, the suites that need them
        # fail on their import line and read as broken code.
        run: python -c "import numpy, pandas, sklearn, scipy; print('deps ok')"
      - name: Smoke net (shard ${{ matrix.shard }} of 4)
        run: python -u scripts/run_all_smokes.py --shards 4 --shard ${{ matrix.shard }}

  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      - name: Smoke S1+S2 (spec, compiler, planner)
        run: python scripts/smoke_s1_s2.py
      - name: Smoke S3 (verified renderer, corpus IO)
        run: python scripts/smoke_s3.py
      - name: Smoke S4 (evaluator)
        run: python scripts/smoke_s4.py
      - name: Smoke S5 (experiment harness)
        run: python scripts/smoke_s5.py
      - name: Smoke CLI
        run: python scripts/smoke_cli.py

  # Kept as it was: these five run the authored pipeline on every
  # supported interpreter and are fast, so they fail first and name
  # the problem before the ten-minute net gets there.
  pipeline-integration:
    # The full pipeline as the notebook runs it: plan -> stub render
    # -> evaluate -> experiment -> persist -> reload with integrity.
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: End-to-end (deterministic)
        run: |
          synthkit experiment --backend stub --size 16 || test $? -eq 1
          python - << 'PY'
          from pathlib import Path
          from synthkit.examples import (reference_spec,
                                         reference_rules,
                                         regex_extract)
          from synthkit.planner import plan_corpus
          from synthkit.harness import StubBackend
          from synthkit.renderer import render_corpus
          from synthkit.evaluator import FunctionExtractor, evaluate
          from synthkit.corpus_io import write_corpus, load_corpus
          spec = reference_spec(size=20)
          bps = plan_corpus(spec)
          docs, rr = render_corpus(spec, bps, StubBackend())
          assert rr.fallbacks == 0
          rep = evaluate(bps, docs,
                         FunctionExtractor(regex_extract, "regex"),
                         reference_rules())
          assert 0.0 < rep.overall_recall < 1.0
          run = write_corpus(Path("corpus/ci_run"), spec, bps, docs,
                             rr, "stub")
          _s, _b, docs2, _m = load_corpus(run)
          assert docs2 == docs
          print("pipeline integration OK:",
                "recall={:.3f}".format(rep.overall_recall))
          PY
      - name: Upload corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-corpus
          path: corpus/ci_run

  bedrock-integration:
    # Gated: only on manual dispatch with run_bedrock=true, in the
    # AWS-controlled environment. Requires a repo/environment
    # variable AWS_CI_ROLE_ARN and the GitHub OIDC provider trusted
    # by that role (bedrock:InvokeModel on the chosen model).
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_bedrock }}
    runs-on: ubuntu-latest
    needs: smoke
    permissions:
      id-token: write
      contents: read
    env:
      BEDROCK_MODEL_ID: anthropic.claude-sonnet-4-6-v1:0
      AWS_REGION: us-west-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install
        run: pip install -e . boto3
      - name: Live render + evaluate (small corpus)
        run: |
          python - << 'PY'
          import os
          from synthkit.examples import (reference_spec,
                                         reference_rules,
                                         regex_extract)
          from synthkit.planner import plan_corpus
          from synthkit.compiler import BedrockBackend
          from synthkit.renderer import render_corpus
          from synthkit.evaluator import FunctionExtractor, evaluate
          spec = reference_spec(size=6)
          bps = plan_corpus(spec)
          backend = BedrockBackend(
              model_id=os.environ["BEDROCK_MODEL_ID"],
              region=os.environ["AWS_REGION"])
          docs, rr = render_corpus(spec, bps, backend)
          print(rr.format_text())
          rep = evaluate(bps, docs,
                         FunctionExtractor(regex_extract, "regex"),
                         reference_rules())
          print(rep.format_text())
          PY
