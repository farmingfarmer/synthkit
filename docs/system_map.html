<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>synthkit — system atlas</title>
<style>
:root{--bench:#EDF0F3;--panel:#FFF;--ink:#17222C;--dim:#5C6B78;
 --rule:#CBD4DC;--enamel:#0E6E64;
 --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
 --sans:'IBM Plex Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--bench);color:var(--ink);
 font-family:var(--sans);font-size:14px;line-height:1.5;
 padding:22px 28px}
header{display:flex;justify-content:space-between;
 align-items:baseline;margin-bottom:14px}
.wordmark{font-family:var(--mono);font-weight:600;
 letter-spacing:.14em;font-size:16px}
.wordmark small{display:block;color:var(--dim);font-weight:400;
 letter-spacing:.08em;font-size:10px}
#crumbs{font-family:var(--mono);font-size:12px;color:var(--dim)}
#crumbs a{color:var(--enamel);cursor:pointer;
 text-decoration:none}
#crumbs a:hover{text-decoration:underline}
.stage{background:var(--panel);border:1px solid var(--rule);
 padding:18px;min-height:560px}
svg text{font-family:var(--mono)}
.node{cursor:pointer}
.node:hover .halo{opacity:.25}
.node .halo{opacity:0;transition:opacity .12s}
.blurb{max-width:760px;color:var(--dim);font-size:13px;
 margin:10px 0 0}
.explorer{display:grid;grid-template-columns:290px 1fr;gap:16px}
.chip{border:1px solid var(--rule);border-left:4px solid
 var(--accent,#888);padding:10px 12px;margin-bottom:8px;
 cursor:pointer;background:#FBFCFD}
.chip:hover{border-color:var(--accent,#888)}
.chip.active{background:#fff;border-color:var(--accent,#888);
 box-shadow:0 1px 0 var(--rule)}
.chip b{font-family:var(--mono);font-size:12.5px;display:block}
.chip small{color:var(--dim);font-size:11px}
.codebox{border:1px solid var(--rule)}
.codehead{font-family:var(--mono);font-size:11px;
 background:var(--bench);border-bottom:1px solid var(--rule);
 padding:8px 12px;color:var(--dim)}
.codehead b{color:var(--ink)}
pre.code{font-family:var(--mono);font-size:11.8px;
 line-height:1.55;padding:14px;overflow:auto;max-height:520px;
 background:#FCFDFE;white-space:pre}
.tok-c{color:#4C7A34;font-style:italic}
.tok-s{color:#A02F44}
.tok-k{color:#1B5FAA;font-weight:600}
.tok-d{color:#6B3FA0;font-weight:600}
.compblurb{padding:10px 12px;font-size:12.5px;color:var(--ink);
 background:#F4F7F6;border-bottom:1px solid var(--rule)}
footer{margin-top:12px;font-family:var(--mono);font-size:11px;
 color:var(--dim);display:flex;justify-content:space-between}
@media(prefers-reduced-motion:no-preference){
 .stage>*{animation:in .16s ease-out}
 @keyframes in{from{opacity:.5}to{opacity:1}}}
/* ===== NARRATIVE LAYER ===== */
.narr{margin-top:18px;max-width:860px}
.narrhead{font-family:var(--mono);font-size:11.5px;
 letter-spacing:.12em;color:#5C6B78;font-weight:700;
 margin-bottom:8px}
.pstep{display:flex;gap:11px;align-items:flex-start;
 margin:8px 0;font-size:14px;line-height:1.5}
.nchip{flex:none;min-width:25px;height:25px;border-radius:7px;
 color:#fff;font-weight:800;display:flex;align-items:center;
 justify-content:center;font-size:13px;margin-top:1px;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.3),
            0 2px 4px rgba(23,34,44,.25)}
.pstep .why{color:#5C6B78}
.walkwrap{padding:11px 14px;background:#F6FAF8;
 border-bottom:1px solid var(--rule)}
.walkwrap .pstep{font-size:13.5px;margin:6px 0}
/* ===== DEPTH & READABILITY LAYER (matches the bench) ===== */
body{font-size:15.5px;line-height:1.55}
.stage{border-radius:12px;
 box-shadow:0 1px 2px rgba(23,34,44,.06),
            0 6px 18px rgba(23,34,44,.08)}
.blurb{font-size:14px;color:#3d4c56;max-width:820px}
.chip{border-radius:10px;
 background:linear-gradient(180deg,#ffffff,#f5f8f7);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.85),
            0 2px 5px rgba(23,34,44,.10);
 transition:transform .06s,box-shadow .06s}
.chip:hover{transform:translateY(-1px);
 box-shadow:0 5px 12px rgba(23,34,44,.16)}
.chip.active{box-shadow:inset 0 2px 5px rgba(23,34,44,.10)}
.chip b{font-size:13.5px}
.chip small{font-size:12px;color:#4a5a54}
.node .plate{filter:drop-shadow(0 3px 5px rgba(23,34,44,.22))}
.node:hover .plate{filter:drop-shadow(0 6px 10px
 rgba(23,34,44,.3))}
#crumbs{font-size:13px}
#crumbs a{font-weight:700}
.codebox{border-radius:10px;overflow:hidden;
 box-shadow:0 3px 10px rgba(23,34,44,.12)}
pre.code{font-size:12.5px}
.compblurb{font-size:13.5px;line-height:1.55}
.codehead{font-size:12px}
footer{font-size:12px}
</style></head><body>

<script id="atlas" type="application/json">{"domains": [{"id": "spec", "stage": "English in", "note": "a paragraph becomes a strict,\nhuman-reviewed contract", "label": "Spec Layer", "color": "#1B5FAA", "blurb": "Plain English becomes a strict, reviewable contract. The compiler is assisted-never-trusted: LLM drafts, validator teaches, human gates. Live benchmark: 6 problems -> 2 -> 2 -> 0 across four runs of one paragraph.", "modules": [{"file": "compiler.py", "name": "compiler", "blurb": "English -> spec with one repair round; every validator message feeds back as curriculum.", "components": [{"label": "The table architect prompt", "symbol": "_TABLE_COMPILER_SYSTEM", "file": "compiler.py", "blurb": "The textbook mistral learns from. Grew a chapter every time a live compile failed: outcomes, days_from, rule-vs-distribution, sigma semantics, target_prevalence.", "code": "_TABLE_COMPILER_SYSTEM = (\n    \"You translate plain-English descriptions of tabular datasets \"\n    \"into synthkit TableSpec JSON. Respond ONLY with a JSON \"\n    \"object, no prose, no markdown fences.\\n\\n\"\n    \"Schema:\\n\"\n    '{\"title\": str, \"rows\": int, \"master_seed\": int, '\n    '\"duplicate_rate\": float 0-0.5,\\n'\n    ' \"columns\": [{\"name\": str, '\n    '\"ctype\": \"int|float|category|str_id|person_name|date|bool\", '\n    '\"distribution\": {\"kind\": ...}, \"mess\": {...}}],\\n'\n    ' \"rules\": [...]}\\n\\n'\n    \"Distribution kinds: uniform{min,max} normal{mean,std,min?,\"\n    \"max?} lognormal{mu,sigma,min?,max?} beta{alpha,beta,scale?} \"\n    'categorical{choices,[weights]} date_range{start,end ISO} '\n    \"sequence{prefix,start} bernoulli{p} \"\n    \"mixture{components:[dists],weights}.\\n\"\n    \"Mess rates (per column, all optional, 0-1): missing_rate, \"\n    \"typo_rate, format_rate, outlier_rate (+outlier_factor), \"\n    \"case_rate, space_rate, wrong_rate (format-valid wrong \"\n    \"values a cleaner must DETECT).\\n\"\n    \"Rules (top-level `rules` array, NEVER inside a column's \"\n    \"distribution): {kind:date_after, earlier, later, min_days, \"\n    \"max_days} for date ordering \u2014 or replace min/max_days with \"\n    \"days_from: <numeric column> when the gap should equal that \"\n    \"column's value (e.g. discharge = admission + los_days). \"\n    \"Rule-produced columns may omit `distribution` entirely. \"\n    \"wrong_rate applies to dates, numbers, categories, bools and \"\n    \"names \u2014 never str_id; {kind:derived, target, source, \"\n    \"factor, noise_sigma?} for numeric correlation \u2014 both ends \"\n    \"numeric; factor carries the SCALE (dollars per day etc), \"\n    \"noise_sigma is lognormal shape in [0, 3] where 0.15 means \"\n    \"about \u00b115% scatter.\\n\"\n    \"Note columns (clinical text carrying signal): ctype \"\n    \"\\\"note\\\" with a note object holding elements (id, \"\n    \"2+ phrasings, density in (0,1), weight), distractors \"\n    \"(id, phrasings, density, optional excludes naming an \"\n    \"element so the trap only appears when it is absent), \"\n    \"and fillers. No distribution or mess on note columns. \"\n    \"Reference elements in outcome coefficients as \"\n    \"notecolumn.element_id. \"\n    \"Generated labels (top-level `outcomes` array, NEVER a bool \"\n    \"column with rules): {\\\"name\\\": str, \\\"kind\\\": \"\n    \"\\\"logistic\\\", \\\"intercept\\\": float, \\\"coefficients\\\": \"\n    \"{column: weight, \\\"column=value\\\": weight}} \u2014 numeric/bool \"\n    \"columns by name, categories via indicator \"\n    \"\\\"column=value\\\". Tune intercept for the requested \"\n    \"prevalence (more negative = rarer), and when the \"\n    \"description states a rate ('around 15-20 percent') also \"\n    \"set \\\"target_prevalence\\\": [0.15, 0.20] so the linter \"\n    \"can enforce it. For CONTINUOUS generated targets use \"\n    \"kind \\\"linear\\\" with intercept, coefficients, and \"\n    \"noise_sigma (the irreducible error), plus optional \"\n    \"target_range [lo, hi] for the expected mean.\\n\"\n    \"Choose sensible values for anything unspecified; keep rows \"\n    \"<= 500 unless asked.\"\n)", "walk": [["Hold the textbook the drafting AI studies", "every rule it must follow when turning a paragraph into a recipe"], ["Grow a chapter after every real mistake", "each time a live draft went wrong, the lesson was added \u2014 the textbook is a diary of failures that can't repeat"]]}, {"label": "compile_table_spec", "symbol": "compile_table_spec", "file": "compiler.py", "blurb": "Draft, validate, feed problems back verbatim, retry once, then hand the human whatever survived \u2014 with the problems attached.", "code": "def compile_table_spec(description: str, backend: LLMBackend,\n                       retries: int = 1) -> CompileResult:\n    \"\"\"Plain English -> validated TableSpec (or draft + problems).\n    Mirrors compile_spec exactly: one repair round fed the full\n    problem list, then the human takes over.\"\"\"\n    from .tablespec import TableSpec, TableSpecError\n    prompt = (\"Dataset description:\\n\\n{}\\n\\n\"\n              \"=== END DESCRIPTION ===\\n\"\n              \"Now output ONLY the TableSpec JSON object, starting \"\n              \"with '{{'.\".format(description.strip()))\n    last_raw = \"\"\n    last_problems = \"no output produced\"\n    for attempt in range(retries + 1):\n        raw = backend.complete(prompt,\n                               system=_TABLE_COMPILER_SYSTEM,\n                               max_tokens=3000, temperature=0.3)\n        json_str = _extract_json(raw)\n        if json_str is None:\n            last_raw = raw or \"\"\n            last_problems = \"no JSON object in output\"\n        else:\n            last_raw = json_str\n            try:\n                spec = TableSpec.from_json(json_str)\n            except (json.JSONDecodeError, TypeError, KeyError) as e:\n                last_problems = (\"JSON did not fit the schema: {}\"\n                                 .format(e))\n            else:\n                try:\n                    spec.validate()\n                    return CompileResult(spec=spec,\n                                         raw_json=json_str,\n                                         problems=None)\n                except TableSpecError as e:\n                    last_problems = str(e)\n        if attempt < retries:\n            prompt = (\n                \"Dataset description:\\n\\n{}\\n\\n\"\n                \"Your previous TableSpec had these problems:\\n{}\"\n                \"\\n\\nOutput the CORRECTED TableSpec JSON only, \"\n                \"starting with '{{'.\".format(\n                    description.strip(), last_problems)\n            )\n    try:\n        draft = TableSpec.from_json(last_raw)\n    except Exception:\n        draft = None\n    return CompileResult(spec=draft, raw_json=last_raw,\n                         problems=last_problems)", "walk": [["Ask the AI for a draft recipe", "from the plain-English paragraph"], ["Have the checker mark every problem", "and hand the marked-up list straight back to the AI for one repair attempt"], ["Give a person whatever survived, problems attached", "the human gate: nothing proceeds unapproved \u2014 in one live demo the gate caught three invented settings"]]}]}, {"file": "tablespec.py", "name": "tablespec", "blurb": "The table schema: columns, distributions, mess rates, rules, outcomes. Validation reports EVERY problem at once, in teaching voice.", "components": [{"label": "TableSpec.validate", "symbol": "TableSpec.validate", "file": "tablespec.py", "blurb": "Total validation with teaching messages \u2014 each grew from a real confusion: rule-kinds-in-distributions, bool derived targets, dollar-amount sigmas, target_prevalence bounds.", "code": "    def validate(self) -> None:\n        problems: List[str] = []\n        if not self.title.strip():\n            problems.append(\"table title is required\")\n        if self.rows < 1:\n            problems.append(\"rows must be >= 1\")\n        if not (0.0 <= self.duplicate_rate <= 0.5):\n            problems.append(\"duplicate_rate must be in [0, 0.5]\")\n        if not self.columns:\n            problems.append(\"at least one column is required\")\n        rule_targets = set()\n        for rule in self.rules:\n            if rule.get(\"kind\") == \"date_after\":\n                rule_targets.add(rule.get(\"later\"))\n            elif rule.get(\"kind\") == \"derived\":\n                rule_targets.add(rule.get(\"target\"))\n        seen = set()\n        for col in self.columns:\n            tag = \"column `{}`\".format(col.name or \"?\")\n            if not col.name.strip():\n                problems.append(\"a column is missing a name\")\n            elif col.name in seen:\n                problems.append(\"{}: duplicate name\".format(tag))\n            seen.add(col.name)\n            if col.ctype not in COLUMN_TYPES:\n                problems.append(\"{}: unknown type `{}`\".format(\n                    tag, col.ctype))\n                continue\n            kind = col.dist_kind()\n            if col.ctype == \"note\":\n                problems.extend(_validate_note(tag, col))\n                continue\n            if col.ctype == \"person_name\":\n                pass  # synthesized; distribution optional\n            elif not col.distribution:\n                # Rule-produced columns need no distribution \u2014\n                # requiring a throwaway one made a live compile\n                # invent placeholders.\n                if col.name not in rule_targets:\n                    problems.append(\n                        \"{}: needs a distribution (or a rule \"\n                        \"that produces it)\".format(tag))\n            elif kind in DIST_KINDS and kind not in                     _TYPE_DISTS.get(col.ctype, set())                     and col.name in rule_targets:\n                problems.append(\n                    \"{}: distribution `{}` invalid for type \"\n                    \"`{}` \u2014 this column is produced by a rule, \"\n                    \"so you may omit its distribution entirely\"\n                    .format(tag, kind, col.ctype))\n            elif kind not in DIST_KINDS:\n                if kind in RULE_KINDS:\n                    problems.append(\n                        \"{}: `{}` is a RULE kind, not a \"\n                        \"distribution \u2014 give this column a \"\n                        \"normal distribution for its type and \"\n                        \"add a top-level rule referencing it\"\n                        .format(tag, kind))\n                else:\n                    problems.append(\n                        \"{}: unknown distribution `{}` \u2014 valid \"\n                        \"kinds: {}\".format(\n                            tag, kind, \", \".join(DIST_KINDS)))\n            elif kind not in _TYPE_DISTS[col.ctype]:\n                problems.append(\n                    \"{}: distribution `{}` invalid for type `{}`\"\n                    .format(tag, kind, col.ctype))\n            else:\n                problems.extend(self._check_params(tag, col))\n            m = col.mess\n            for rname in (\"missing_rate\", \"typo_rate\",\n                          \"format_rate\", \"outlier_rate\",\n                          \"case_rate\", \"space_rate\"):\n                if not (0.0 <= getattr(m, rname) <= 1.0):\n                    problems.append(\"{}: {} must be in [0, 1]\"\n                                    .format(tag, rname))\n            if m.outlier_rate > 0 and col.ctype not in (\n                    \"int\", \"float\"):\n                problems.append(\"{}: outlier_rate needs a numeric \"\n                                \"column\".format(tag))\n            if m.wrong_rate > 0 and col.ctype == \"str_id\":\n                problems.append(\"{}: wrong_rate is not supported \"\n                                \"on str_id columns\".format(tag))\n        ctypes = {c.name: c.ctype for c in self.columns}\n        names = set(ctypes)\n        for i, rule in enumerate(self.rules):\n            rtag = \"rule #{}\".format(i + 1)\n            kind = rule.get(\"kind\")\n            if kind not in RULE_KINDS:\n                problems.append(\n                    \"{}: unknown kind `{}` \u2014 valid rule kinds are \"\n                    \"date_after and derived; row duplication is \"\n    # ... (226 more lines in tablespec.py) ...", "walk": [["Read the entire recipe and list every problem at once", "not one error at a time \u2014 the whole homework, marked"], ["Explain each problem in teaching voice", "each message grew from a real person's real confusion"]]}, {"label": "Note columns: text with planted signal", "symbol": "_validate_note", "file": "tablespec.py", "blurb": "Plain English: a table can carry a free-text note field whose hidden phrases genuinely drive the outcome. This validator teaches the rules: elements need phrasings, densities, weights; distractors can carry `excludes` so denial traps only appear in patients WITHOUT the risk.", "code": "def _validate_note(tag, col):\n    problems = []\n    if col.distribution:\n        problems.append(\n            \"{}: note columns take no distribution \u2014 their \"\n            \"content comes from `note.elements` and \"\n            \"`note.distractors`\".format(tag))\n    if any([col.mess.missing_rate, col.mess.typo_rate,\n            col.mess.case_rate, col.mess.space_rate,\n            col.mess.format_rate, col.mess.outlier_rate,\n            col.mess.wrong_rate]):\n        problems.append(\n            \"{}: note columns take no cell mess \u2014 their mess \"\n            \"IS the text (trap phrasings, style variance, \"\n            \"fillers)\".format(tag))\n    note = col.note or {}\n    elements = note.get(\"elements\", [])\n    if not elements:\n        problems.append(\n            \"{}: note columns need `note.elements` \u2014 at least \"\n            \"one planted phrase with an `id`, `phrasings`, a \"\n            \"`density` in (0,1), and a `weight` for the \"\n            \"outcome logit\".format(tag))\n    seen = set()\n    for el in elements:\n        eid = el.get(\"id\", \"\")\n        if not eid or eid in seen:\n            problems.append(\n                \"{}: note element needs a unique `id`\".format(\n                    tag))\n        seen.add(eid)\n        if not el.get(\"phrasings\"):\n            problems.append(\n                \"{} element `{}`: needs `phrasings` (2+ \"\n                \"surface forms keep the text messy)\".format(\n                    tag, eid))\n        d = el.get(\"density\", None)\n        if d is None or not (0.0 < float(d) < 1.0):\n            problems.append(\n                \"{} element `{}`: `density` must be in (0,1) \"\n                \"\u2014 the fraction of patients whose note \"\n                \"contains it\".format(tag, eid))\n    for dis in note.get(\"distractors\", []):\n        if not dis.get(\"id\") or not dis.get(\"phrasings\"):\n            problems.append(\n                \"{}: each distractor needs an `id` and \"\n                \"`phrasings`\".format(tag))\n        dd = dis.get(\"density\", None)\n        if dd is None or not (0.0 < float(dd) <= 1.0):\n            problems.append(\n                \"{} distractor `{}`: `density` must be in \"\n                \"(0,1]\".format(tag, dis.get(\"id\", \"?\")))\n    return problems", "walk": [["Check the free-text note plan is complete", "the hidden phrases need wording variants, how often they appear, and how strongly they matter"], ["Check the traps are wired correctly", "a denial like 'denies missing doses' must be set to appear only in patients who truly didn't"]]}]}, {"file": "spec.py", "name": "spec (documents)", "blurb": "The document-corpus schema: plantable elements, distractor traps, style axes, difficulty tiers.", "components": [{"label": "TargetElement", "symbol": "TargetElement", "file": "spec.py", "blurb": "A plantable fact the outside model SHOULD extract \u2014 density, difficulty, phrasings.", "code": "@dataclass\nclass TargetElement:\n    \"\"\"A plantable fact the outside model SHOULD extract.\n\n    element_id   stable key, becomes the ground-truth label\n    description  what the fact is (\"current medication with dose\")\n    phrasings    2+ surface realizations; the planner draws one per\n                 document (\"{value} 20mg daily\", \"pt continues\n                 {value}\"). '{value}' slots a sampled value when\n                 value_source names a structured field or a\n                 categorical pool.\n    density      fraction of documents that contain this element\n    difficulty   easy/medium/hard \u2014 a rendering hint (hard = buried,\n                 abbreviated, or split across sentences) and an\n                 evaluation slice\n    value_source optional: structured field name or inline\n                 {\"choices\": [...]} pool supplying '{value}'\n    \"\"\"\n    element_id: str\n    description: str\n    phrasings: List[str]\n    density: float = 1.0\n    difficulty: str = \"medium\"\n    value_source: Optional[Any] = None", "walk": [["Describe one fact a tested model SHOULD find", "how often it appears, how hard it is, and the different ways it can be phrased"]]}, {"label": "Distractor", "symbol": "Distractor", "file": "spec.py", "blurb": "The trap: content that LOOKS extractable and must NOT be. The discontinued-medication trap caught a real model at 26%.", "code": "@dataclass\nclass Distractor:\n    \"\"\"A plausible near-miss the model should NOT extract \u2014 the part\n    of the spec that makes a test adversarial rather than a demo.\n    Same shape as a target minus difficulty semantics.\"\"\"\n    distractor_id: str\n    description: str\n    phrasings: List[str]\n    density: float = 0.5\n    value_source: Optional[Any] = None", "walk": [["Describe one trap a tested model must NOT fall for", "text that looks extractable but is wrong to extract \u2014 one real AI fell for a trap like this 26% of the time"]]}]}], "plain": "Turn a plain-English request into an exact, reviewable recipe for the data.", "steps": [["Read the paragraph describing the data someone needs", "a doctor writes what records should look like \u2014 no code, no forms"], ["Draft a formal recipe from it", "an AI writes the first draft, but drafts can contain mistakes \u2014 one small model invented three impossible settings in a single live run"], ["Check the draft and explain every problem in plain terms", "the checker lists everything wrong at once, in teaching voice, so the fix is obvious"], ["Wait for a person to approve", "nothing is ever created from an unapproved recipe \u2014 the pause is the safety feature, not a delay"]]}, {"id": "truth", "stage": "plant the truth", "note": "clean data + ledgered mess,\ndeterministic to the cell", "label": "Truth Planning", "color": "#6B3FA0", "blurb": "Deterministic generation where the blueprint IS the ground truth. Cell-level seeds; every corruption ledgered; same spec, same data, forever.", "modules": [{"file": "tableplan.py", "name": "tableplan", "blurb": "Clean truth first, then mess \u2014 mutually exclusive per cell, priority-ordered, every op a signed ledger entry.", "components": [{"label": "Cell-seed determinism", "symbol": "_cell_rng", "file": "tableplan.py", "blurb": "sha256(master:row:column) -> independent RNG per cell. The column-independence law: editing one column never reshuffles another.", "code": "def _cell_rng(master: int, row: int, column: str,\n              op: str = \"value\") -> random.Random:\n    key = \"{}:{}:{}:{}\".format(master, row, column, op)\n    digest = hashlib.sha256(key.encode(\"utf-8\")).hexdigest()\n    return random.Random(int(digest[:16], 16))", "walk": [["Give every single cell its own private dice", "seeded by recipe, row, and column"], ["Guarantee editing one column never reshuffles another", "so a small recipe change doesn't silently change everything else"]]}, {"label": "Rules: days_from date gaps", "symbol": "_apply_rules", "file": "tableplan.py", "blurb": "date_after with days_from makes discharge = admission + los. Built because a live compile kept asking for a coupling the schema could not say.", "code": "def _apply_rules(spec: TableSpec, row: int,\n                 vals: Dict[str, Any]) -> None:\n    \"\"\"Cross-column rules, in declared order, overwriting the\n    target's base value. Seeds key on the TARGET column name, so\n    the column-independence law survives: adding an unrelated\n    column changes nothing, and a rule target depends only on its\n    sources plus its own seed.\"\"\"\n    for i, rule in enumerate(spec.rules):\n        kind = rule[\"kind\"]\n        if kind == \"date_after\":\n            earlier = vals[rule[\"earlier\"]]\n            days_from = rule.get(\"days_from\")\n            if days_from is not None:\n                # The gap IS another column's value \u2014 dates and\n                # durations stay consistent, the way a real table\n                # would be. (A live compile wanted exactly this\n                # and the schema could not say it.)\n                delta = max(int(round(\n                    float(vals[days_from]))), 0)\n            else:\n                rng = _cell_rng(spec.master_seed, row,\n                                rule[\"later\"],\n                                \"rule{}\".format(i))\n                delta = rng.randint(int(rule[\"min_days\"]),\n                                    int(rule[\"max_days\"]))\n            vals[rule[\"later\"]] = earlier + timedelta(days=delta)\n        elif kind == \"derived\":\n            source = vals[rule[\"source\"]]\n            base = float(source) * float(rule[\"factor\"])\n            sigma = float(rule.get(\"noise_sigma\", 0.0))\n            if sigma > 0:\n                rng = _cell_rng(spec.master_seed, row,\n                                rule[\"target\"],\n                                \"rule{}\".format(i))\n                base *= rng.lognormvariate(0.0, sigma)\n            target_col = next(c for c in spec.columns\n                              if c.name == rule[\"target\"])\n            vals[rule[\"target\"]] = (int(round(base))\n                                    if target_col.ctype == \"int\"\n                                    else round(base, 4))", "walk": [["Enforce relationships between fields", "discharge dates follow admission dates by the length of stay; charges derive from days at a daily rate"]]}, {"label": "Outcomes: logistic and linear", "symbol": "plan_table", "file": "tableplan.py", "blurb": "Planted causality. Logistic stores true probabilities (the AUROC ceiling); linear stores the noiseless signal (the exact R^2 ceiling).", "code": "def plan_table(spec: TableSpec) -> TableBlueprint:\n    spec.validate()\n    columns = [c.name for c in spec.columns]\n    clean_rows: List[Dict[str, str]] = []\n    clean_vals: List[Dict[str, Any]] = []\n    note_truth: Dict[str, List[Dict[str, bool]]] = {\n        c.name: [] for c in spec.columns if c.ctype == \"note\"}\n    for r in range(spec.rows):\n        vals = {}\n        for c in spec.columns:\n            if c.ctype == \"note\":\n                text, presence = _build_note(\n                    c, r, spec.master_seed)\n                vals[c.name] = text\n                note_truth[c.name].append(presence)\n                for eid, hit in presence.items():\n                    vals[\"_note::{}::{}\".format(\n                        c.name, eid)] = 1.0 if hit else 0.0\n            else:\n                vals[c.name] = _gen_clean(\n                    c, r, spec.master_seed)\n        _apply_rules(spec, r, vals)\n        clean_vals.append(vals)\n        clean_rows.append({k: clean_str(v)\n                           for k, v in vals.items()\n                           if not k.startswith(\"_\")})\n\n    # Joint structure BEFORE outcomes, so planted coefficients act\n    # on the correlated values a model will actually see.\n    _apply_correlations(spec, clean_vals, clean_rows)\n\n    # Outcomes: labels from CLEAN values (truth reflects reality;\n    # mess on features is what makes prediction hard).\n    true_probs: Dict[str, List[float]] = {}\n    for oc in spec.outcomes:\n        name = oc[\"name\"]\n        kind = oc.get(\"kind\", \"logistic\")\n        probs: List[float] = []\n        for r in range(spec.rows):\n            z = float(oc[\"intercept\"])\n            for key, w in oc[\"coefficients\"].items():\n                z += float(w) * _feature(key, clean_vals[r])\n            rng = _cell_rng(spec.master_seed, r, name,\n                            \"outcome\")\n            if kind == \"linear\":\n                # The noiseless signal is the TRUTH; additive\n                # gaussian noise of known sigma is the\n                # irreducible error that sets the R^2 ceiling.\n                probs.append(z)\n                value = z + rng.gauss(0.0, float(\n                    oc.get(\"noise_sigma\", 0.0)))\n                clean_vals[r][name] = round(value, 4)\n                clean_rows[r][name] = clean_str(\n                    round(value, 4))\n            else:\n                prob = 1.0 / (1.0 + math.exp(-z))\n                probs.append(prob)\n                label = rng.random() < prob\n                clean_vals[r][name] = label\n                clean_rows[r][name] = clean_str(label)\n        true_probs[name] = probs\n    outcome_names = [oc[\"name\"] for oc in spec.outcomes]\n    columns = columns + outcome_names\n\n    dirty_rows: List[Dict[str, str]] = []\n    ledger: List[CellMess] = []\n    for r in range(spec.rows):\n        row_out: Dict[str, str] = {\n            name: clean_rows[r][name] for name in outcome_names}\n        for col in spec.columns:\n            cval = clean_vals[r][col.name]\n            cstr = clean_rows[r][col.name]\n            dirty = cstr\n            op_applied = None\n            if col.ctype == \"note\":\n                row_out[col.name] = dirty\n                continue\n            m = col.mess\n            # Ops are mutually exclusive per cell, priority order;\n            # each op draws its own seeded RNG so toggling one rate\n            # never shifts another's draws. `wrong` is first: a\n            # plausible lie is the deepest corruption and must not\n            # be masked by surface mess.\n            if m.wrong_rate > 0 and _cell_rng(\n                    spec.master_seed, r, col.name,\n                    \"wrong\").random() < m.wrong_rate:\n                cand = _wrong_value(col, cval, _cell_rng(\n                    spec.master_seed, r, col.name, \"wrong_pick\"))\n                if cand != cstr:\n                    dirty = cand\n    # ... (78 more lines in tableplan.py) ...", "walk": [["Build every clean record first", "the answer key exists before any mess does"], ["Decide each patient's outcome from planted causes", "and remember the exact probabilities \u2014 that is how the best possible score is known"], ["Then corrupt deliberately, writing every act down", "missing values, typos, duplicates \u2014 each one a signed ledger entry"]]}, {"label": "Hybrid notes: prose that moves the logit", "symbol": "_build_note", "file": "tableplan.py", "blurb": "The capstone mechanism. Each patient's note is assembled from seeded phrase draws; which risk phrases landed feeds the outcome directly \u2014 so the achievable ceiling INCLUDES the text, and any model that cannot read hits a lower wall by construction. Measured: ceiling 0.82, note-blind 0.60, note-reading 0.72.", "code": "def _build_note(col, r: int, seed: int):\n    \"\"\"Assemble one patient's note deterministically: seeded\n    presence draws per element/distractor, seeded phrasing\n    picks, fillers, seeded sentence order. Returns (text,\n    presence) where presence maps element_id -> bool \u2014 the\n    ground truth that feeds the outcome logit.\"\"\"\n    note = col.note or {}\n    rng = _cell_rng(seed, r, col.name, \"note\")\n    sentences = []\n    presence = {}\n    for el in note.get(\"elements\", []):\n        hit = rng.random() < float(el.get(\"density\", 0.0))\n        presence[el[\"id\"]] = hit\n        if hit:\n            phr = el[\"phrasings\"][\n                rng.randrange(len(el[\"phrasings\"]))]\n            sentences.append(phr)\n    for dis in note.get(\"distractors\", []):\n        # `excludes`: only plant this trap when the named\n        # element is ABSENT \u2014 \"denies missing doses\" belongs in\n        # the notes of patients who did NOT miss doses; that is\n        # what makes naive keyword matching dangerous.\n        excl = dis.get(\"excludes\", \"\")\n        if excl and presence.get(excl, False):\n            continue\n        if rng.random() < float(dis.get(\"density\", 0.0)):\n            phr = dis[\"phrasings\"][\n                rng.randrange(len(dis[\"phrasings\"]))]\n            sentences.append(phr)\n    fillers = list(note.get(\"fillers\", []))\n    if fillers:\n        n_fill = 1 + rng.randrange(min(3, len(fillers)))\n        picks = list(range(len(fillers)))\n        for _ in range(n_fill):\n            k = picks.pop(rng.randrange(len(picks)))\n            sentences.append(fillers[k])\n            if not picks:\n                break\n    order = list(range(len(sentences)))\n    shuffled = []\n    while order:\n        shuffled.append(sentences[order.pop(\n            rng.randrange(len(order)))])\n    text = \" \".join(s.rstrip(\".\") + \".\" for s in shuffled)\n    return text, presence", "walk": [["Assemble each patient's note from seeded phrase draws", "which risk phrases landed is decided here, patient by patient"], ["Feed those phrases into the outcome itself", "so reading the notes is genuinely worth points: measured, a note-blind model tops out at 0.60 where 0.82 is achievable"], ["Keep denial traps out of truly at-risk patients", "'denies missing any doses' appears only where it's true \u2014 the trap that punishes keyword matching"]]}]}, {"file": "planner.py", "name": "planner (documents)", "blurb": "Blueprints decide every document's contents before any prose exists.", "components": [{"label": "plan_corpus", "symbol": "plan_corpus", "file": "planner.py", "blurb": "Elements, distractors, styles, difficulties \u2014 all drawn deterministically per document.", "code": "def plan_corpus(spec: DataSpec) -> List[Blueprint]:\n    \"\"\"Validates, then plans every document. Deterministic.\"\"\"\n    spec.validate()\n    return [plan_document(spec, i) for i in range(spec.corpus.size)]", "walk": [["Decide every document's contents before any prose", "which facts, which traps, which writing style \u2014 all drawn deterministically per document"]]}]}, {"file": "relational.py", "name": "relational", "blurb": "Multi-table truth. Seeded foreign keys; join mess in tiers: random orphans, near-key orphans, and format drift \u2014 the precision trap.", "components": [{"label": "plan_relational", "symbol": "plan_relational", "file": "relational.py", "blurb": "Layered determinism: per-table seeds, seeded fk assignment, orphan/drift injection into DIRTY rows only \u2014 clean truth keeps referential integrity always.", "code": "def plan_relational(spec: RelationalSpec) -> RelationalBlueprint:\n    spec.validate()\n    blueprints: Dict[str, TableBlueprint] = {}\n    for name, table in spec.tables.items():\n        derived = TableSpec.from_json(table.to_json())\n        derived.master_seed = _table_seed(spec.master_seed, name)\n        blueprints[name] = plan_table(derived)\n    ledger: List[OrphanMess] = []\n    drift: List[DriftMess] = []\n    for link in spec.links:\n        parent_bp = blueprints[link.parent]\n        child_bp = blueprints[link.child]\n        parent_keys = [r[link.parent_key]\n                       for r in parent_bp.clean_rows]\n        prefix = \"\".join(\n            ch for ch in parent_keys[0]\n            if not ch.isdigit()) if parent_keys else \"X\"\n        width = len(parent_keys[0]) - len(prefix) \\\n            if parent_keys else 5\n        rng = random.Random(_table_seed(\n            spec.master_seed,\n            \"link:{}:{}\".format(link.child, link.fk_column)))\n        n_clean = len(child_bp.clean_rows)\n        assignments = [rng.choice(parent_keys)\n                       for _ in range(n_clean)]\n        for i, row in enumerate(child_bp.clean_rows):\n            row[link.fk_column] = assignments[i]\n        # Dirty rows include duplicates; map each dirty row back\n        # to its clean origin via the trailing append order: the\n        # first n_clean dirty rows correspond 1:1, appended\n        # duplicates copy their source row's assignment.\n        for i, row in enumerate(child_bp.dirty_rows):\n            src_idx = i if i < n_clean else \\\n                _dup_source(child_bp, i, n_clean)\n            row[link.fk_column] = assignments[src_idx]\n        # Join mess on DIRTY only, seeded per row; orphan and\n        # drift are mutually exclusive per cell (orphan first \u2014\n        # a broken reference is the deeper corruption).\n        existing = set(parent_keys)\n        for i in range(len(child_bp.dirty_rows)):\n            src_idx = i if i < n_clean else \\\n                _dup_source(child_bp, i, n_clean)\n            true_key = assignments[src_idx]\n            r = random.Random(_table_seed(\n                spec.master_seed,\n                \"orphan:{}:{}:{}\".format(\n                    link.child, link.fk_column, i)))\n            if r.random() < link.orphan_rate:\n                fake = _make_orphan(link.orphan_style, true_key,\n                                    prefix, width, existing, r)\n                if fake is None:\n                    continue\n                ledger.append(OrphanMess(\n                    child=link.child, row=i,\n                    fk_column=link.fk_column,\n                    true_key=true_key, orphan_key=fake))\n                child_bp.dirty_rows[i][link.fk_column] = fake\n                continue\n            rd = random.Random(_table_seed(\n                spec.master_seed,\n                \"drift:{}:{}:{}\".format(\n                    link.child, link.fk_column, i)))\n            if rd.random() < link.drift_rate:\n                mangled = _drift_key(true_key, rd)\n                if mangled == true_key:\n                    continue\n                drift.append(DriftMess(\n                    child=link.child, row=i,\n                    fk_column=link.fk_column,\n                    true_key=true_key, drifted=mangled))\n                child_bp.dirty_rows[i][link.fk_column] = mangled\n        if link.fk_column not in child_bp.columns:\n            child_bp.columns.append(link.fk_column)\n    return RelationalBlueprint(blueprints=blueprints,\n                               link_ledger=ledger,\n                               drift_ledger=drift)", "walk": [["Plan several linked tables that agree with each other", "patients, visits, bills \u2014 sharing consistent IDs"]]}, {"label": "Orphan styles + drift", "symbol": "_make_orphan", "file": "relational.py", "blurb": "'near' orphans are one digit-transposition from a real key; drift mangles VALID references so naive set-checkers false-flag good data (precision 0.35 in the demo, 1.00 after normalizing).", "code": "def _make_orphan(style: str, true_key: str, prefix: str,\n                 width: int, existing, r) -> Optional[str]:\n    if style == \"near\":\n        digits = list(true_key[len(prefix):])\n        for _attempt in range(20):\n            if len(digits) < 2:\n                break\n            j = r.randint(0, len(digits) - 2)\n            swapped = list(digits)\n            swapped[j], swapped[j + 1] = \\\n                swapped[j + 1], swapped[j]\n            cand = prefix + \"\".join(swapped)\n            if cand not in existing and cand != true_key:\n                return cand\n        return None\n    for _attempt in range(20):\n        cand = \"{}{:0{}d}\".format(\n            prefix, r.randint(10 ** width,\n                              2 * 10 ** width - 1), width)\n        if cand not in existing:\n            return cand\n    return None", "walk": [["Deliberately break some links between tables", "the way real exports do \u2014 including near-miss IDs that are one character off"]]}]}], "plain": "Build the answer key first: decide every value, every flaw, and every hidden trap before any data exists.", "steps": [["Decide every clean value from the recipe", "each cell gets its own dice roll, seeded, so the same recipe gives the same data forever \u2014 on any machine"], ["Plant the outcome's true causes", "who gets readmitted is decided by known factors with known strengths, so the best possible score is known exactly"], ["Write the clinical notes with risk phrases hidden inside", "real risk lives in free text \u2014 'ran out of furosemide two weeks ago' \u2014 and here those phrases genuinely drive the outcome"], ["Lace in traps and deliberate flaws, keeping a ledger", "denials appear only in patients WITHOUT the risk, old findings look current, values go missing or mistyped \u2014 and every corruption is written down"]]}, {"id": "render", "stage": "make artifacts", "note": "csv / corpora under\nintegrity manifests", "label": "Rendering", "color": "#3D5A6C", "blurb": "Blueprints become artifacts under integrity manifests. Documents render via LLM with verify-and-retry; tables write dirty/clean/ledger; tamper one byte and loading refuses.", "modules": [{"file": "renderer.py", "name": "renderer", "blurb": "LLM prose, never trusted: every note verified against its blueprint, retried, or deterministically fallback-rendered.", "components": [{"label": "render_corpus", "symbol": "render_corpus", "file": "renderer.py", "blurb": "The verify-retry-fallback loop; the RenderReport counts first-try successes honestly.", "code": "def render_corpus(spec: DataSpec, blueprints: List[Blueprint],\n                  backend: LLMBackend,\n                  attempts: int = RENDER_ATTEMPTS,\n                  ) -> Tuple[Dict[str, str], RenderReport]:\n    \"\"\"Every blueprint's notes rendered and verified. Returns\n    ({doc_id: text}, report). Multi-note documents concatenate with\n    field headers. CANNOT fail \u2014 only degrade, measurably.\"\"\"\n    fields = {u.name: u for u in spec.unstructured_fields}\n    report = RenderReport(documents=len(blueprints))\n    documents: Dict[str, str] = {}\n    for bp in blueprints:\n        chunks: List[str] = []\n        for note in bp.notes:\n            spec_field = fields[note.field_name]\n            r = render_note(bp, note, spec_field, backend,\n                            attempts=attempts, report=report)\n            report.notes_rendered += 1\n            if r.used_fallback:\n                report.fallbacks += 1\n            elif r.attempts == 1:\n                report.first_try += 1\n            else:\n                report.retried += 1\n            if len(bp.notes) > 1:\n                chunks.append(\"[{}]\\n{}\".format(note.field_name,\n                                                r.text))\n            else:\n                chunks.append(r.text)\n        documents[bp.doc_id] = \"\\n\\n\".join(chunks)\n    return documents, report", "walk": [["Write each document, then verify it against its plan", "AI prose is checked fact by fact"], ["Retry or fall back when the writer drifts", "a wrong note is rewritten; a hopeless one is replaced deterministically \u2014 the demo cannot be derailed by a bad writing day"]]}]}, {"file": "tableplan.py", "name": "table artifacts", "blurb": "dirty.csv + clean.csv + ledger.json under a sha256 manifest.", "components": [{"label": "write_table / integrity", "symbol": "write_table", "file": "tableplan.py", "blurb": "Every artifact hashed into manifest.json; load_table verifies before trusting.", "code": "def write_table(run_dir: Path, spec: TableSpec,\n                bp: TableBlueprint) -> Path:\n    run_dir = Path(run_dir)\n    run_dir.mkdir(parents=True, exist_ok=True)\n    artifacts = {\n        \"dirty.csv\": _csv_text(bp.columns, bp.dirty_rows),\n        \"clean.csv\": _csv_text(bp.columns, bp.clean_rows),\n        \"ledger.json\": json.dumps(\n            {\"ledger\": [asdict(m) for m in bp.ledger],\n             \"duplicate_of\": {str(k): v for k, v\n                              in bp.duplicate_of.items()},\n             \"true_probs\": {k: [round(x, 6) for x in v]\n                            for k, v in bp.true_probs.items()}},\n            indent=2),\n    }\n    hashes = {}\n    for name, text in artifacts.items():\n        (run_dir / name).write_text(text, encoding=\"utf-8\")\n        hashes[name] = _sha(text)\n    manifest = {\n        \"synthkit_table_manifest\": 1,\n        \"spec\": json.loads(spec.to_json()),\n        \"rows\": spec.rows,\n        \"dirty_rows\": len(bp.dirty_rows),\n        \"mess_cells\": len([m for m in bp.ledger\n                           if m.op != \"duplicate\"]),\n        \"hashes\": hashes,\n    }\n    (run_dir / \"manifest.json\").write_text(\n        json.dumps(manifest, indent=2), encoding=\"utf-8\")\n    return run_dir", "walk": [["Write the four artifacts of a run", "messy data, clean answer key, corruption ledger, and a manifest that fingerprints them all"]]}]}], "plain": "Turn the plan into real files: the messy dataset, the clean answer key, and the corruption ledger.", "steps": [["Write the messy dataset a model would actually face", "with the typos, gaps, and duplicates a real hospital extract has"], ["Write the clean answer key beside it", "same records, every flaw repaired, every truth known \u2014 the exam's grading sheet"], ["Optionally let an AI phrase the free-text notes", "for more natural prose \u2014 but every AI-written note is checked against the answer key and corrected if it drifts; the demo laptop's small model needed one correction in eight notes"]]}, {"id": "eval", "stage": "score vs ceiling", "note": "exact scoring against the\nledger and the possible", "label": "Evaluation & Ceilings", "color": "#B3541E", "blurb": "Scoring against the ledger, never heuristics \u2014 and against the CEILING: the best any solver could honestly do, known because the truth is planted.", "modules": [{"file": "tableeval.py", "name": "tableeval", "blurb": "Cleaning fix-rates by op, prediction AUROC vs ceiling, regression R^2 vs exact ceiling.", "components": [{"label": "evaluate_cleaning", "symbol": "evaluate_cleaning", "file": "tableeval.py", "blurb": "Same-length contract; fix/overcorrection sliced by op and column; wrong-detection and dup-flag rates.", "code": "def evaluate_cleaning(bp: TableBlueprint,\n                      cleaned_rows: List[Dict[str, str]],\n                      cleaner_name: str = \"cleaner\",\n                      ) -> CleaningReport:\n    if len(cleaned_rows) != len(bp.dirty_rows):\n        raise ValueError(\n            \"cleaner must return {} row(s) in order, got {} \u2014 \"\n            \"flag duplicates via a `_duplicate` column instead of \"\n            \"dropping rows\".format(len(bp.dirty_rows),\n                                   len(cleaned_rows)))\n    mess = bp.ledger_index()\n    n_originals = len(bp.clean_rows)\n    ops: Dict[str, OpScore] = {}\n    cols: Dict[str, ColumnScore] = {\n        c: ColumnScore(c) for c in bp.columns}\n    fixed = missed = clean_cells = overcorrected = 0\n\n    for r in range(n_originals):\n        for c in bp.columns:\n            truth = _norm(bp.clean_rows[r][c])\n            out = _norm(cleaned_rows[r].get(c, \"\"))\n            entry = mess.get((r, c))\n            col_sc = cols[c]\n            col_sc.cells += 1\n            if entry is not None:\n                sc = ops.setdefault(entry.op, OpScore(entry.op))\n                sc.total += 1\n                if out == truth:\n                    sc.fixed += 1\n                    fixed += 1\n                    col_sc.correct += 1\n                else:\n                    missed += 1\n            else:\n                clean_cells += 1\n                if out == truth:\n                    col_sc.correct += 1\n                else:\n                    overcorrected += 1\n\n    dup_total = len(bp.duplicate_of)\n    dup_flagged = dup_false = 0\n    # Wrong-value detection: the cleaner may emit a `_suspect`\n    # column per row listing comma-separated column names it\n    # believes carry wrong values. Fixing a plausible lie is\n    # usually impossible; FLAGGING it is the measurable skill.\n    wrong_cells = {(m.row, m.column) for m in bp.ledger\n                   if m.op == \"wrong\"}\n    wrong_detected = suspect_false = 0\n    for idx, row in enumerate(cleaned_rows):\n        flagged = str(row.get(\"_duplicate\", \"\")).strip().lower() \\\n            in (\"1\", \"true\", \"yes\", \"y\")\n        if idx in bp.duplicate_of:\n            if flagged:\n                dup_flagged += 1\n        elif flagged:\n            dup_false += 1\n        suspects = [s.strip() for s in\n                    str(row.get(\"_suspect\", \"\")).split(\",\")\n                    if s.strip()]\n        for col in suspects:\n            if (idx, col) in wrong_cells:\n                wrong_detected += 1\n            elif idx < n_originals:\n                suspect_false += 1\n\n    return CleaningReport(\n        cleaner_name=cleaner_name,\n        rows=len(bp.dirty_rows),\n        mess_cells=len(mess),\n        fixed=fixed,\n        missed=missed,\n        clean_cells=clean_cells,\n        overcorrected=overcorrected,\n        ops=ops,\n        columns=cols,\n        dup_total=dup_total,\n        dup_flagged=dup_flagged,\n        dup_false_flags=dup_false,\n        wrong_total=len(wrong_cells),\n        wrong_detected=wrong_detected,\n        suspect_false=suspect_false,\n    )", "walk": [["Grade a cleaning attempt cell by cell", "fixed, missed, or overcorrected \u2014 sliced by corruption type"]]}, {"label": "evaluate_prediction", "symbol": "evaluate_prediction", "file": "tableeval.py", "blurb": "AUROC against the ceiling computed from generating probabilities \u2014 the gap is the sentence.", "code": "def evaluate_prediction(bp: TableBlueprint, outcome: str,\n                        scores: List[float],\n                        solver_name: str = \"solver\",\n                        ) -> PredictionReport:\n    from .mlmetrics import (at_threshold, auroc, brier,\n                            ceiling_auroc)\n    if outcome not in bp.true_probs:\n        raise ValueError(\n            \"outcome `{}` not generated in this table (have: {})\"\n            .format(outcome, sorted(bp.true_probs)))\n    n = len(bp.clean_rows)\n    if len(scores) != n:\n        raise ValueError(\n            \"need one score per ORIGINAL row ({}) in order, \"\n            \"got {}\".format(n, len(scores)))\n    labels = [1 if bp.clean_rows[r][outcome] == \"True\" else 0\n              for r in range(n)]\n    thresh = at_threshold(scores, labels)\n    return PredictionReport(\n        solver_name=solver_name,\n        outcome=outcome,\n        n=n,\n        n_pos=sum(labels),\n        auroc=auroc(scores, labels),\n        ceiling_auroc=ceiling_auroc(\n            bp.true_probs[outcome], labels),\n        brier_score=brier(\n            [min(max(s, 0.0), 1.0) for s in scores], labels),\n        accuracy=thresh[\"accuracy\"],\n        f1=thresh[\"f1\"],\n    )", "walk": [["Score predictions on ranking quality", "did the model put the truly at-risk patients ahead of the rest \u2014 and by how much versus the ceiling"]]}, {"label": "evaluate_regression", "symbol": "evaluate_regression", "file": "tableeval.py", "blurb": "ceiling_r2 = Var(signal)/Var(y): exact by construction. The demo's baseline sits 0.005-0.007 under it.", "code": "def evaluate_regression(bp, outcome: str,\n                        predictions: List[float],\n                        solver_name: str) -> RegressionReport:\n    if outcome not in bp.true_probs:\n        raise TableEvalError(\n            \"`{}` is not a generated outcome of this table\"\n            .format(outcome))\n    n = len(bp.clean_rows)\n    if len(predictions) != n:\n        raise TableEvalError(\n            \"predictions must cover every clean row: got {} \"\n            \"for {} rows\".format(len(predictions), n))\n    y = [float(r[outcome]) for r in bp.clean_rows]\n    signal = bp.true_probs[outcome]\n    mean_y = sum(y) / n\n    ss_tot = sum((v - mean_y) ** 2 for v in y) or 1e-12\n    ss_res = sum((yv - float(pv)) ** 2\n                 for yv, pv in zip(y, predictions))\n    mean_sig = sum(signal) / n\n    ss_sig = sum((s - mean_sig) ** 2 for s in signal)\n    rmse = (ss_res / n) ** 0.5\n    mae = sum(abs(yv - float(pv))\n              for yv, pv in zip(y, predictions)) / n\n    return RegressionReport(\n        solver_name=solver_name, outcome=outcome, n=n,\n        r2=round(1.0 - ss_res / ss_tot, 4),\n        rmse=round(rmse, 4), mae=round(mae, 4),\n        ceiling_r2=round(min(ss_sig / ss_tot, 1.0), 4))", "walk": [["Score numeric predictions against planted signal", "with the exact best-possible accuracy known in advance"]]}]}, {"file": "evaluator.py", "name": "evaluator (documents)", "blurb": "Recall per element, false positives per distractor \u2014 the trap rate that characterized a real model.", "components": [{"label": "evaluate", "symbol": "evaluate", "file": "evaluator.py", "blurb": "Extractions matched against planted truth; distractor hits counted as the fp_rate a vendor meeting needs.", "code": "def evaluate(\n    blueprints: List[Blueprint],\n    documents: Dict[str, str],\n    extractor: ExtractorAdapter,\n    rules: Optional[Dict[str, MatchRule]] = None,\n) -> EvalReport:\n    \"\"\"Run the extractor over every document and align against the\n    blueprints. `rules` maps element_id/distractor_id -> MatchRule\n    (missing ids get the default value-match-any-category rule).\"\"\"\n    rules = rules or {}\n\n    def rule_for(key: str) -> MatchRule:\n        return rules.get(key, MatchRule())\n\n    elements: Dict[str, ElementScore] = {}\n    distractors: Dict[str, DistractorScore] = {}\n    diff_cells: Dict[str, List[int]] = {}\n    style_cells: Dict[str, Dict[str, List[int]]] = {}\n    unmatched = 0\n    total = 0\n\n    for bp in blueprints:\n        text = documents.get(bp.doc_id)\n        if text is None:\n            continue\n        extractions = extractor.extract(bp.doc_id, text)\n        total += len(extractions)\n        used = [False] * len(extractions)\n\n        for note in bp.notes:\n            for el in note.elements:\n                score = elements.setdefault(\n                    el.element_id, ElementScore(el.element_id))\n                score.planted += 1\n                rule = rule_for(el.element_id)\n                needle = _needle_for(rule, el.value, el.phrasing)\n                hit = False\n                for i, ex in enumerate(extractions):\n                    if not _category_ok(rule, ex.category):\n                        continue\n                    if needle and needle in _norm(ex.text):\n                        hit = True\n                        used[i] = True\n                        break\n                if hit:\n                    score.found += 1\n                else:\n                    score.missed_docs.append(bp.doc_id)\n                dc = diff_cells.setdefault(el.difficulty, [0, 0])\n                dc[0] += 1\n                dc[1] += 1 if hit else 0\n                for axis, val in note.style.items():\n                    ax = style_cells.setdefault(axis, {})\n                    cell = ax.setdefault(val, [0, 0])\n                    cell[0] += 1\n                    cell[1] += 1 if hit else 0\n\n            for dtr in note.distractors:\n                dscore = distractors.setdefault(\n                    dtr.distractor_id,\n                    DistractorScore(dtr.distractor_id))\n                dscore.planted += 1\n                rule = rule_for(dtr.distractor_id)\n                needle = _needle_for(rule, dtr.value, dtr.phrasing)\n                for i, ex in enumerate(extractions):\n                    if not _category_ok(rule, ex.category):\n                        continue\n                    if needle and needle in _norm(ex.text):\n                        dscore.false_positives += 1\n                        dscore.fp_docs.append(bp.doc_id)\n                        used[i] = True\n                        break\n\n        unmatched += sum(1 for u in used if not u)\n\n    return EvalReport(\n        extractor_name=extractor.name,\n        documents=len([b for b in blueprints\n                       if b.doc_id in documents]),\n        elements=elements,\n        distractors=distractors,\n        recall_by_difficulty={\n            k: {\"planted\": v[0],\n                \"recall\": (v[1] / v[0]) if v[0] else 0.0}\n            for k, v in diff_cells.items()\n        },\n        recall_by_style={\n            axis: {\n                val: {\"planted\": c[0],\n                      \"recall\": (c[1] / c[0]) if c[0] else 0.0}\n                for val, c in vals.items()\n            }\n            for axis, vals in style_cells.items()\n        },\n        unmatched_extractions=unmatched,\n        total_extractions=total,\n    )", "walk": [["Grade text extraction against the planted facts", "found the real ones? fell for the traps? sliced by difficulty, style, and phrasing"]]}]}, {"file": "mlmetrics.py", "name": "mlmetrics", "blurb": "Stdlib metrics plus the uncertainty layer: every rate knows its k-of-n.", "components": [{"label": "wilson_interval", "symbol": "wilson_interval", "file": "mlmetrics.py", "blurb": "Exact at the edges. Built after 2-of-19 (CI 0.03-0.31) flipped a verdict a naked 0.105 had claimed.", "code": "def wilson_interval(k: int, n: int, z: float = 1.96):\n    \"\"\"Wilson score interval for a binomial proportion. Behaves\n    sanely at the edges (k=0, k=n) where the normal approximation\n    lies.\"\"\"\n    if n <= 0:\n        return (0.0, 1.0)\n    if not (0 <= k <= n):\n        raise MetricInputError(\n            \"k must be within [0, n], got k={} n={}\".format(k, n))\n    p = k / n\n    denom = 1.0 + z * z / n\n    center = (p + z * z / (2 * n)) / denom\n    half = (z * _math.sqrt(\n        p * (1 - p) / n + z * z / (4 * n * n))) / denom\n    return (max(0.0, center - half), min(1.0, center + half))", "walk": [["Attach an honest how-sure range to every rate", "3 misses out of 17 doesn't mean 17.6% exactly \u2014 it means somewhere between 6% and 41%, and the instrument says so"]]}, {"label": "required_n \u2014 the prescription", "symbol": "required_n", "file": "mlmetrics.py", "blurb": "How much MORE data resolves an inconclusive bar. Executable, because synthkit generates data: the resolution run at prescribed n=250/tier closed the study DECISIVE.", "code": "def required_n(p_obs: float, bar: float, z: float = 1.96):\n    \"\"\"Approximate sample size at which a Wilson-style interval\n    around p_obs would exclude the bar \u2014 the PRESCRIPTION: how\n    much more data resolves an inconclusive verdict. None when\n    the observed rate sits on the bar (no n resolves a tie).\"\"\"\n    gap = abs(p_obs - bar)\n    if gap < 1e-9:\n        return None\n    p = min(max(p_obs, 1e-6), 1 - 1e-6)\n    n = (z * z * p * (1 - p)) / (gap * gap)\n    return int(_math.ceil(n))", "walk": [["Prescribe the sample size that would settle it", "when a verdict is inconclusive, the answer isn't a shrug \u2014 it's 'test this many more'"]]}, {"label": "auroc_interval (Hanley-McNeil)", "symbol": "auroc_interval", "file": "mlmetrics.py", "blurb": "Class-split confidence for AUROC lines.", "code": "def auroc_interval(a: float, n_pos: int, n_neg: int,\n                   z: float = 1.96):\n    \"\"\"Hanley-McNeil confidence interval for AUROC.\"\"\"\n    if n_pos <= 0 or n_neg <= 0:\n        return (0.0, 1.0)\n    a = min(max(a, 1e-6), 1 - 1e-6)\n    q1 = a / (2 - a)\n    q2 = 2 * a * a / (1 + a)\n    var = (a * (1 - a) + (n_pos - 1) * (q1 - a * a)\n           + (n_neg - 1) * (q2 - a * a)) / (n_pos * n_neg)\n    half = z * _math.sqrt(max(var, 0.0))\n    return (max(0.0, a - half), min(1.0, a + half))", "walk": [["Put a how-sure range on the ranking score itself", "so 0.72 versus 0.60 can be called a real gap, not noise"]]}]}], "plain": "Score any model's answers against the planted truth \u2014 and against the best score possible.", "steps": [["Grade answers cell by cell against the answer key", "no opinions: the truth was planted, so grading is exact"], ["Compare every score to the known ceiling", "a 0.72 means something different when the maximum possible is 0.82 \u2014 the ceiling keeps everyone honest"], ["Attach how-sure-are-we ranges to every number", "small samples get wide ranges; the instrument says 'not enough data to be sure' instead of pretending"]]}, {"id": "campaign", "stage": "verdict out", "note": "tiered trials -> DECISIVE\nor a prescription", "label": "Campaigns & Verdicts", "color": "#A02F44", "blurb": "A goal becomes a three-tier ladder with bars. Verdicts are three-way: DECISIVE when the interval clears the bar, INCONCLUSIVE with a prescription when it straddles. Trial history is append-only.", "modules": [{"file": "campaign.py", "name": "campaign", "blurb": "clean / predict / regress / extract ladders; blinded shifted-seed training; interval-aware judgment; the trials comparison table.", "components": [{"label": "The three-way judge", "symbol": "_judge", "file": "campaign.py", "blurb": "Point pass/fail gates the ladder (compat); every evidence line carries [ci lo-hi n: DECISIVE] or INCONCLUSIVE with n~X to resolve.", "code": "def _judge(conditions: List[str], resolver,\n           counts_resolver=None) -> TierResult:\n    \"\"\"Point-estimate pass/fail gates the ladder (compat), but\n    each evidence line carries the interval and a three-way\n    reading: DECISIVE when the whole CI sits on one side of the\n    bar, INCONCLUSIVE otherwise \u2014 with a PRESCRIPTION for how\n    much data would resolve it. Synthkit can generate that data,\n    so the prescription is executable.\"\"\"\n    from .mlmetrics import (auroc_interval, required_n,\n                            wilson_interval)\n    measured: Dict[str, float] = {}\n    failed: List[str] = []\n    lines: List[str] = []\n    for raw in conditions:\n        cond = Condition.parse(raw)\n        value = resolver(cond.metric)\n        measured[cond.metric] = round(value, 4)\n        line = cond.describe(value)\n        counts = (counts_resolver(cond.metric)\n                  if counts_resolver else None)\n        interval = None\n        n_label = \"\"\n        prescription = None\n        if isinstance(counts, tuple) and len(counts) == 2:\n            k, n = counts\n            if n > 0:\n                interval = wilson_interval(k, n)\n                n_label = \"n={}\".format(n)\n                prescription = required_n(value, cond.threshold)\n        elif isinstance(counts, tuple) and counts \\\n                and counts[0] == \"auroc\":\n            _tag, a, n_pos, n_neg = counts\n            if n_pos > 0 and n_neg > 0:\n                interval = auroc_interval(a, n_pos, n_neg)\n                n_label = \"n={}+/{}-\".format(n_pos, n_neg)\n        if interval is not None:\n            lo, hi = interval\n            bar = cond.threshold\n            decisive = hi < bar or lo > bar\n            note = \"DECISIVE\" if decisive else \"INCONCLUSIVE\"\n            extra = \"\"\n            if not decisive and prescription is not None:\n                extra = \"; n~{} to resolve\".format(prescription)\n            line += \"  [ci {:.3f}-{:.3f} {}: {}{}]\".format(\n                lo, hi, n_label, note, extra)\n        lines.append(line)\n        if not cond.holds(value):\n            failed.append(cond.metric)\n    return TierResult(tier=\"\", passed=not failed,\n                      measured=measured,\n                      failed_conditions=failed,\n                      evidence=\"\\n\".join(lines))", "walk": [["Turn a measured number into a verdict", "PASS, FAIL, or INCONCLUSIVE against the declared pass mark, using the how-sure range \u2014 never the bare number"]]}, {"label": "Blinded predict tiers", "symbol": "_run_predict_tier", "file": "campaign.py", "blurb": "Train on master_seed+1000, score the tier table: the solver never sees test labels or the answer key.", "code": "def _run_predict_tier(campaign, tier, solver, solver_name,\n                      offset) -> TierResult:\n    from .tableeval import (evaluate_prediction,\n                            resolve_prediction_metric)\n    from .tableplan import plan_table\n    spec = TableSpec.from_json(tier.spec_json)\n    train_spec = TableSpec.from_json(tier.spec_json)\n    train_spec.master_seed += offset\n    train_bp = plan_table(train_spec)\n    test_bp = plan_table(spec)\n    outcome = campaign.outcome\n    n_train = len(train_bp.clean_rows)\n    train_rows = [\n        {k: v for k, v in row.items() if k != outcome}\n        for row in train_bp.dirty_rows[:n_train]]\n    train_labels = [\n        1 if train_bp.clean_rows[r][outcome] == \"True\" else 0\n        for r in range(n_train)]\n    n_test = len(test_bp.clean_rows)\n    test_rows = [\n        {k: v for k, v in row.items() if k != outcome}\n        for row in test_bp.dirty_rows[:n_test]]\n    scores = solver(train_rows, train_labels, test_rows)\n    from .tableeval import resolve_prediction_counts\n    report = evaluate_prediction(test_bp, outcome, list(scores),\n                                 solver_name)\n    tr = _judge(tier.conditions,\n                lambda m: resolve_prediction_metric(report, m),\n                lambda m: resolve_prediction_counts(report, m))\n    tr.tier = tier.name\n    # The ceiling is always reported, condition or not \u2014 it is\n    # the number that gives every other number its meaning.\n    tr.measured[\"predict.auroc\"] = round(report.auroc, 4)\n    tr.measured[\"predict.ceiling_auroc\"] = round(\n        report.ceiling_auroc, 4)\n    tr.evidence += \"\\n\" + report.format_text()\n    return tr", "walk": [["Run one difficulty tier end to end", "generate that tier's population, train the contestant on a separate practice draw, score blind, judge"]]}, {"label": "Append-only trials", "symbol": "write_campaign", "file": "campaign.py", "blurb": "results/trial_NNN_<arm>.json \u2014 a live bake-off once clobbered its control arm; never again.", "code": "def write_campaign(run_dir, campaign: Campaign,\n                   result: Optional[CampaignResult] = None,\n                   result_name: str = \"\"):\n    \"\"\"Results are APPEND-ONLY study records: each run lands in\n    results/trial_NNN_<name>.json (a live bake-off clobbered its\n    control arm before this existed). result.json remains the\n    latest, for compatibility.\"\"\"\n    from pathlib import Path as _P\n    run_dir = _P(run_dir)\n    run_dir.mkdir(parents=True, exist_ok=True)\n    artifacts = {\n        \"campaign.json\": json.dumps({\n            \"goal\": campaign.goal,\n            \"title\": campaign.title,\n            \"outcome\": campaign.outcome,\n            \"tiers\": [{\"name\": t.name,\n                       \"spec\": json.loads(t.spec_json),\n                       \"conditions\": t.conditions,\n                       \"notes\": t.notes}\n                      for t in campaign.tiers],\n        }, indent=2),\n    }\n    if result is not None:\n        payload = json.dumps({\n            \"solver\": result_name or \"unnamed\",\n            \"highest_passed\": result.highest_passed,\n            \"tiers\": [{\"tier\": tr.tier, \"passed\": tr.passed,\n                       \"measured\": tr.measured,\n                       \"failed_conditions\": tr.failed_conditions,\n                       \"evidence\": tr.evidence}\n                      for tr in result.tier_results],\n            \"text\": result.format_text(),\n        }, indent=2)\n        artifacts[\"result.json\"] = payload\n        results_dir = run_dir / \"results\"\n        results_dir.mkdir(exist_ok=True)\n        n = len(list(results_dir.glob(\"trial_*.json\"))) + 1\n        safe = \"\".join(c if c.isalnum() or c in \"-_\" else \"-\"\n                       for c in (result_name or \"unnamed\"))[:40]\n        (results_dir / \"trial_{:03d}_{}.json\".format(\n            n, safe)).write_text(payload, encoding=\"utf-8\")\n    hashes = {}\n    for name, text in artifacts.items():\n        (run_dir / name).write_text(text, encoding=\"utf-8\")\n        hashes[name] = _sha(text)\n    (run_dir / \"manifest.json\").write_text(json.dumps({\n        \"synthkit_campaign_manifest\": 1,\n        \"hashes\": hashes,\n    }, indent=2), encoding=\"utf-8\")\n    return run_dir", "walk": [["File the exam and every result permanently", "append-only: trials accumulate, nothing is overwritten \u2014 the paper trail a meeting can stand on"]]}]}], "plain": "Run the same exam at three difficulty levels and return a verdict, not just a number.", "steps": [["Build one exam at three difficulties from the recipe", "gentler, exactly as specified, and adversarial \u2014 so a model can't pass by luck on one easy draw"], ["Train contestants on a separate practice population", "answers are hidden during the test; nobody studies the actual exam"], ["Judge each pass mark with statistical honesty", "verdicts are PASS, FAIL, or INCONCLUSIVE \u2014 and inconclusive comes with a prescription: how much more data would settle it"], ["File every result permanently", "append-only records, so every claim in a meeting traces to a file"]]}, {"id": "solvers", "stage": "take the test", "note": "baselines, cleaners, and\nany LLM in the vendor chair", "label": "Solvers & Vendors", "color": "#4C7A34", "blurb": "synthkit competes on its own data: mess-tolerant encoding, stdlib baselines, an honest reference cleaner \u2014 and any LLM in the vendor chair, blind-prompted and reliability-counted.", "modules": [{"file": "autosolver.py", "name": "autosolver", "blurb": "The floor every vendor must beat. Baseline within 0.011 of the 0.678 ceiling on the encounter cohort.", "components": [{"label": "FeatureEncoder", "symbol": "FeatureEncoder", "file": "autosolver.py", "blurb": "Sniffs numeric/date/bool/categorical THROUGH the mess from train rows; imputes to train means; standardizes; deterministic.", "code": "class FeatureEncoder:\n    \"\"\"Sniffs column types from TRAIN rows only; encodes any rows\n    into a fixed-width standardized feature vector. Deterministic;\n    ignores columns starting with underscore.\"\"\"\n\n    def __init__(self, max_categories: int = 8):\n        self.max_categories = max_categories\n        self.columns: List[_Column] = []\n\n    def fit(self, rows: List[Dict[str, str]]) -> \"FeatureEncoder\":\n        if not rows:\n            raise ValueError(\"cannot fit an encoder on zero rows\")\n        names = [k for k in rows[0] if not k.startswith(\"_\")]\n        for name in names:\n            raw = [str(r.get(name, \"\")) for r in rows]\n            present = [v for v in raw\n                       if v.strip().lower() not in _MISSING]\n            n = max(len(present), 1)\n            avg_len = sum(len(v) for v in present) / n\n            if avg_len > 40:\n                # free-text column: not a tabular feature. The\n                # tabular baseline stays text-blind by design \u2014\n                # mining these is the hybrid solver's job.\n                continue\n            nums = [_clean_number(v) for v in present]\n            dates = [_clean_date(v) for v in present]\n            bools = [_clean_bool(v) for v in present]\n            num_rate = sum(1 for v in nums if v is not None) / n\n            date_rate = sum(1 for v in dates if v is not None) / n\n            bool_rate = sum(1 for v in bools if v is not None) / n\n            if bool_rate > 0.9:\n                kind, vals = \"bool\", [v for v in bools\n                                      if v is not None]\n            elif date_rate > 0.6:\n                kind, vals = \"date\", [v for v in dates\n                                      if v is not None]\n            elif num_rate > 0.6:\n                kind, vals = \"numeric\", [v for v in nums\n                                         if v is not None]\n            else:\n                uniq = len(set(v.strip().lower()\n                               for v in present)) / n\n                if n >= 20 and uniq > 0.5:\n                    # identifier-like column (names, MRNs):\n                    # mostly-unique strings are memorization\n                    # bait, not features \u2014 live transparency\n                    # view caught \"patient_name = jules kim\"\n                    # wearing a risk weight.\n                    continue\n                counts: Dict[str, int] = {}\n                for v in present:\n                    key = v.strip().lower()\n                    counts[key] = counts.get(key, 0) + 1\n                cats = [c for c, _cnt in sorted(\n                    counts.items(),\n                    key=lambda kv: (-kv[1], kv[0]))][\n                        :self.max_categories]\n                self.columns.append(_Column(\n                    name=name, kind=\"categorical\",\n                    categories=cats))\n                continue\n            mean = sum(vals) / len(vals) if vals else 0.0\n            var = (sum((v - mean) ** 2 for v in vals) / len(vals)\n                   if vals else 0.0)\n            self.columns.append(_Column(\n                name=name, kind=kind, mean=mean,\n                std=math.sqrt(var) or 1.0))\n        return self\n\n    def encode(self, row: Dict[str, str]) -> List[float]:\n        out: List[float] = []\n        for col in self.columns:\n            raw = str(row.get(col.name, \"\"))\n            if col.kind == \"categorical\":\n                key = raw.strip().lower()\n                out.extend(1.0 if key == c else 0.0\n                           for c in col.categories)\n                continue\n            val = {\"numeric\": _clean_number,\n                   \"date\": _clean_date,\n                   \"bool\": _clean_bool}[col.kind](raw)\n            if val is None:\n                val = col.mean          # train-mean imputation\n            out.append((val - col.mean) / col.std)\n        return out", "walk": [["Recognize what each messy column really is", "numbers, dates, yes/nos, categories \u2014 through the typos and formats"], ["Refuse to use names and record numbers as evidence", "mostly-unique identifiers are memorization bait; one build caught 'patient_name = jules kim' wearing a risk weight"]]}, {"label": "autoclean", "symbol": "autoclean", "file": "autosolver.py", "blurb": "Fixes what heuristics honestly can (space, case, formats), flags exact dups, never guesses \u2014 overcorrection near zero.", "code": "def autoclean(rows: List[Dict[str, str]]\n              ) -> List[Dict[str, str]]:\n    \"\"\"Normalizes what heuristics can honestly normalize:\n    whitespace, casing (to each column's dominant convention),\n    date formats (to ISO), numeric formatting ($, thousands\n    separators, spaced decimals); flags exact duplicate rows.\n    Never guesses at missing or wrong values \u2014 that honesty keeps\n    its overcorrection near zero.\"\"\"\n    from datetime import datetime\n    if not rows:\n        return []\n    names = [k for k in rows[0] if not k.startswith(\"_\")]\n    case_mode: Dict[str, str] = {}\n    for name in names:\n        tally = {\"lower\": 0, \"upper\": 0, \"title\": 0}\n        for r in rows:\n            v = str(r.get(name, \"\")).strip()\n            if not v or _clean_number(v) is not None:\n                continue\n            if v == v.lower():\n                tally[\"lower\"] += 1\n            elif v == v.upper():\n                tally[\"upper\"] += 1\n            elif v == v.title():\n                tally[\"title\"] += 1\n        case_mode[name] = max(tally, key=lambda k: tally[k]) \\\n            if any(tally.values()) else \"none\"\n\n    out: List[Dict[str, str]] = []\n    seen: Dict[Tuple, int] = {}\n    for r in rows:\n        row: Dict[str, str] = {}\n        for name in names:\n            v = str(r.get(name, \"\")).strip()\n            if v.strip().lower() in _MISSING:\n                row[name] = v\n                continue\n            d = _clean_date(v)\n            if d is not None:\n                row[name] = datetime.fromordinal(\n                    int(d)).date().isoformat()\n                continue\n            num = _clean_number(v)\n            if num is not None:\n                row[name] = (\"{:.4f}\".format(num)\n                             .rstrip(\"0\").rstrip(\".\")\n                             if \".\" in repr(num) else str(num))\n                if num == int(num):\n                    row[name] = str(int(num))\n                continue\n            b = _clean_bool(v)\n            if b is not None and v.lower() not in (\"true\",\n                                                   \"false\"):\n                row[name] = \"True\" if b else \"False\"\n                continue\n            mode = case_mode.get(name, \"none\")\n            if mode == \"lower\":\n                row[name] = v.lower()\n            elif mode == \"upper\":\n                row[name] = v.upper()\n            elif mode == \"title\":\n                row[name] = v.title()\n            else:\n                row[name] = v\n        key = tuple(row[n] for n in names)\n        if key in seen:\n            row[\"_duplicate\"] = \"true\"\n        seen[key] = seen.get(key, 0) + 1\n        out.append(row)\n    return out", "walk": [["Fix only what can be fixed honestly", "spacing, casing, formats, exact duplicates \u2014 and never guess
