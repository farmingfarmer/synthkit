self, rows: List[Dict[str, Any]],\n              columns: Optional[List[str]] = None,\n              targets: Optional[List[str]] = None,\n              group_by: Optional[str] = None,\n              hypotheses: Optional[Dict[str, List[str]]] = None,\n              multilevel: bool = False,\n              epsilon: float = 0.0,\n              feature_sources: Optional[Dict[str, List[str]]] = None\n              ) -> \"CondNet\":\n        \"\"\"`hypotheses` maps a column to the columns allowed to\n        explain it \u2014 the clinical questions actually being asked.\n\n        Blind search tests every pair and pays a multiple-\n        comparison tax across hundreds of them; that tax is the\n        single largest drain on statistical power here. Naming a\n        dozen candidate relationships instead of asking the\n        machine to find everything collapses the correction and\n        buys roughly a doubling of effective sample size, measured.\n        Columns outside the hypotheses are still modelled from\n        their marginals, so generated data stays complete.\n\n        `multilevel` recognises that not every question costs the\n        same amount of data. Collapsing to the patient count is\n        right for a BETWEEN-person effect \u2014 \"do elderly patients\n        have more events?\" has as many independent observations as\n        there are patients. But \"when this patient's sodium drifts\n        from their own baseline, does their risk change?\" is a\n        WITHIN-person comparison: each patient serves as their own\n        control, so the degrees of freedom come from visits rather\n        than people. Treating both the same way discards most of\n        what a longitudinal dataset contains.\"\"\"\n        \"\"\"`targets` are placed LAST in the ordering so they can\n        condition on everything else. Without that hint an outcome\n        often lands first (it is the hub of the dependence graph)\n        and ends up with no parents, which throws away exactly the\n        structure a benchmark cares about.\"\"\"\n        cols = columns or list(rows[0].keys())\n        n = len(rows)\n        # The privacy and inference unit. Repeated encounters from\n        # one patient are not independent evidence: they neither\n        # earn k-anonymity nor carry n rows' worth of statistical\n        # weight.\n        self.group_by = group_by\n        if group_by:\n            self.groups = [str(r.get(group_by, i))\n                           for i, r in enumerate(rows)]\n            cols = [c for c in cols if c != group_by]\n        else:\n            self.groups = [str(i) for i in range(n)]\n        # Column names that are purely numeric or blank are almost\n        # always an artefact of a headerless index or a malformed\n        # export, not a clinical field. Modelling them produces\n        # nonsense like `column \"4\" is determined by column \"1\"`.\n        odd = [c for c in cols\n               if not str(c).strip()\n               or str(c).strip().replace(\".\", \"\", 1).isdigit()]\n        if odd:\n            cols = [c for c in cols if c not in odd]\n        self.dropped_odd_names = odd\n\n        # ---- list columns: expand, never bin ----\n        # A medication or condition list is different for almost\n        # every visit, so treating the whole string as a category\n        # sends every value below the k-patient floor and collapses\n        # the column to a single bucket. Observed live: `conditions`\n        # and `active_drugs` each reduced to ONE level, contributing\n        # nothing but their missingness \u2014 which is how the clinical\n        # content of a record becomes invisible to the model.\n        #\n        # The information is in the ITEMS, not the combination. Each\n        # frequent item becomes its own present/absent indicator, so\n        # \"this patient is on a diuretic\" can carry structure while\n        # the rare combinations that would identify someone never\n        # appear.\n        self.list_columns = {}\n        self.list_lengths = {}\n        self.tally_of = {}\n        expanded_rows = [dict(r) for r in rows]\n        for c in list(cols):\n            vals = [str(r.get(c, \"\")) for r in rows]\n            if not any(LIST_SEP in v for v in vals):\n                continue\n            def _items(v):\n                # placeholders for \"nothing here\" are absence, not\n                # a finding \u2014 expanding them creates an indicator\n                # that simply mirrors the empty case\n                return {x.strip() for x in v.split(LIST_SEP)\n                        if x.strip()\n                        and x.strip().lower() not in\n                        (\"none\", \"nan\", \"null\", \"n/a\", \"-\")}\n    # ... (1338 more lines in condnet.py) ...", "walk": [["Treat the patient as the unit, not the visit", "repeated visits from one person are neither ten people's worth of protection nor ten people's worth of evidence"], ["Exclude patient identity from the model entirely", "without this the model learned to condition on WHO the patient was, which is memorisation with extra steps"], ["Ask the cheaper question where the data allows it", "'when this patient's own reading drifts, does their risk change' is answered by their visits; 'do these patients differ from those' is answered only by the patient count"]]}, {"label": "Calibrating a patient's steadiness", "symbol": "CondNet.calibrate_persistence", "file": "condnet.py", "blurb": "The transition tables and the within-bin anchor both make a patient look steady, and they do not combine in any closed form worth deriving. Applying both at full strength produced synthetic patients STEADIER than real ones \u2014 0.87 against a source of 0.78 \u2014 which would flatter every model tested on them. The anchor weights are tuned against the source instead.", "code": "    def calibrate_persistence(self, trials: int = 4,\n                              patients: int = 150) -> None:\n        \"\"\"Tune each column's anchor weight until generated data\n        is as steady as the source, no more and no less.\n\n        Overshooting matters as much as undershooting: synthetic\n        patients that hold their values more tightly than real\n        ones would make any model that groups by patient look\n        better behaved than it will be in practice.\n        \"\"\"\n        if not getattr(self, \"target_autocorr\", None):\n            return\n        # All columns at once. Each column's anchor is independent\n        # of the others, so one generated sample per trial serves\n        # every column \u2014 calibrating them one at a time meant a\n        # full generation per column per trial, which took four\n        # minutes on a 72-column extract and would only get worse.\n        cols = [c for c in self.target_autocorr\n                if c in self.persistence]\n        if not cols:\n            return\n        bounds = {c: [0.0, 0.95] for c in cols}\n        for _ in range(trials):\n            for c in cols:\n                self.persistence[c] = sum(bounds[c]) / 2.0\n            sample = self.sample_patients(patients, seed=99)\n            for c in cols:\n                got = self._measure_autocorr(sample, c)\n                if got is None:\n                    continue\n                mid = sum(bounds[c]) / 2.0\n                if got < self.target_autocorr[c]:\n                    bounds[c][0] = mid\n                else:\n                    bounds[c][1] = mid\n        for c in cols:\n            self.persistence[c] = round(sum(bounds[c]) / 2.0, 3)\n        self.report[\"persistence_calibrated\"] = {\n            c: self.persistence.get(c)\n            for c in self.target_autocorr}\n        self.report[\"persistence_targets\"] = {\n            c: round(v, 3) for c, v in\n            self.target_autocorr.items()}", "walk": [["Measure how steady the real patients actually are", "and treat that as the target rather than something to be derived from theory"], ["Tune until the invented patients match it", "two separate mechanisms both make a patient look steady, and guessing how they add up produced people who held their readings more tightly than any real patient does"], ["Treat overshooting as a failure too", "synthetic patients steadier than real ones would make every model tested on them look better than it will be in practice"]]}, {"label": "Saying when the visit histories came out flat", "symbol": "CondNet.temporal_check", "file": "condnet.py", "blurb": "A privacy budget can erase temporal structure entirely while generation still reports patients and visit numbers. Someone would then hold data that LOOKS longitudinal and behaves like independent rows \u2014 a worse position than knowing you have loose rows, because nothing in the output says so.", "code": "    def temporal_check(self, rows) -> Dict[str, Any]:\n        \"\"\"Did the visit sequences actually come out with the\n        steadiness the source had?\n\n        A privacy budget can erase temporal structure entirely\n        while generation still reports patients and visit numbers.\n        Someone would then hold data that LOOKS longitudinal and\n        behaves like independent rows \u2014 a worse position than\n        knowing they have loose rows, because nothing about the\n        output says so.\n        \"\"\"\n        lost, kept = [], []\n        for col, target in getattr(self,\n                                   \"target_autocorr\", {}).items():\n            if abs(target) < 0.2:\n                continue\n            got = self._measure_autocorr(rows, col)\n            if got is None:\n                continue\n            (kept if abs(got) >= 0.4 * abs(target)\n             else lost).append(\n                {\"column\": col, \"source\": round(target, 3),\n                 \"generated\": round(got, 3)})\n        out = {\"reproduced\": kept, \"lost\": lost}\n        if lost:\n            out[\"warning\"] = (\n                \"The visit-to-visit steadiness the source had was \"\n                \"largely erased for: {}. These records carry a \"\n                \"patient and a visit number but behave like \"\n                \"independent rows. If a privacy budget is set, \"\n                \"this is its cost \u2014 raise epsilon or generate \"\n                \"without one when the analysis depends on \"\n                \"patients having a course.\".format(\n                    \", \".join(x[\"column\"] for x in lost)))\n        return out", "walk": [["Check the visit histories actually came out with a course", "a privacy budget can flatten them completely while the output still shows a patient and a visit number"], ["Say so plainly when they did not", "holding data that looks longitudinal and behaves like loose rows is worse than knowing you have loose rows, because nothing about it announces the problem"]]}, {"label": "The amplify dial", "symbol": "CondNet.amplify", "file": "condnet.py", "blurb": "A geometric tilt of each conditional toward or away from its marginal. Factor 0 deletes a discovered relationship, 1 leaves it, 2 sharpens it \u2014 the strength changes while the SHAPE is preserved, which is what makes a found pattern testable at difficulties the source never had.", "code": "    def amplify(self, child: str, factor: float) -> \"CondNet\":\n        \"\"\"Strengthen (>1) or weaken (<1) every dependence feeding\n        `child`. factor=0 removes it entirely (child becomes\n        independent of its parents); factor=1 leaves it unchanged.\n        Marginals are preserved as closely as the tilt allows.\"\"\"\n        marg = self.marginal[child]\n        for cfg, dist in self.cpt[child].items():\n            new = {}\n            for s, p in dist.items():\n                m = max(marg.get(s, 1e-9), 1e-9)\n                new[s] = m * ((p / m) ** factor)\n            z = sum(new.values()) or 1.0\n            self.cpt[child][cfg] = {s: v / z\n                                    for s, v in new.items()}\n        return self", "walk": [["Make any discovered pattern stronger, weaker, or absent", "turn it off entirely and see whether a vendor still claims to find it; double it and see whether they catch it"], ["Change the strength without changing the shape", "an amplified U-curve stays a U-curve with deeper troughs, so the test gets harder in the way you intended"]]}, {"label": "Person-aware learning", "symbol": "CondNet.learn", "file": "condnet.py", "blurb": "The privacy and inference unit is the patient. k counts people, significance uses the person count, and the identity column is excluded \u2014 without which the model conditioned on patient identity itself, which is memorisation wearing a graph.", "code": "    def learn(self, rows: List[Dict[str, Any]],\n              columns: Optional[List[str]] = None,\n              targets: Optional[List[str]] = None,\n              group_by: Optional[str] = None,\n              hypotheses: Optional[Dict[str, List[str]]] = None,\n              multilevel: bool = False,\n              epsilon: float = 0.0,\n              feature_sources: Optional[Dict[str, List[str]]] = None\n              ) -> \"CondNet\":\n        \"\"\"`hypotheses` maps a column to the columns allowed to\n        explain it \u2014 the clinical questions actually being asked.\n\n        Blind search tests every pair and pays a multiple-\n        comparison tax across hundreds of them; that tax is the\n        single largest drain on statistical power here. Naming a\n        dozen candidate relationships instead of asking the\n        machine to find everything collapses the correction and\n        buys roughly a doubling of effective sample size, measured.\n        Columns outside the hypotheses are still modelled from\n        their marginals, so generated data stays complete.\n\n        `multilevel` recognises that not every question costs the\n        same amount of data. Collapsing to the patient count is\n        right for a BETWEEN-person effect \u2014 \"do elderly patients\n        have more events?\" has as many independent observations as\n        there are patients. But \"when this patient's sodium drifts\n        from their own baseline, does their risk change?\" is a\n        WITHIN-person comparison: each patient serves as their own\n        control, so the degrees of freedom come from visits rather\n        than people. Treating both the same way discards most of\n        what a longitudinal dataset contains.\"\"\"\n        \"\"\"`targets` are placed LAST in the ordering so they can\n        condition on everything else. Without that hint an outcome\n        often lands first (it is the hub of the dependence graph)\n        and ends up with no parents, which throws away exactly the\n        structure a benchmark cares about.\"\"\"\n        cols = columns or list(rows[0].keys())\n        n = len(rows)\n        # The privacy and inference unit. Repeated encounters from\n        # one patient are not independent evidence: they neither\n        # earn k-anonymity nor carry n rows' worth of statistical\n        # weight.\n        self.group_by = group_by\n        if group_by:\n            self.groups = [str(r.get(group_by, i))\n                           for i, r in enumerate(rows)]\n            cols = [c for c in cols if c != group_by]\n        else:\n            self.groups = [str(i) for i in range(n)]\n        # Column names that are purely numeric or blank are almost\n        # always an artefact of a headerless index or a malformed\n        # export, not a clinical field. Modelling them produces\n        # nonsense like `column \"4\" is determined by column \"1\"`.\n        odd = [c for c in cols\n               if not str(c).strip()\n               or str(c).strip().replace(\".\", \"\", 1).isdigit()]\n        if odd:\n            cols = [c for c in cols if c not in odd]\n        self.dropped_odd_names = odd\n\n        # ---- list columns: expand, never bin ----\n        # A medication or condition list is different for almost\n        # every visit, so treating the whole string as a category\n        # sends every value below the k-patient floor and collapses\n        # the column to a single bucket. Observed live: `conditions`\n        # and `active_drugs` each reduced to ONE level, contributing\n        # nothing but their missingness \u2014 which is how the clinical\n        # content of a record becomes invisible to the model.\n        #\n        # The information is in the ITEMS, not the combination. Each\n        # frequent item becomes its own present/absent indicator, so\n        # \"this patient is on a diuretic\" can carry structure while\n        # the rare combinations that would identify someone never\n        # appear.\n        self.list_columns = {}\n        self.list_lengths = {}\n        self.tally_of = {}\n        expanded_rows = [dict(r) for r in rows]\n        for c in list(cols):\n            vals = [str(r.get(c, \"\")) for r in rows]\n            if not any(LIST_SEP in v for v in vals):\n                continue\n            def _items(v):\n                # placeholders for \"nothing here\" are absence, not\n                # a finding \u2014 expanding them creates an indicator\n                # that simply mirrors the empty case\n                return {x.strip() for x in v.split(LIST_SEP)\n                        if x.strip()\n                        and x.strip().lower() not in\n                        (\"none\", \"nan\", \"null\", \"n/a\", \"-\")}\n    # ... (1338 more lines in condnet.py) ...", "walk": [["Treat the patient as the unit, not the visit", "repeated visits from one person are neither ten people's worth of protection nor ten people's worth of evidence"], ["Exclude patient identity from the model entirely", "without this the model learned to condition on WHO the patient was, which is memorisation with extra steps"], ["Ask the cheaper question where the data allows it", "'when this patient's own reading drifts, does their risk change' is answered by their visits; 'do these patients differ from those' is answered only by the patient count"]]}]}, {"file": "../scripts/fidelity_report.py", "name": "scorecard", "blurb": "Does the synthetic data carry the same patterns, and does it avoid reproducing the people? Both halves validated against deliberate failures.", "components": [{"label": "Fidelity and privacy scored together", "symbol": "main", "file": "../scripts/fidelity_report.py", "blurb": "Marginals, missingness, correlations, the SHAPE of each dependence and the interactions \u2014 with tolerances derived from the sampling distribution rather than fixed thresholds. Relationships that are only noise in the source are skipped, because reproducing randomness is not fidelity.", "code": "def main() -> None:\n    ap = argparse.ArgumentParser()\n    ap.add_argument(\"--source\", required=True)\n    ap.add_argument(\"--synthetic\", required=True)\n    ap.add_argument(\"--profile\", default=\"\")\n    ap.add_argument(\"-o\", \"--out\", default=\"fidelity_report.json\")\n    ap.add_argument(\"--nn-sample\", type=int, default=400)\n    ap.add_argument(\"--group-by\", default=\"\",\n                    help=\"column identifying the PATIENT. \"\n                         \"Repeated visits from one person are not \"\n                         \"independent draws, so tolerances are \"\n                         \"computed from the number of people \"\n                         \"rather than the number of rows.\")\n    ap.add_argument(\"--target\", default=\"\",\n                    help=\"outcome column: interactions affecting \"\n                         \"it are tested explicitly\")\n    ap.add_argument(\"--deep-bins\", type=int, default=4)\n    ap.add_argument(\"--max-pairs\", type=int, default=400)\n    ap.add_argument(\"--report\", action=\"store_true\")\n    a = ap.parse_args()\n\n    S, G = read(a.source), read(a.synthetic)\n    if not S or not G:\n        sys.exit(\"empty input\")\n    shared = [c for c in S[0] if c in G[0]\n              if c != a.group_by]\n\n    # Effective sample size. Repeated visits from one patient are\n    # not independent draws, so a tolerance derived from the row\n    # count would fail honest data for having exactly the\n    # clustered structure it was asked to reproduce.\n    def _eff(rowset):\n        if not a.group_by or not rowset \\\n                or a.group_by not in rowset[0]:\n            return len(rowset)\n        return max(len({r.get(a.group_by) for r in rowset}), 1)\n\n    eff_s, eff_g = _eff(S), _eff(G)\n\n    numcols, catcols = [], []\n    for c in shared:\n        vals = [num(r.get(c)) for r in S\n                if not is_missing(r.get(c))]\n        vals = [v for v in vals if v is not None]\n        present = sum(1 for r in S if not is_missing(r.get(c)))\n        if present and len(vals) / present > 0.9:\n            numcols.append(c)\n        elif present:\n            catcols.append(c)\n\n    marg, fails = [], 0\n    for c in numcols:\n        xs = [num(r.get(c)) for r in S]\n        ys = [num(r.get(c)) for r in G]\n        xs = [x for x in xs if x is not None]\n        ys = [y for y in ys if y is not None]\n        d = ks_distance(xs, ys)\n        tol = ks_tolerance(\n            max(int(len(xs) * eff_s / max(len(S), 1)), 2),\n            max(int(len(ys) * eff_g / max(len(G), 1)), 2))\n        ok = d <= tol\n        fails += 0 if ok else 1\n        marg.append({\"column\": c, \"type\": \"numeric\", \"metric\": \"KS\",\n                     \"value\": round(d, 4),\n                     \"tolerance\": round(tol, 4),\n                     \"pass\": ok,\n                     \"source_mean\": round(mean(xs), 3),\n                     \"synth_mean\": round(mean(ys), 3),\n                     \"source_sd\": round(sd(xs), 3),\n                     \"synth_sd\": round(sd(ys), 3)})\n    for c in catcols:\n        xs = [(r.get(c) or \"\").strip() for r in S\n              if not is_missing(r.get(c))]\n        ys = [(r.get(c) or \"\").strip() for r in G\n              if not is_missing(r.get(c))]\n\n        # A LIST column cannot match as a whole string, and should\n        # not. Its combinations are near-unique per visit, and only\n        # items shared by enough patients are ever published \u2014 the\n        # rare ones are dropped deliberately, because a\n        # combination unique to one person identifies them. Judging\n        # such a column on whole-string agreement reports a\n        # failure for the privacy rule doing its job, and a\n        # scorecard that cries wolf teaches people to ignore it.\n        #\n        # The meaningful comparison is at the ITEM level: does each\n        # item appear at about the right rate?\n        listish = (sum(1 for v in xs[:400] if LIST_SEP in v)\n                   > 0.15 * max(len(xs[:400]), 1))\n        if listish:\n    # ... (474 more lines in fidelity_report.py) ...", "walk": [["Compare every column's shape, source against synthetic", "and set the bar by how much two samples of the same size would differ by chance, rather than by a made-up threshold"], ["Check that the RELATIONSHIPS survived, not just the columns", "data can match on every field individually and have lost every connection between them"], ["Skip anything the source itself cannot confirm", "asking synthetic data to reproduce noise is a coin flip counted as a failure"]]}, {"label": "The nearest-neighbour privacy test", "symbol": "nn_distances", "file": "../scripts/fidelity_report.py", "blurb": "Synthetic records must sit no closer to real records than real records sit to each other. Catches the interpolation failure mode \u2014 near-copies with zero exact matches \u2014 which an exact-match test alone would pass.", "code": "def nn_distances(A, B, numcols, catcols, stats, sample, seed=5):\n    \"\"\"Distance from each row of A to its nearest row in B.\"\"\"\n    rng = random.Random(seed)\n    a = A if len(A) <= sample else rng.sample(A, sample)\n    b = B if len(B) <= sample else rng.sample(B, sample)\n    out = []\n    for ra in a:\n        best = None\n        for rb in b:\n            tot = 0.0\n            dims = 0\n            for c in numcols:\n                x, y = num(ra.get(c)), num(rb.get(c))\n                if x is None or y is None:\n                    continue\n                s = stats[c] or 1.0\n                tot += ((x - y) / s) ** 2\n                dims += 1\n            for c in catcols:\n                x = (ra.get(c) or \"\").strip()\n                y = (rb.get(c) or \"\").strip()\n                if not x and not y:\n                    continue\n                tot += 0.0 if x == y else 1.0\n                dims += 1\n            if dims == 0:\n                continue\n            d = math.sqrt(tot / dims)\n            if best is None or d < best:\n                best = d\n                if best == 0.0:\n                    break\n        if best is not None:\n            out.append(best)\n    return out", "walk": [["Measure how close each invented record sits to a real one", "and compare that against how close real records already sit to each other"], ["Fail when the invented records hug real people", "which catches methods that blend real patients together \u2014 they produce no exact copies and still leak"]]}]}, {"file": "../scripts/power_sweep.py", "name": "power curve", "blurb": "How many patients does each kind of structure need? Measured against planted truth, because with real data you never know the answer.", "components": [{"label": "Patients needed, per structure type", "symbol": "main", "file": "../scripts/power_sweep.py", "blurb": "Plants a monotone relationship, a U-shape, a threshold and two interactions, then measures recovery across cohort sizes. Turns 'we need more data' into a specification: nonlinear structure at ~800 patients, interactions at ~3,200 \u2014 and zero false positives at every size.", "code": "def main() -> None:\n    ap = argparse.ArgumentParser()\n    ap.add_argument(\"--sizes\",\n                    default=\"100,200,400,800,1600,3200\")\n    ap.add_argument(\"--seeds\", type=int, default=3)\n    ap.add_argument(\"--visits\", type=int, default=4)\n    ap.add_argument(\"--k\", type=int, default=10)\n    ap.add_argument(\"--max-parents\", type=int, default=3)\n    ap.add_argument(\"-o\", \"--out\", default=\"power_sweep.json\")\n    ap.add_argument(\"--multilevel\", action=\"store_true\",\n                    help=\"test within-person relationships on the \"\n                         \"degrees of freedom a within-person \"\n                         \"comparison actually has, instead of \"\n                         \"collapsing everything to the patient \"\n                         \"count\")\n    ap.add_argument(\"--focused\", action=\"store_true\",\n                    help=\"declare the candidate relationships \"\n                         \"instead of searching blindly, so the \"\n                         \"multiple-comparison correction covers \"\n                         \"only the questions actually asked\")\n    ap.add_argument(\"--report\", action=\"store_true\")\n    a = ap.parse_args()\n    sizes = [int(s) for s in a.sizes.split(\",\")]\n\n    results = []\n    for n in sizes:\n        runs = [run_once(n, a.visits, 1000 + s, a.k, a.max_parents,\n                         a.focused, a.multilevel)\n                for s in range(a.seeds)]\n        agg = {\"patients\": n,\n               \"rows\": int(statistics.mean(\n                   x[\"rows\"] for x in runs)),\n               \"bins\": statistics.mode([x[\"bins\"] for x in runs]),\n               \"corrections\": runs[0][\"corrections\"],\n               \"edges\": round(statistics.mean(\n                   x[\"edges\"] for x in runs), 1),\n               \"false_positives\": round(statistics.mean(\n                   x[\"false_positives\"] for x in runs), 2),\n               \"recovery\": {}, \"partial\": {}}\n        for label, _, _ in TRUTH:\n            agg[\"recovery\"][label] = round(\n                sum(1 for x in runs if x[\"recovered\"][label])\n                / len(runs), 3)\n            agg[\"partial\"][label] = round(statistics.mean(\n                x[\"partial\"][label] for x in runs), 3)\n        results.append(agg)\n        print(\"  {:>6} patients ({:>6} rows) done\".format(\n            n, agg[\"rows\"]), flush=True)\n\n    # the headline: patients needed for reliable recovery\n    needed, half = {}, {}\n    for label, _, _ in TRUTH:\n        hit = [r[\"patients\"] for r in results\n               if r[\"recovery\"][label] >= 0.99]\n        needed[label] = hit[0] if hit else None\n        # The 50% point is the standard power-curve statistic and\n        # far less jumpy than \"recovered in every single run\",\n        # which a handful of seeds cannot estimate stably.\n        h = [r[\"patients\"] for r in results\n             if r[\"recovery\"][label] >= 0.5]\n        half[label] = h[0] if h else None\n\n    payload = {\"config\": {\"search\": (\"targeted\" if a.focused\n                                     else \"blind\"),\n                          \"levels\": (\"multilevel\" if a.multilevel\n                                     else \"single-level\"),\n                          \"sizes\": sizes, \"seeds\": a.seeds,\n                          \"visits_per_patient\": a.visits,\n                          \"k\": a.k,\n                          \"max_parents\": a.max_parents},\n               \"results\": results,\n               \"patients_needed\": needed,\n               \"patients_for_half_recovery\": half,\n               \"caveat\": \"the ordering reflects EFFECT SIZE as \"\n                         \"well as complexity: a large three-way \"\n                         \"jump can be easier to detect than a \"\n                         \"graded two-way one. Read these as \"\n                         \"figures for structures of this \"\n                         \"strength, not as universal constants.\",\n               \"reading\": \"recovery = the fraction of runs in \"\n                          \"which the planted relationship was \"\n                          \"found. Sample sizes count PATIENTS; \"\n                          \"repeated visits from one person are \"\n                          \"not independent evidence.\"}\n    Path(a.out).write_text(json.dumps(payload, indent=1),\n                           encoding=\"utf-8\")\n    print(\"\\nWROTE {}\".format(a.out))\n\n    if a.report:\n        print(\"\\n\" + \"=\" * 72)\n    # ... (41 more lines in power_sweep.py) ...", "walk": [["Plant relationships of known kinds and known strengths", "a straight one, one that reverses, one with a cut-point, and two that only appear in combination"], ["Grow the cohort until each is reliably recovered", "which converts 'we need more data' into a number per kind of pattern"], ["Count how often pure noise is mistaken for a finding", "an instrument that finds structure everywhere is worthless; this one found none at any size"]]}]}], "plain": "Learn what an existing extract looks like, and hand back a recipe someone can edit.", "steps": [["Collapse the hospital's tables into one row per visit", "keys arrive in mixed formats, facts live in six places, and labs arrive one row per test \u2014 all of which has to be reconciled before anything can be measured"], ["Measure the patterns as numbers, never as records", "distributions, how often values go missing, how often they are implausible, and how the fields move together \u2014 every figure covering at least ten patients"], ["Learn the relationships that are actually there", "including the ones a correlation cannot see: a lab that is dangerous at BOTH extremes, or a drug that only matters in the elderly"], ["Refuse to learn the ones that are not", "with hundreds of possible pairings, some always look convincing by chance; those are reported and never imposed"], ["Hand back a recipe where every number is a dial", "so a person can keep the shape of the real data and make any pattern in it stronger, weaker, or absent"], ["Say how many patients each kind of pattern needs", "measured against data where the answer is known \u2014 which is the only honest way to say whether a dataset is big enough"]]}, {"id": "fitted", "stage": "learn, then draw", "note": "a real extract becomes a\nk-anonymous contract, then data", "label": "The Fitted Path (synthkit fit)", "color": "#0E7C61", "blurb": "The current engine: discover what explains each column, publish a k-anonymous blueprint, generate to it. Every number below was measured, most of them on a real 800-patient extract. Core rule throughout: learn the patterns, never copy the records.", "modules": [{"file": "discover.py", "name": "discover - what explains each column", "blurb": "Out-of-sample confirmation, split BY PATIENT - a row-wise holdout leaks the same person into both halves and confirms nearly anything.", "components": [{"label": "Typed frame, sets expanded", "symbol": "prepare", "file": "discover.py", "blurb": "Numerics as floats, dates as days, categories capped; a SET column becomes one indicator per token plus its size, placed BESIDE its source column - moving them to the end changed which relationships a real extract found. An empty set encodes as a level: present-and-empty is a state, not a spelling of missing.", "code": "def prepare(df: pd.DataFrame,\n            group_by: Optional[str] = None,\n            drop_identifiers: bool = True,\n            ordinals: Optional[Dict[str, Any]] = None,\n            k: int = 10,\n            expand_by: Optional[str] = None):\n    \"\"\"Typed frame: numerics as float with NaN, DATES as days since\n    DATE_ORIGIN, everything else as a capped category. Blanks become\n    NaN rather than a level, so `missing` is one concept and not three\n    spellings of it.\n\n    Returns (frame, identifiers, dates, quantities, sets). FIVE, not\n    four: a caller that has not been updated raises immediately, which\n    is the same reason there were three and then four. A set column\n    silently left unexpanded is a relationship quietly lost, and this\n    file already records what that costs.\n\n    `dates` maps each column that\n    was read as a date to the format it was read under, which is what\n    lets generation write it back as a date instead of as an ordinal\n    float. THREE return values rather than two so a caller that has\n    not been updated raises immediately: a date silently left as a\n    number in the output file is exactly the kind of silent no-op this\n    frame is supposed to make impossible.\n\n    Built with a single concat. Assigning column by column leaves the\n    frame fragmented and every later `.loc` pays for it.\"\"\"\n    cols, ident, dates, quantities, sets = {}, [], {}, {}, {}\n    pending_sets = []\n    expand_by = (_sets.EXPAND_BY if expand_by is None\n                 else str(expand_by).lower())\n    if expand_by not in (\"frequency\", \"signal\"):\n        raise ValueError(\n            \"expand_by must be 'frequency' or 'signal', not \"\n            \"{!r} - an unrecognised value would silently fall back \"\n            \"to whichever branch happened to be first\".format(\n                expand_by))\n\n    # A REAL COLUMN THAT LOOKS LIKE SCAFFOLDING IS A SILENT DROP.\n    # `source_of` folds `foo__has__bar` into `foo`, and the blueprint\n    # skips anything whose source is not itself - so a column\n    # genuinely named that way would vanish from the output with every\n    # check green. Reported, never risked.\n    bad = _sets.collisions(df.columns)\n    if bad:\n        raise ValueError(\n            \"these column names collide with set-indicator \"\n            \"scaffolding and would be silently dropped: {}. Rename \"\n            \"them, or run with a copy that does.\".format(\n                \", \".join(sorted(bad))))\n\n    gv = (df[group_by].astype(str).to_numpy()\n          if group_by and group_by in df.columns\n          else np.arange(len(df)))\n    for c in df.columns:\n        if c == group_by:\n            continue\n        s = df[c]\n        if pd.api.types.is_datetime64_any_dtype(s):\n            # already typed by the reader; no text to parse\n            cols[c] = from_datetime(s)\n            dates[c] = {\"format\": \"%Y-%m-%d\",\n                        \"parsed_format\": \"%Y-%m-%d\",\n                        \"origin\": DATE_ORIGIN,\n                        \"floored_to_day\": True,\n                        \"unparsed_share\": 0.0,\n                        \"ambiguous\": False, \"alternatives\": []}\n            if drop_identifiers and _is_identifier(cols[c], len(df)):\n                ident.append(c)\n                del cols[c]\n                del dates[c]\n            continue\n        if s.dtype == object:\n            s = s.astype(str).str.strip()\n            s = s.mask(s.str.lower().isin(\n                [\"\", \"nan\", \"none\", \"null\", \"na\", \"n/a\"]))\n        # A DECLARED ORDER WINS OVER EVERY TEST BELOW. The operator\n        # said what the order is; nothing here is entitled to a second\n        # opinion, and no test on the strings could form one anyway.\n        if ordinals and c in ordinals:\n            q = ordinal_spec(ordinals[c], s)\n            cols[c] = to_number(s, q)\n            quantities[c] = q\n        elif _is_numeric(s):\n            cols[c] = pd.to_numeric(s, errors=\"coerce\").astype(float)\n        else:\n            d = date_kind(s)\n            q = quantity_kind(s) if d is None else None\n            if d is not None:\n                cols[c] = to_ordinal(s, d[\"parsed_format\"])\n    # ... (169 more lines in discover.py) ...", "walk": [["Type every column before anything expensive", "numbers, dates, categories, and set columns - a column read as the wrong type is the most expensive silent fault this tool has had"], ["Expand each medication-list-like column into indicators", "so a single drug can explain a lab value, not just the whole combination string"], ["Keep an empty list distinct from a missing one", "a visit with no procedures is a fact; a blank cell is an unknown - folding them together once invented procedures for four fifths of visits"]]}, {"label": "Claims confirmed on held-out people", "symbol": "discover", "file": "discover.py", "blurb": "Screen, fit, confirm on patients the model never saw. Returns claims with skill, importances and effect curves - 12/13 planted relationships found on the tidy fixture, 0 noise edges.", "code": "def discover(df: pd.DataFrame,\n             group_by: Optional[str] = None,\n             targets: Optional[List[str]] = None,\n             holdout_frac: float = 0.3,\n             seed: int = 20260731,\n             min_skill: float = 0.02,\n             screen_top: int = 15,\n             n_repeats: int = 4,\n             max_iter: int = 60,\n             max_train_rows: int = 12000,\n             min_coverage: float = 0.05,\n             max_classes: int = 50,\n             min_importance: float = 0.002,\n             deterministic_at: float = 0.97,\n             with_shapes: bool = True,\n             shape_top: int = 3,\n             interaction_ratio: float = 1.5,\n             progress=None,\n             ordinals: Optional[Dict[str, Any]] = None,\n             expand_by: Optional[str] = None\n             ) -> Dict[str, Any]:\n    \"\"\"A catalogue of what explains each column, confirmed out of\n    sample. Returns claims, not edges - no direction is implied beyond\n    'these predict that'.\"\"\"\n    rng = np.random.RandomState(seed)\n    X_all, identifiers, dates, _q, _sets_found = prepare(\n        df, group_by, ordinals=ordinals, expand_by=expand_by)\n\n    # Split BY PATIENT. Visits from one person are not independent, so\n    # a row-wise holdout leaks the same patient into both halves and\n    # confirms nearly anything - the single most expensive lesson the\n    # old engine learned.\n    if group_by is not None and group_by in df.columns:\n        groups = df[group_by].astype(str).to_numpy()\n        uniq = np.unique(groups)\n        rng.shuffle(uniq)\n        n_hold = max(1, int(len(uniq) * holdout_frac))\n        held = set(uniq[:n_hold].tolist())\n        is_hold = np.array([g in held for g in groups])\n        n_tr_g, n_te_g = len(uniq) - n_hold, n_hold\n    else:\n        is_hold = rng.rand(len(df)) < holdout_frac\n        n_tr_g, n_te_g = int((~is_hold).sum()), int(is_hold.sum())\n\n    cols = list(X_all.columns)\n\n    # THE RAW COMBINATION STRING IS DROPPED FROM THE SEARCH, both as a\n    # feature and as a target, and its indicators stand in for it.\n    #\n    # As a FEATURE it determines every one of its own indicators\n    # exactly, so permuting `conditions__has__t03` leaves the model\n    # free to read t03 straight back out of `conditions` and the\n    # importance comes back near zero. That is the lag leak again -\n    # `planted_simpson_x` correlating 0.924 with its own `__prev`,\n    # recall 0% while skill read 0.994 - and the answer there was to\n    # stop the two carrying each other.\n    #\n    # As a TARGET it is a 201-level category that is 49.5% sentinel on\n    # a fixture and 69% on the real extract; \"what explains this\n    # combination string\" is not a question anyone asked. The\n    # indicators are the targets now, which is also how a token comes\n    # to be explained by its neighbours.\n    #\n    # It stays in the frame: the blueprint builds the list marginal\n    # from it, and generation still emits the column itself.\n    set_sources = set(_sets_found)\n\n    # An engineered feature is scaffolding, never a target. Modelling\n    # one asks \"what explains last visit's age\" and answers \"this\n    # visit's age\" - arithmetic dressed as a finding, and it topped\n    # the catalogue by skill on the first run that worked.\n    want = [c for c in (targets or cols)\n            if c in cols and (targets is not None or _source(c) == c)\n            and c not in set_sources]\n\n    # AN IDENTITY PARTNER IS A TWIN, AND A TWIN BLINDS THE SEARCH.\n    # `procedure_count == procedure_quantity` holds on every source\n    # row, so quantity explains count at skill ~1.0 and NO external\n    # column can ever earn conditional importance in count's claims -\n    # permuting visit_type loses nothing while the twin still carries\n    # the signal, which is the lag-twin failure this module already\n    # documents, produced by the data instead of by engineering. The\n    # identity cluster becomes an island: perfectly connected inside,\n    # connected to the rest of the table by nothing, and every\n    # mediated association through it dies in generation\n    # (span_days 0.27 -> -0.003, visit_type -> sizes 0.58 -> 0.01).\n    #\n    # So exact partners are excluded from each other's FEATURES, the\n    # way a set and its own indicators already are - arithmetic, not\n    # a discovery. The identity itself is not lost: the `==`\n    # ... (457 more lines in discover.py) ...", "walk": [["Split the people, not the rows", "visits from one person are not independent - a row-wise split leaks the same patient into both halves and confirms nearly anything"], ["Fit, then confirm on the held-out people", "a claim only counts if it predicts patients the model never saw"], ["Return claims with receipts", "skill, which columns drove it, and the measured effect curve - 12 of 13 planted patterns found, zero false ones"]]}]}, {"file": "blueprint.py", "name": "blueprint - the k-anonymous contract", "blurb": "Everything published is an aggregate over at least k PATIENTS - never rows, because one person seen 200 times can supply the ten most extreme rows alone.", "components": [{"label": "Bounds that belong to k patients", "symbol": "_safe_bounds", "file": "blueprint.py", "blurb": "The stored minimum and maximum are the MEAN of the k most extreme patients' own extremes. Storing the true 0th/100th percentile published one person's smallest and largest value for weeks, in a file described as aggregates-only.", "code": "def _safe_bounds(v: pd.Series, groups, k: int):\n    \"\"\"Extremes that belong to at least k patients, not to one.\n\n    Storing the 0th and 100th percentile publishes the exact smallest\n    and largest values in the extract, and those are single people's\n    records. Measured on a lognormal column: the blueprint held 299.6\n    and exactly one row carried it. For a rare lab result or the\n    oldest patient in a small cohort that is identifying, and it sat\n    in a file this project has been calling aggregates-only.\n\n    The bound stored instead is the MEAN of the k most extreme\n    patients' own extremes - a number no individual holds. Counted in\n    PATIENTS, never rows, because one person with two hundred visits\n    can supply the ten most extreme values by themselves.\"\"\"\n    if groups is None:\n        sv = np.sort(v.to_numpy(dtype=float))\n        if len(sv) < 2 * k:\n            return None\n        return float(sv[:k].mean()), float(sv[-k:].mean())\n    g = pd.DataFrame({\"g\": np.asarray(groups)[v.index],\n                      \"v\": v.to_numpy(dtype=float)})\n    lo_each = np.sort(g.groupby(\"g\")[\"v\"].min().to_numpy())\n    hi_each = np.sort(g.groupby(\"g\")[\"v\"].max().to_numpy())\n    if len(lo_each) < 2 * k:\n        return None\n    lo = float(lo_each[:k].mean())\n    hi = float(hi_each[-k:].mean())\n    return (lo, hi) if hi > lo else None", "walk": [["Never publish one person's extreme", "the stored minimum and maximum are averages over the ten most extreme PATIENTS - the true max belonged to one findable person"], ["Count patients, never rows", "one person seen 200 times could otherwise set the bound alone and still be called anonymous"]]}, {"label": "The tail's own mean", "symbol": "_tail_mean", "file": "blueprint.py", "blurb": "A straight line from the last knot to the bound mis-centres a heavy tail: knots at 316 and 2175, true segment mean 529, straight line 1242 - one segment carried 7.13 of a 9.97 excess. Publishing the tail mean took the extract from 18/34 columns centred to 30/33.", "code": "def _tail_mean(v: pd.Series, groups, cut: float, upper: bool,\n               k: int) -> Optional[float]:\n    \"\"\"What the values in the extreme segment actually average.\n\n    WHY IT HAS TO BE PUBLISHED. Generation inverts the quantile grid by\n    interpolating between knots, which assumes the density is UNIFORM\n    between them. Across the top 1% that assumption is not slightly\n    wrong, it is the whole error: measured on a heavy-tailed column\n    whose published knots ran 316.1 at q=0.99 and 2175.0 at the safe\n    maximum, the true mean of that segment is 529.0 and a straight line\n    draws 1241.7. That one segment supplied 7.13 of a 9.97 excess in\n    the column's mean - the rest of the grid, all nine other segments\n    together, supplied 2.84. The bound alone cannot fix it, because the\n    bound is where the tail ENDS and this is how it is shaped.\n\n    It cannot be solved from the column mean already published, either.\n    For that same column the top segment would have to average 246 to\n    absorb the whole error, which is below its own lower knot and so\n    unreachable by any monotone draw. The tail's own mean is genuinely\n    missing information.\n\n    AVERAGED OVER PATIENTS, for the reason the bounds are: one person\n    seen two hundred times holds the top 1% of ROWS by themselves, and\n    a row-counted mean would then publish that person's average. Each\n    patient in the segment contributes their own mean once, and at\n    least k patients must be present or nothing is published and\n    generation keeps the straight line.\"\"\"\n    arr = v.to_numpy(dtype=float)\n    sel = arr >= cut if upper else arr <= cut\n    if not sel.any():\n        return None\n    if groups is None:\n        # No patient column: fall back to rows, at the same 2k floor\n        # the bounds use when they have nothing better either.\n        vals = arr[sel]\n        return float(vals.mean()) if len(vals) >= 2 * k else None\n    g = np.asarray(groups)[v.index][sel]\n    per = pd.DataFrame({\"g\": g, \"v\": arr[sel]}).groupby(\"g\")[\"v\"].mean()\n    if len(per) < k:\n        return None\n    return float(per.mean())", "walk": [["Say what the extreme 1% actually averages", "a straight line across the top segment mis-centred heavy columns - true mean 529, straight line 1242"], ["Publish it k-screened", "the tail mean is an average over at least ten patients, or it is not published at all"]]}, {"label": "A set publishes every token above k", "symbol": "_list_marginal", "file": "blueprint.py", "blurb": "Sharing the 60-level category cap sent every published share about 3x high - a set has no __other__ to absorb the rest. Now: every token that clears k, size measured over the PUBLISHABLE vocabulary, and the k rule's cost stated in tokens per row. On the extract: 54 of 91 shares missing became 0 of 62.", "code": "def _list_marginal(raw: pd.Series, groups, k: int = 10):\n    \"\"\"A column holding a SET, modelled as one.\n\n    CONFIRMED ON THE REAL EXTRACT, not assumed. `conditions` came out\n    69% `__other__` and `active_drugs` 53%, and the diagnostic said\n    why: 73% and 74% of their values contain a semicolon, across\n    31,522 and 16,882 distinct COMBINATIONS. Every combination had\n    become its own level, so almost all of them fell under k and the\n    column was suppressed for being the wrong shape rather than for\n    holding rare values.\n\n    It cost structure too. Of ten categorical associations measured\n    for the first time on that run, five were lost, and three of those\n    five involved these columns - `condition_count <- conditions` fell\n    from 0.54 to 0.03.\n\n    So the set is modelled as a set: which tokens appear, how often\n    each does, and how many of them a row carries. A token held by\n    fewer than k PATIENTS is not published, for the same reason a\n    level is not.\n\n    WHAT THIS DOES NOT DO. Tokens are drawn independently given the\n    set size, so co-occurrence is not modelled - two drugs always\n    prescribed together will appear together only by chance. Said here\n    rather than found later.\"\"\"\n    # THE VOCABULARY COMES FROM `sets.vocabulary`, NOT FROM A SECOND\n    # COPY OF IT HERE. The defect this whole path exists to close is\n    # discovery and generation disagreeing about what a set column\n    # contains; screening tokens twice, in two files, is how that\n    # disagreement comes back. This publishes MORE tokens than\n    # discovery expands - the expansion cap is a cost control on model\n    # fits and has nothing to do with what is safe to publish - so it\n    # asks for every token that clears k.\n    v = _sets.vocabulary(raw, groups, k=k, cap=MAX_SET_TOKENS)\n    if v is None:\n        return None\n    return {\n        \"type\": \"list\",\n        \"separator\": v[\"separator\"],\n        \"tokens\": v[\"tokens\"],\n        \"set_size\": v[\"set_size\"],\n        # THE SIZE IS THE PUBLISHABLE SIZE, and what the source held\n        # travels beside it so the report can name the difference\n        # rather than leaving a reader to discover that generated\n        # sets are shorter than real ones.\n        \"mean_set_size\": v[\"mean_set_size\"],\n        \"mean_set_size_source\": v[\"mean_set_size_source\"],\n        \"empty_after_k_share\": v[\"empty_after_k_share\"],\n        \"empty_in_source_share\": v[\"empty_in_source_share\"],\n        \"unpublishable_row_share\": v[\"unpublishable_row_share\"],\n        \"distinct_combinations\": v[\"distinct_combinations\"],\n        \"tokens_found\": v[\"tokens_found\"],\n        \"tokens_above_k\": v[\"tokens_above_k\"],\n        \"tokens_are_k_anonymous\": k,\n        \"note\": \"tokens are drawn independently given the set size, \"\n                \"so co-occurrence between them is NOT modelled\",\n    }", "walk": [["Publish every list item at least ten patients carry", "capping at 60 forced the survivors to absorb everyone else's share - each came out three times too common"], ["Measure list length over what is publishable", "and state the anonymisation cost in items per row, so a shorter list reads as privacy, not a bug"]]}, {"label": "Invented labels for what k forbids", "symbol": "_categorical_marginal", "file": "blueprint.py", "blurb": "A high-cardinality column - codes, SKUs, free text - used to come out as __other__ on every row. Now the SHAPE is published (distinct count, row share, frequency profile, extremes k-screened) and generation invents obviously synthetic labels: 1,436 distinct in, 1,087 out, zero real labels republished.", "code": "def _categorical_marginal(s: pd.Series, groups=None,\n                          k: int = 10,\n                          raw: Optional[pd.Series] = None\n                          ) -> Dict[str, Any]:\n    counts = s.dropna().astype(str).value_counts()\n    counts_all = counts\n    total = float(counts.sum()) or 1.0\n    rare, rare_share = [], 0.0\n    if groups is not None:\n        # A LEVEL HELD BY FEW PATIENTS NAMES THEM. Counted in patients\n        # rather than rows for the same reason the bounds are: one\n        # person seen two hundred times would otherwise look like a\n        # crowd.\n        obs = s.dropna().astype(str)\n        holders = pd.DataFrame(\n            {\"g\": np.asarray(groups)[obs.index], \"v\": obs.to_numpy()}\n        ).groupby(\"v\")[\"g\"].nunique()\n        rare = [lv for lv in counts.index\n                if int(holders.get(str(lv), 0)) < k]\n        # Measured BEFORE the drop: what share of the column leaves\n        # with those levels. Without it the published probabilities\n        # sum to less than one and nothing says why, so `validate`\n        # reported deliberate k-anonymity suppression as \"a bug rather\n        # than an edit\" on six columns of a real run - a warning that\n        # cries wolf every time teaches everyone to ignore warnings.\n        rare_share = float(counts.reindex(rare).fillna(0).sum()) / total\n        counts = counts.drop(index=rare, errors=\"ignore\")\n    kept = counts.iloc[:MAX_LEVELS_KEPT]\n    out = {\n        \"type\": \"levels\",\n        \"levels\": [{\"value\": str(k2), \"p\": round(float(v) / total, 6)}\n                   for k2, v in kept.items()],\n    }\n    # HOW MUCH OF THIS COLUMN IS THE SENTINEL.\n    #\n    # A value outside the level cap becomes `__other__`, and a column\n    # made mostly of it has been DESTROYED - not thinned, destroyed.\n    # Dates did exactly this at 88% and every per-column check stayed\n    # green, because coverage counts presence and the sentinel is\n    # present. Measured since on a plainly tabular file: a currency\n    # column and a time-of-day column each came out at 100%, both\n    # generated as `__other__` on every row, both silent.\n    #\n    # This is the GENERAL form of that fault. Recording the share\n    # means the next unparsed type announces itself without anybody\n    # having anticipated it.\n    from .discover import OTHER\n    sentinel = 0.0\n    for lv in out[\"levels\"]:\n        if lv[\"value\"] == OTHER:\n            sentinel = float(lv[\"p\"])\n    if sentinel > 0:\n        out[\"sentinel_share\"] = round(sentinel, 6)\n    # PUBLISH THE SHAPE, INVENT THE LABELS.\n    #\n    # A level held by fewer than k patients cannot be published - a\n    # code two people carry names them - and a column made of such\n    # levels currently comes out as `__other__` on every row. That is\n    # honest and it is also useless: a downstream model gets a\n    # CONSTANT column where the source had 1,436 distinct values.\n    # Codes, SKUs, postcodes, order ids and free text are all this\n    # shape, so on an ordinary business table a large fraction of the\n    # columns are thrown away.\n    #\n    # What CAN be published is the shape: how many distinct values\n    # there were, what share of rows they covered, and the profile of\n    # their frequencies. Those are aggregates over a crowd of values,\n    # not any value's identity - the same reasoning that lets a\n    # numeric column publish quantiles - and the extremes go through\n    # the same k rule, so the profile never states one level's own\n    # count.\n    #\n    # Generation then invents labels to match. Nothing real leaks,\n    # because no label is real, and the column keeps the structure a\n    # model needs: the right cardinality with the right skew, rather\n    # than one repeated string. The artefact says the labels are\n    # invented, because a synthetic code that LOOKS real is worse\n    # than an obvious placeholder.\n    # THE RAW COLUMN, because by the time it reaches here the frame\n    # has already folded everything past `discover.MAX_LEVELS` into\n    # `__other__`. Counting distinct values on the ENCODED column said\n    # 200 where the source held 1,436, so the shape published would\n    # have described the survivors rather than what was lost.\n    unpub_counts = None\n    if raw is not None:\n        rc = raw.dropna().astype(str)\n        rc = rc[rc.str.len() > 0]\n        if len(rc):\n            allc = rc.value_counts()\n            pub = set(str(lv[\"value\"]) for lv in out[\"levels\"])\n    # ... (50 more lines in blueprint.py) ...", "walk": [["When no label can be published, publish the shape", "how many distinct values, how common, how skewed - aggregates over a crowd of labels, naming none"], ["Let generation invent obviously fake labels to match", "1,436 real codes in, 1,087 synthetic ones out, zero real labels republished - and none look real enough to look up"]]}]}, {"file": "generate.py", "name": "generate - drawing to contract", "blurb": "Marginals, relationships, dynamics, constraints, presence - and the discipline that an acyclic blueprint comes out bit-identical after any cycle work.", "components": [{"label": "A cycle is refined, not just cut", "symbol": "_order", "file": "generate.py", "blurb": "A cycle cannot be ordered, but it does not have to be: the first pass needs an order to get values at all, then two sweeps re-apply the trimmed parents by RE-RANKING the marginal's own draw. Order-dependence 0.192 -> 0.021 on a ring; sign inversions held at zero.", "code": "def _order(bp: Dict[str, Any], refine: bool = True):\n    \"\"\"Pick a direction per relationship and a safe drawing order.\n\n    Strongest first: the better-explained column becomes the child,\n    since that is the direction the evidence actually supports. An\n    edge that would close a cycle is dropped and reported rather than\n    silently reordered - a cycle cannot be sampled at all.\"\"\"\n    cols = list((bp.get(\"columns\") or {}).keys())\n    rels = sorted(bp.get(\"relationships\") or [],\n                  key=lambda r: -float(\n                      (r.get(\"evidence\") or {}).get(\n                          \"skill_out_of_sample\") or 0.0))\n    # AN INDICATOR IS DERIVED, SO ITS SET MUST COME FIRST, and no\n    # discovered edge says so. `conditions__has__t03` is read off the\n    # set that was drawn; nothing relates the two, because a set and\n    # its own indicators are excluded from each other's search as\n    # arithmetic. Without this the topological order is free to place\n    # the indicator first and derive it from a column not yet drawn.\n    derived = {}\n    for c in cols:\n        b = _sets.source_of(c)\n        if b is not None and b in cols:\n            derived[c] = b\n\n    parents: Dict[str, List[Dict[str, Any]]] = {}\n    size_partners_o = _size_partners(bp)\n    copy_partners_o = _copy_partners(bp)\n    # which relationship claimed each pair, so a routed direction can\n    # tell whether its blocker used the indicator as a mere parent\n    used_by: Dict[frozenset, Dict[str, Any]] = {}\n    # Relationships whose child is a derived indicator, keyed by the\n    # SET column that will express them by rearranging its draw.\n    set_rels: Dict[str, List[Dict[str, Any]]] = {}\n    used, dropped = set(), []\n    for r in rels:\n        child = r.get(\"child\")\n        if child not in cols:\n            continue\n        # A DERIVED CHILD IS ROUTED TO ITS SET, NOT DROPPED.\n        #\n        # An indicator is read off the set that was drawn, so nothing\n        # can be applied TO the indicator itself. For weeks that meant\n        # the relationship was dropped outright, and on the real\n        # extract the entire worst-pairs list was this shape -\n        # `drug_routes__has__Charge <- midazolam` at 0.4034 in the\n        # source and -0.0075 generated, bit-identical across two runs\n        # because the loss is by construction.\n        #\n        # A token CAN be selected by another column, though: not by\n        # drawing the indicator, but by choosing WHICH ROW receives\n        # WHICH of the sets already drawn. So the relationship is\n        # handed to the set column, which rearranges its own draw at\n        # generation time. The multiset of sets is untouched - sizes,\n        # token shares, combinations - only the assignment moves,\n        # which is the same device the refinement sweeps use.\n        #\n        # The restatement rule still applies first: sorted by skill,\n        # the stronger direction takes the pair, and both directions\n        # of one dependence must not enter twice.\n        if child in derived:\n            ps_d = [p for p in (r.get(\"parents\") or []) if p in cols]\n            sk_d = round(float((r.get(\"evidence\") or {}).get(\n                \"skill_out_of_sample\") or 0.0), 4)\n            pairs_d = [frozenset([child, p]) for p in ps_d]\n            if not ps_d:\n                continue\n            if all(q in used for q in pairs_d):\n                # A PAIR CLAIMED BY INDICATOR-AS-PARENT DOES NOT\n                # BLOCK THE ROUTE. `procedure_count <- [severity,\n                # procedures__n, visit_type]` outranks\n                # `procedures__n <- procedure_count` and claims their\n                # pair - but that direction leaves the SET's sizes a\n                # free marginal draw, so everything mediated through\n                # the set dies: vtype -> count -> size read 0.49 in\n                # the source and 0.019 generated, with routing never\n                # firing at all. The dependence must still enter\n                # exactly once, so the indicator is STRIPPED from the\n                # claiming relationship's parents and the pair moves\n                # to the routed direction, where mediation flows -\n                # the set follows the count, and whatever follows the\n                # count reaches the set.\n                blockers = [q for q in pairs_d\n                            if q in used_by and any(\n                                pp in derived\n                                for pp in used_by[q].get(\"parents\",\n                                                         []))]\n                if len(blockers) != len(\n                        [q for q in pairs_d if q in used]):\n                    dropped.append({\n                        \"child\": child, \"parents\": ps_d,\n    # ... (271 more lines in generate.py) ...", "walk": [["Give the tangled graph an order once, to get values", "some columns predict each other in a loop, and a loop cannot be ordered without cutting something"], ["Then re-apply what was cut, by re-ranking", "the same values, rearranged - the marginal cannot drift and the sweep cannot run away"], ["Leave untangled data byte-identical", "asserted, and mutation-tested: if this changed acyclic output it would be a rewrite wearing a bugfix's clothes"]]}, {"label": "Token weights solved, damped", "symbol": "_token_weights", "file": "generate.py", "blurb": "A published token p is a share of rows, not a sampling weight. The undamped solve converged at 8 tokens and OSCILLATED at 2,538 - head and tail swapped places. Damped, 0 of 2,500 shares miss at the extract's own shape.", "code": "def _token_weights(m, sizes_per_row, seed):\n    \"\"\"Sampling weights SOLVED so the drawn shares measure back.\n\n    The published token `p` is a SHARE - the fraction of rows whose\n    set contains the token - but the draw was feeding it straight in\n    as a sampling weight for without-replacement picks, and inclusion\n    under weighted sampling is not proportional to weight: common\n    tokens saturate, rare ones ride along, and with the vocabulary\n    capped below the source's the whole budget lands unevenly. On the\n    real extract 44 of 96 token shares missed by more than 0.05.\n\n    Two steps. The TARGETS are the published shares rescaled so their\n    total equals the token budget actually being drawn - with only 24\n    of 60 tokens published, every kept token must run proportionally\n    hot, and that is a fact about the cap, not a knob. Then the\n    WEIGHTS are solved by the same loop as every other fed-back\n    statistic: draw, measure, adjust, with a fixed seed per trial so\n    the iteration converges instead of wandering.\"\"\"\n    toks = [t[\"value\"] for t in (m.get(\"tokens\") or [])]\n    if not toks:\n        return None, None\n    p_pub = np.asarray([max(float(t[\"p\"]), 1e-6)\n                        for t in m[\"tokens\"]], dtype=float)\n    ks = np.asarray([0 if k is None else int(k)\n                     for k in sizes_per_row], dtype=int)\n    ks = np.clip(ks, 0, len(toks))\n    budget = float(ks.mean())\n    if budget <= 0:\n        return toks, p_pub / p_pub.sum()\n    targets = p_pub * (budget / p_pub.sum())\n    targets = np.clip(targets, 1e-6, 1.0)\n    w = p_pub.copy()\n    n = len(ks)\n    # Trials on a SAMPLE of rows: the solve needs the k distribution,\n    # not every row, and six calibration passes over 55k rows would\n    # cost more than the draw itself.\n    samp = (np.arange(n) if n <= 4000 else\n            np.random.RandomState(seed % (2 ** 31)).choice(\n                n, 4000, replace=False))\n    for it in range(12):\n        r2 = np.random.RandomState((seed + 977 * it) % (2 ** 31))\n        got = np.zeros(len(toks))\n        ww = w / w.sum()\n        for i in samp:\n            k_ = ks[i]\n            if k_ <= 0:\n                continue\n            got[r2.choice(len(toks), size=k_, replace=False,\n                          p=ww)] += 1.0\n        ach = np.clip(got / len(samp), 1e-6, None)\n        # DAMPED, because an undamped multiplicative update DIVERGES\n        # once the vocabulary is large. At eight tokens the raw ratio\n        # converges in six passes; at 2,538 - the scale a real\n        # `conditions` column reaches once the level cap stops\n        # truncating it - it oscillates, and the head and tail SWAP:\n        # a token published at 0.4514 came out at 0.0227 while one\n        # published at 0.0159 came out at 0.3657, and the misses pair\n        # off - a solve that had merely run out of iterations would\n        # miss LOW everywhere instead of swapping ends.\n        #\n        # It was undamped from the day it was written, and the check\n        # that covered it used EIGHT tokens, which is inside the\n        # range where the raw ratio converges. The cap was hiding the\n        # scale: nothing could reach a large vocabulary while the\n        # marginal published sixty, so uncapping it and this are one\n        # change, not two.\n        w = np.clip(w * (targets / ach) ** 0.5, 1e-9, None)\n    return toks, w / w.sum()", "walk": [["Solve for weights until drawn shares measure back", "a published share is not a sampling weight - fed in raw, 44 of 96 shares missed"], ["Damp the update so it cannot oscillate", "at 2,538 items the undamped solve swapped the most and least common - damped, zero of 2,500 miss"]]}, {"label": "Rounding where the mass sits", "symbol": "_to_integers", "file": "generate.py", "blurb": "Rounding at .5 moved 11.3 points of mass off zero on a count that is 73.8% zeros. The cut is placed where the column's published mean says; a zero POINT MASS lost to the relationship path is restored by rank, zeros to the lowest-predicted rows - point mass exact, spearman within 0.03.", "code": "def _to_integers(out, m):\n    \"\"\"Round a whole-number column WHERE THE MASS ACTUALLY SITS.\n\n    Rounding at .5 is only right if the value is equally likely either\n    side of it, and between two knots holding different integers it is\n    not. Measured on a count column that is 73.8% zeros: the published\n    grid steps from 0 at q=0.50 to 1 at q=0.75, the straight line ramps\n    across that quarter of the draw, and everything above the halfway\n    point rounds up - 11.3 points of mass moved off zero, and the mean\n    read 0.4165 against 0.3019.\n\n    So the cut is placed where the column's own mean says it belongs.\n    floor(x + t) is monotone in t, which makes this a bisection with no\n    local minima. It is the published mean doing the work, not a new\n    number, and the whole distribution improves rather than only the\n    statistic being matched: total variation against the source fell\n    from 0.124 to 0.042 on that column.\"\"\"\n    target = m.get(\"mean\")\n    if target is None:\n        return np.round(out)\n    lo, hi = 0.0, 1.0\n    for _ in range(50):\n        mid = (lo + hi) / 2.0\n        if float(np.floor(out + mid).mean()) < float(target):\n            lo = mid\n        else:\n            hi = mid\n    return np.floor(out + (lo + hi) / 2.0)", "walk": [["Round where the mass sits, not at .5", "on a count that is mostly zeros, rounding at .5 moved 11 points of mass off zero"], ["Put a zero spike back by rank", "a curve is smooth and cannot produce 'exactly zero, 31.4% of the time' - the zeros go to the rows the curve predicted lowest, so the relationship survives"]]}, {"label": "One vocabulary for both draws", "symbol": "effective_levels", "file": "generate.py", "blurb": "The sticky draw and the plain draw both read the level list here. Adding invented labels to one path left the other at 100% __other__ - two paths reading the blueprint separately is how the two sides come to disagree.", "code": "def effective_levels(m: Dict[str, Any]):\n    \"\"\"The levels a categorical column may be drawn from, and their\n    probabilities - INCLUDING the invented ones.\n\n    ONE VOCABULARY, AND EVERY PATH CALLS IT. There are two places a\n    categorical column is produced: the sticky draw, for a column\n    with visit-to-visit persistence, and the plain draw. Both read\n    `m[\"levels\"]` straight out of the blueprint, so a capability\n    added to one of them silently does not exist in the other -\n    `note` came out 100% `__other__` while `code`, the same kind of\n    column, generated invented labels correctly. This file already\n    records that shape of bug for set tokens: screening twice, in two\n    files, is how the two sides come to disagree.\n\n    So the invented labels are materialised into the level list here,\n    once, and neither draw path needs to know they are special.\"\"\"\n    levels = m.get(\"levels\") or []\n    inv = m.get(\"invented_labels\") or None\n    share = float((inv or {}).get(\"share\") or 0.0)\n    real = [l for l in levels if str(l.get(\"value\")) != \"__other__\"]\n    if not inv or share <= 0:\n        use = levels if not inv else (real or levels)\n        vals = [l[\"value\"] for l in use]\n        p = np.asarray([max(float(l.get(\"p\", 0.0)), 0.0) for l in use])\n        return vals, (p / p.sum() if p.sum() > 0\n                      else np.full(max(len(vals), 1), 1.0)\n                      / max(len(vals), 1))\n    card = int(inv.get(\"distinct\") or 0)\n    q = [float(x) for x in (inv.get(\"profile_q\") or [])]\n    pv = [float(x) for x in (inv.get(\"profile_p\") or [])]\n    if card > 0 and len(q) >= 2 and len(q) == len(pv):\n        w = np.interp(np.linspace(0.0, 1.0, card), q, pv)\n    else:\n        w = np.ones(max(card, 1))\n    w = np.clip(w, 1e-12, None)\n    w = w / w.sum() * min(share, 1.0)\n    vals = [\"synthetic_{:06d}\".format(i + 1) for i in range(card)]\n    p = list(w)\n    keep_share = max(0.0, 1.0 - min(share, 1.0))\n    if real and keep_share > 0:\n        rp = np.asarray([max(float(l.get(\"p\", 0.0)), 0.0)\n                         for l in real])\n        rp = (rp / rp.sum() * keep_share) if rp.sum() > 0 else rp\n        vals = [l[\"value\"] for l in real] + vals\n        p = list(rp) + p\n    p = np.asarray(p, dtype=float)\n    return vals, (p / p.sum() if p.sum() > 0\n                  else np.full(len(vals), 1.0 / max(len(vals), 1)))", "walk": [["Define the category vocabulary once", "two draw paths each read the blueprint directly, and a capability added to one silently did not exist in the other"], ["Blend real and invented labels here", "published labels keep their shares; the unpublishable mass gets the synthetic vocabulary"]]}, {"label": "Never clamp - squeeze", "symbol": "_pin_to_bounds", "file": "generate.py", "blurb": "Out-of-bound values are squeezed into the headroom order-preserved, never clamped to the wall - a clamp puts a spike at the bound that reads as a finding.", "code": "def _pin_to_bounds(vals, lo, hi, integral):\n    \"\"\"Bring values past the published bound back inside, in order.\n\n    THE BOUND IS THE k RULE'S PROMISE - the mean of the k most extreme\n    patients' own extremes - and three things stepped over it: the\n    systematic parent term, which nothing ever pinned for a column\n    outside a cycle; the noise added back after it; and integer\n    rounding, which turns a draw of 18.21 into 18 against a floor of\n    18.2. On the real extract that was five columns publishing what\n    the rule said nobody's data would, one of them 25% past.\n\n    NOT A CLAMP. Clamping piles every violator onto the bound and\n    moves the centre - the exact loss the swap-repair for constraints\n    exists to avoid. The violators are the column's extreme ranks, so\n    they are SQUEEZED, in rank order, into the headroom between the\n    most extreme value already inside and the bound itself. Order is\n    preserved exactly, so every relationship measured on ranks is\n    untouched; the values move only as far as the promise requires.\n\n    AN INTEGRAL COLUMN'S REAL BOUND IS THE NEAREST WHOLE NUMBER\n    INSIDE. A whole-number column cannot publish 22.8, so its ceiling\n    is 22 - rounding to 23 first and pinning to 22.8 after would leave\n    the violation in place. For the handful of integral violators the\n    squeeze collapses onto that whole number; at the counts involved\n    (one to eleven values in fifty-five thousand rows) the pile is\n    invisible to centre and spread, and the count is reported either\n    way.\n\n    Returns `(values, n_pinned)`.\"\"\"\n    v = np.asarray(vals, dtype=float).copy()\n    ok = np.isfinite(v)\n    lo_eff = float(np.ceil(lo)) if integral else float(lo)\n    hi_eff = float(np.floor(hi)) if integral else float(hi)\n    if hi_eff < lo_eff:\n        return v, 0\n    n_pinned = 0\n    for upper in (True, False):\n        bad = ok & ((v > hi_eff) if upper else (v < lo_eff))\n        nb = int(bad.sum())\n        if not nb:\n            continue\n        n_pinned += nb\n        inside = ok & ~bad & (v <= hi_eff) & (v >= lo_eff)\n        if upper:\n            base = float(v[inside].max()) if inside.any() else lo_eff\n            span = hi_eff - base\n            ranks = np.argsort(np.argsort(v[bad]))\n            new = (base + span * (ranks + 1.0) / nb if span > 0\n                   else np.full(nb, hi_eff))\n        else:\n            base = float(v[inside].min()) if inside.any() else hi_eff\n            span = base - lo_eff\n            ranks = np.argsort(np.argsort(v[bad]))\n            new = (base - span * (nb - ranks) / nb if span > 0\n                   else np.full(nb, lo_eff))\n        if integral:\n            new = np.clip(np.round(new), lo_eff, hi_eff)\n        v[bad] = new\n    return v, n_pinned", "walk": [["Squeeze out-of-bound values into the headroom", "keeping their order - never clamp, because a clamp piles a spike at the wall that reads as a finding"]]}]}, {"file": "sets.py", "name": "sets - one vocabulary, both halves", "blurb": "What a set column is, screened by PATIENTS, defined once - screening tokens twice in two files is how the two sides came to disagree.", "components": [{"label": "Vocabulary screened by patients", "symbol": "vocabulary", "file": "sets.py", "blurb": "A token held by fewer than k patients is not published. Present-and-empty rows are counted - 80.7% of `procedures` visits are genuinely empty, and generation says so instead of inventing procedures for them.", "code": "def vocabulary(raw: pd.Series, groups, k: int = 10,\n               cap: int = 0) -> Optional[Dict[str, Any]]:\n    \"\"\"Which tokens this column holds, screened by PATIENTS.\n\n    `cap` limits how many are returned, most common first; 0 means\n    every token that clears k. A token held by fewer than k patients\n    is not published, for the same reason a level is not - and it is\n    patients, never rows, because one person seen two hundred times\n    would otherwise carry a token over the bound alone.\n\n    Returns None when the column is not a set, so a caller can fall\n    through to the ordinary categorical path.\"\"\"\n    # PRESENT-AND-EMPTY IS A ROW THIS COLUMN HAS, and dropping it\n    # here is why generation invents content for visits that had\n    # none. A `drug_routes` list is empty when the visit had no\n    # drugs; that is a fact about the visit, not an absence of\n    # information, and `coverage` already counts such a row as\n    # present because it tests `notna`.\n    #\n    # Measured on the real extract: excluding them made the published\n    # `p` a share of NON-EMPTY rows while the fidelity comparison\n    # measured a share of ALL present rows, and the five `drug_routes`\n    # tokens outside tolerance were all high by the same 1.57x - a\n    # constant multiplier across five tokens is a denominator, not a\n    # sampler. 1/1.57 = 0.637 is the share of rows that had routes.\n    #\n    # WHETHER THE COLUMN IS A SET is still judged on the rows with\n    # content - a separator cannot be detected in an empty string,\n    # and a column should not stop being a set because many of its\n    # rows are legitimately empty.\n    present = raw.dropna().astype(str).str.strip()\n    filled = present[present.str.len() > 0]\n    if len(filled) < MIN_ROWS:\n        return None\n    sep = _separator(filled)\n    if sep is None:\n        return None\n    if float(filled.str.split(sep).map(len).mean()) < MIN_MEAN_SIZE:\n        return None\n    txt = present\n    parts = txt.str.split(sep)\n    sizes = parts.map(\n        lambda ts: sum(1 for x in ts if x.strip()))\n\n    g = pd.Series(np.asarray(groups)[txt.index], index=txt.index)\n    holders: Dict[str, set] = {}\n    counts: Dict[str, int] = {}\n    for idx, toks in parts.items():\n        who = g.loc[idx]\n        for tok in set(x.strip() for x in toks if x.strip()):\n            holders.setdefault(tok, set()).add(who)\n            counts[tok] = counts.get(tok, 0) + 1\n    kept = [(tok, counts[tok]) for tok, who in holders.items()\n            if len(who) >= k]\n    if len(kept) < 2:\n        return None\n    kept.sort(key=lambda x: (-x[1], x[0]))\n    n_found = len(holders)\n    n_kept = len(kept)\n    if cap and len(kept) > cap:\n        kept = kept[:cap]\n\n    n_rows = float(len(txt))\n    # SIZE IS MEASURED OVER THE TOKENS THAT CAN BE PUBLISHED, not\n    # over every token the source row held.\n    #\n    # A set drawn at the source's own size has to fill that size from\n    # a vocabulary the k rule has thinned, so every surviving token\n    # runs proportionally hot - on the real extract `conditions`\n    # found 7,974 tokens, 1,050 cleared a k=10 PATIENT floor, and the\n    # 6,924 rare ones
